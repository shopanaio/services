extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: ["@key", "@shareable", "@external"]
  )

extend type Query {
  """
  Online Store content query namespace.
  """
  onlineStoreAppQuery: OnlineStoreAppQuery!
}

extend type Mutation {
  """
  Online Store content mutation namespace.
  """
  onlineStoreAppMutation: OnlineStoreAppMutation!
}

"""
Admin queries scoped to the active Online Store App installation.
"""
type OnlineStoreAppQuery {
  """
  Get an Online Store node by its global ID.
  """
  node(id: ID!): Node

  """
  Get Online Store nodes by their global IDs.
  """
  nodes(ids: [ID!]!): [Node]!

  """
  Get a page by its global ID.
  """
  page(id: ID!): OnlineStorePage

  """
  Get a page by its URL handle.
  """
  pageByHandle(handle: String!): OnlineStorePage

  """
  Get pages with Relay-style pagination.
  """
  pages(
    first: Int
    after: String
    last: Int
    before: String
    where: OnlineStorePageWhereInput
    orderBy: [OnlineStorePageOrderByInput!]
  ): OnlineStorePageConnection!

  """
  Get a navigation menu by its global ID.
  """
  navigationMenu(id: ID!): OnlineStoreNavigationMenu

  """
  Get a navigation menu by its URL handle.
  """
  navigationMenuByHandle(handle: String!): OnlineStoreNavigationMenu

  """
  Get navigation menus with Relay-style pagination.
  """
  navigationMenus(
    first: Int
    after: String
    last: Int
    before: String
    where: OnlineStoreNavigationMenuWhereInput
    orderBy: [OnlineStoreNavigationMenuOrderByInput!]
  ): OnlineStoreNavigationMenuConnection!
}

"""
Admin mutations scoped to the active Online Store App installation.
"""
type OnlineStoreAppMutation {
  pageCreate(input: OnlineStorePageCreateInput!): OnlineStorePageCreatePayload!
  pageUpdate(pageId: ID!, operations: OnlineStorePageUpdateInput!): OnlineStorePageUpdatePayload!
  pageDelete(pageId: ID!): OnlineStorePageDeletePayload!
  navigationMenuCreate(
    input: OnlineStoreNavigationMenuCreateInput!
  ): OnlineStoreNavigationMenuCreatePayload!
  navigationMenuUpdate(
    navigationMenuId: ID!
    operations: OnlineStoreNavigationMenuUpdateInput!
  ): OnlineStoreNavigationMenuUpdatePayload!
  navigationMenuDelete(navigationMenuId: ID!): OnlineStoreNavigationMenuDeletePayload!
}
