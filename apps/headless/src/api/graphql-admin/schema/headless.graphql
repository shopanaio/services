extend schema @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@key", "@shareable"])

"""
An ISO 8601 date-time string.
"""
scalar DateTime

"""
An object with a globally unique ID.
"""
interface Node {
  """
  The globally unique ID of the object.
  """
  id: ID!
}

"""
A user-facing mutation error.
"""
interface UserError {
  """
  A human-readable error message.
  """
  message: String!

  """
  The input path associated with the error.
  """
  field: [String!]

  """
  A stable machine-readable error code.
  """
  code: String
}

"""
A generic user-facing mutation error.
"""
type GenericUserError implements UserError @shareable {
  message: String!
  field: [String!]
  code: String
}

"""
Whether a credential is safe for public clients or restricted to servers.
"""
enum StorefrontCredentialKind {
  PUBLIC
  PRIVATE
}

"""
Lifecycle state of a storefront credential.
"""
enum StorefrontCredentialStatus {
  ACTIVE
  REVOKED
}

"""
Risk level shown when an administrator grants a Storefront permission.
"""
enum HeadlessStorefrontPermissionRisk {
  LOW
  MEDIUM
  HIGH
}

"""
A permission available to a Headless storefront connection.
"""
type HeadlessStorefrontPermissionDefinition {
  """
  Canonical permission scope stored in the access policy.
  """
  handle: String!

  """
  Protected Storefront API resource.
  """
  resource: String!

  """
  Supported resource action: read or write.
  """
  action: String!

  """
  Human-readable permission label.
  """
  label: String!

  """
  What granting this permission allows the storefront to do.
  """
  description: String!

  """
  Risk level used by Admin UI when presenting the permission.
  """
  risk: HeadlessStorefrontPermissionRisk!
}

"""
The Storefront API permissions granted to a Headless storefront.
"""
type StorefrontAccessPolicy {
  """
  Immutable, sorted Storefront permission handles.
  """
  permissions: [String!]!

  """
  Internal configuration revision.
  """
  revision: Int!

  """
  When the policy or its grants were last changed.
  """
  updatedAt: DateTime!
}

"""
Credential metadata. Private plaintext is never exposed by this type.
"""
type StorefrontCredential implements Node @key(fields: "id") {
  id: ID!
  kind: StorefrontCredentialKind!
  status: StorefrontCredentialStatus!
  label: String

  """
  A redacted suffix suitable for identifying the credential.
  """
  tokenHint: String!

  createdAt: DateTime!
  lastUsedAt: DateTime
  revokedAt: DateTime
}

"""
Plaintext credentials returned only by the initial create mutation.
"""
type StorefrontInitialCredentials {
  publicAccessToken: String!
  privateAccessToken: String!
}

"""
Lifecycle state of a Headless storefront connection.
"""
enum HeadlessStorefrontStatus {
  ACTIVE
  SUSPENDED
  DISCONNECTED
}

"""
An independent custom storefront owned by the Headless App installation.
"""
type HeadlessStorefront implements Node @key(fields: "id") {
  id: ID!
  displayName: String!
  status: HeadlessStorefrontStatus!
  storefrontAccessPolicy: StorefrontAccessPolicy

  """
  The repeat-readable public token, subject to Admin authorization.
  """
  publicAccessToken: String

  """
  Credential metadata without recoverable private token values.
  """
  storefrontCredentials: [StorefrontCredential!]!

  createdAt: DateTime!
  updatedAt: DateTime!
}

type HeadlessStorefrontConnection {
  edges: [HeadlessStorefrontEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type HeadlessStorefrontEdge {
  node: HeadlessStorefront!
  cursor: String!
}

type PageInfo @shareable {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

"""
Input for creating a private credential for an existing storefront.
"""
input StorefrontPrivateCredentialCreateInput {
  label: String!
}

"""
Input for creating a Headless storefront connection.
"""
input HeadlessStorefrontCreateInput {
  displayName: String!

  """
  Initial Storefront API permissions. Uses App defaults when omitted.
  """
  permissions: [String!]
}

"""
Input for a lifecycle action on an existing Headless storefront.
"""
input HeadlessStorefrontActionInput {
  reason: String
}

"""
Input for changing a Headless storefront display name.
"""
input HeadlessStorefrontUpdateInput {
  displayName: String
  lifecycle: HeadlessStorefrontLifecycleOperationInput
  credentials: [HeadlessStorefrontCredentialOperationInput!]
  accessPolicy: StorefrontAccessPolicyUpdateInput
}

"""
Input for revoking an existing private storefront credential.
"""
input StorefrontCredentialRevokeInput {
  credentialId: ID!
}

"""
Input for replacing the complete Storefront permission grant set.
"""
input StorefrontAccessPolicyUpdateInput {
  permissions: [String!]!
}

enum HeadlessStorefrontLifecycleAction {
  SUSPEND
  RESUME
}

input HeadlessStorefrontLifecycleOperationInput {
  action: HeadlessStorefrontLifecycleAction!
  reason: String
}

enum HeadlessStorefrontCredentialOperationAction {
  CREATE
  REVOKE
}

input HeadlessStorefrontCredentialOperationInput {
  action: HeadlessStorefrontCredentialOperationAction!
  credentialId: ID
  values: StorefrontPrivateCredentialCreateInput
}

enum HeadlessStorefrontOperationType {
  DISPLAY_NAME
  LIFECYCLE
  CREDENTIAL
  ACCESS_POLICY
}

type HeadlessStorefrontOperationResult {
  type: HeadlessStorefrontOperationType!
  applied: Boolean!
  entityId: ID
  credential: StorefrontCredential
  privateAccessToken: String
  policy: StorefrontAccessPolicy
  errors: [GenericUserError!]!
}

"""
Payload returned after creating a Headless storefront.
"""
type HeadlessStorefrontCreatePayload {
  headlessStorefront: HeadlessStorefront

  """
  Present only for the first successful execution.
  """
  initialStorefrontCredentials: StorefrontInitialCredentials

  userErrors: [GenericUserError!]!
}

"""
Payload returned after creating a private storefront credential.
"""
type StorefrontPrivateCredentialCreatePayload {
  credential: StorefrontCredential

  """
  Plaintext returned only for the first successful execution.
  """
  privateAccessToken: String

  userErrors: [GenericUserError!]!
}

"""
Payload returned after revoking a private storefront credential.
"""
type StorefrontCredentialPayload {
  credential: StorefrontCredential

  userErrors: [GenericUserError!]!
}

"""
Payload returned after updating a storefront access policy.
"""
type StorefrontAccessPolicyPayload {
  policy: StorefrontAccessPolicy
  userErrors: [GenericUserError!]!
}

"""
Payload returned after changing a Headless storefront.
"""
type HeadlessStorefrontUpdatePayload {
  headlessStorefront: HeadlessStorefront
  operationResults: [HeadlessStorefrontOperationResult!]!
  userErrors: [GenericUserError!]!
}

extend type Query {
  """
  Headless App queries for the active installation.
  """
  headlessAppQuery: HeadlessAppQuery!
}

extend type Mutation {
  """
  Headless App mutations for the active installation.
  """
  headlessAppMutation: HeadlessAppMutation!
}

"""
Headless App query namespace.
"""
type HeadlessAppQuery {
  """
  Permission catalog used to render the Headless access policy editor.
  """
  headlessStorefrontPermissionCatalog: [HeadlessStorefrontPermissionDefinition!]!

  """
  Default permissions selected for a new Headless storefront.
  """
  headlessStorefrontDefaultPermissions: [String!]!

  """
  List Headless storefronts owned by the active installation.
  """
  headlessStorefronts(
    first: Int
    after: String
    last: Int
    before: String
  ): HeadlessStorefrontConnection!

  """
  Get a Headless storefront by its global ID.
  """
  headlessStorefront(id: ID!): HeadlessStorefront
}

"""
Headless App mutation namespace.
"""
type HeadlessAppMutation {
  """
  Create a storefront, its access policy, and its initial credentials.
  """
  headlessStorefrontCreate(input: HeadlessStorefrontCreateInput!): HeadlessStorefrontCreatePayload!

  """
  Change the display name of an existing storefront.
  """
  headlessStorefrontUpdate(
    headlessStorefrontId: ID!
    operations: HeadlessStorefrontUpdateInput!
  ): HeadlessStorefrontUpdatePayload!

  """
  Permanently disconnect a storefront and revoke its credentials.
  """
  headlessStorefrontDelete(headlessStorefrontId: ID!): HeadlessStorefrontDeletePayload!
}

type HeadlessStorefrontDeletePayload {
  deletedHeadlessStorefrontId: ID
  userErrors: [GenericUserError!]!
}
