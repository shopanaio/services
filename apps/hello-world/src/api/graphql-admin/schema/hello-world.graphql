type HelloWorldGreeting {
  message: String!
  appCode: String!
}

type HelloWorldSecretDigest {
  sha256: String!
}

extend type Query {
  """
  Hello World App query namespace.
  """
  helloWorldAppQuery: HelloWorldAppQuery!
}

"""
Hello World App queries.
"""
type HelloWorldAppQuery {
  helloWorldGreeting: HelloWorldGreeting!
  helloWorldSecretDigest(name: String!): HelloWorldSecretDigest!
}
