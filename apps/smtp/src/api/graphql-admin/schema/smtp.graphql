extend schema @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@key", "@shareable"])

scalar DateTime

interface Node {
  id: ID!
}

interface UserError {
  message: String!
  field: [String!]
  code: String
}

type GenericUserError implements UserError @shareable {
  message: String!
  field: [String!]
  code: String
}

enum SmtpConfigurationProvider {
  CUSTOM
  SENDGRID
  MAILCHIMP_TRANSACTIONAL
  GOOGLE_WORKSPACE
}

enum SmtpConfigurationStatus {
  ACTIVE
  INACTIVE
  DISCONNECTED
}

enum SmtpConfigurationSecurity {
  NONE
  STARTTLS
  TLS
}

type SmtpProviderPreset {
  provider: SmtpConfigurationProvider!
  label: String!
  host: String
  port: Int!
  security: SmtpConfigurationSecurity!
  username: String
}

type SmtpConfiguration implements Node @key(fields: "id") {
  id: ID!
  displayName: String!
  provider: SmtpConfigurationProvider!
  status: SmtpConfigurationStatus!
  host: String!
  port: Int!
  security: SmtpConfigurationSecurity!
  username: String
  hasPassword: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input SmtpConfigurationCreateInput {
  displayName: String!
  provider: SmtpConfigurationProvider!
  host: String!
  port: Int!
  security: SmtpConfigurationSecurity!
  username: String
  password: String
}

input SmtpConfigurationUpdateInput {
  fields: SmtpConfigurationFieldsInput
  lifecycle: SmtpConfigurationLifecycleOperationInput
}

input SmtpConfigurationFieldsInput {
  displayName: String
  provider: SmtpConfigurationProvider
  host: String
  port: Int
  security: SmtpConfigurationSecurity
  username: String

  """
  Omit to retain the current password or provide a value to replace it.
  Clear the username to remove credentials from the connection.
  """
  password: String
}

enum SmtpConfigurationLifecycleAction {
  ACTIVATE
}

input SmtpConfigurationLifecycleOperationInput {
  action: SmtpConfigurationLifecycleAction!
}

enum SmtpConfigurationOperationType {
  FIELDS
  LIFECYCLE
}

type SmtpConfigurationOperationResult {
  type: SmtpConfigurationOperationType!
  applied: Boolean!
  entityId: ID
  errors: [GenericUserError!]!
}

type SmtpConfigurationUpdatePayload {
  smtpConfiguration: SmtpConfiguration
  operationResults: [SmtpConfigurationOperationResult!]!
  userErrors: [GenericUserError!]!
}

type SmtpConfigurationCreatePayload {
  smtpConfiguration: SmtpConfiguration
  userErrors: [GenericUserError!]!
}

type SmtpConfigurationDeletePayload {
  deletedSmtpConfigurationId: ID
  userErrors: [GenericUserError!]!
}

extend type Query {
  smtpAppQuery: SmtpAppQuery!
}

extend type Mutation {
  smtpAppMutation: SmtpAppMutation!
}

type SmtpAppQuery {
  smtpProviderPresets: [SmtpProviderPreset!]!
  smtpConfigurations(
    first: Int
    after: String
    last: Int
    before: String
  ): SmtpConfigurationConnection!
  smtpConfiguration(id: ID!): SmtpConfiguration
}

type SmtpAppMutation {
  smtpConfigurationCreate(input: SmtpConfigurationCreateInput!): SmtpConfigurationCreatePayload!
  smtpConfigurationUpdate(
    smtpConfigurationId: ID!
    operations: SmtpConfigurationUpdateInput!
  ): SmtpConfigurationUpdatePayload!
  smtpConfigurationDelete(smtpConfigurationId: ID!): SmtpConfigurationDeletePayload!
}

type SmtpConfigurationConnection {
  edges: [SmtpConfigurationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type SmtpConfigurationEdge {
  node: SmtpConfiguration!
  cursor: String!
}

type PageInfo @shareable {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}
