  """Target type."""
  targetType: BundleDependencyTargetType!

  """Target ID. Null is allowed when targetType is BUNDLE."""
  targetId: ID

  """Required value for SET_REQUIRED."""
  requiredValue: Boolean

  """Price rule for ADJUST_PRICE."""
  priceRule: BundlePriceRuleInput

  """Whether this action can stack with other matching actions."""
  stackable: Boolean!

  """Sort order within the rule."""
  sortIndex: Int!
}

# ---- Bundles App API ----

extend type Query {
  bundlesAppQuery: BundlesAppQuery!
}

extend type Mutation {
  bundlesAppMutation: BundlesAppMutation!
}

type BundlesAppQuery {
  """
  Get Catalog Products initialized in the Bundles App.

  Product-owned fields are resolved by Catalog through Federation. This query
  filters and orders only by data owned by the Bundles App.
  """
  bundles(
    first: Int
    after: String
    last: Int
    before: String
    where: BundleProductWhereInput
    orderBy: [BundleProductOrderByInput!]
  ): BundleProductConnection!
}

type BundlesAppMutation {
  """Update only settings owned by the Bundles App."""
  bundleSettingsUpdate(
    input: BundleSettingsUpdateInput!
  ): ProductBundlePayload!

  """
  Remove bundle-owned data without deleting the Catalog Product.

  Product deletion remains owned by catalogMutation.productDelete.
  """
  bundleRemove(input: BundleRemoveInput!): ProductBundleRemovePayload!

  """Create one bundle configuration."""
  bundleConfigurationCreate(
    input: BundleConfigurationCreateInput!
  ): BundleConfigurationPayload!

  """Update configuration metadata."""
  bundleConfigurationUpdate(
    input: BundleConfigurationUpdateInput!
  ): BundleConfigurationPayload!

  """Delete one bundle configuration with optimistic locking."""
  bundleConfigurationDelete(
    input: BundleConfigurationDeleteInput!
  ): BundleConfigurationDeletePayload!

  """Sync all groups/items for one bundle configuration."""
  bundleGroupsSync(
    input: BundleGroupsSyncInput!
  ): BundleGroupsSyncPayload!

  """Sync all reusable pricing templates for one bundle configuration."""
  bundlePricingTemplatesSync(
    input: BundlePricingTemplatesSyncInput!
  ): BundlePricingTemplatesSyncPayload!

  """Sync all dependency rules for one bundle configuration."""
  bundleDependencyRulesSync(
    input: BundleDependencyRulesSyncInput!
  ): BundleDependencyRulesSyncPayload!
}

extend type Variant @key(fields: "id") {
  id: ID! @external

  """Bundle configuration assigned to this variant. Null for BASE variants."""
  bundleConfiguration: BundleConfiguration
}

# ---- Bundle Product Listing ----

"""Filter products by data owned by the Bundles App."""
input BundleProductWhereInput {
  """Logical AND of multiple conditions."""
  _and: [BundleProductWhereInput!]

  """Logical OR of multiple conditions."""
  _or: [BundleProductWhereInput!]

  """Negate the condition."""
  _not: BundleProductWhereInput

  """Filter by Catalog Product global ID."""
  productId: IDFilter

  """Filter by bundle type."""
  type: [BundleType!]

  """Filter by configurator display style."""
  displayStyle: [BundleDisplayStyle!]

  """Filter by bundle initialization time."""
  createdAt: DateTimeFilter

  """Filter by bundle update time."""
  updatedAt: DateTimeFilter
}

"""Fields owned by the Bundles App that can be used for ordering."""
enum BundleProductOrderField {
  CREATED_AT
  UPDATED_AT
  TYPE
  DISPLAY_STYLE
}

"""Ordering configuration for bundle products."""
input BundleProductOrderByInput {
  """Field to order by."""
  field: BundleProductOrderField!

  """Sort direction."""
  direction: SortDirection!
}
