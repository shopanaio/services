# Storefront API foundation for Shopana subgraphs.
# CurrencyCode and LocaleCode are owned by @shopana/shared-references.
# Domain entities are intentionally defined by their owning Shopana subgraphs.

extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: ["@external", "@key", "@shareable"]
  )

"""A CSS color represented as a hexadecimal string."""
scalar Color

"""An opaque cursor used for pagination."""
scalar Cursor

"""An ISO 8601-encoded date and time string."""
scalar DateTime

"""An arbitrary-precision signed decimal number."""
scalar Decimal

"""A string containing HTML code."""
scalar HTML

"""An ISO 8601-encoded date and time string."""
scalar ISO8601DateTime

"""A JSON-serializable value."""
scalar JSON

"""An unsigned 64-bit integer serialized as a decimal string."""
scalar UnsignedInt64

"""An RFC 3986 and RFC 3987 compliant URI string."""
scalar URL

"""Enables global object identification following the Relay specification."""
interface Node {
  id: ID!
}

"""Represents an error in the input of a mutation."""
interface DisplayableError {
  field: [String!]
  message: String!
}

"""Shared fields exposed by every Relay-style connection."""
interface Connection {
  pageInfo: PageInfo!
  totalCount: Int!
}

"""Returns information about pagination in a connection."""
type PageInfo @shareable {
  endCursor: Cursor
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: Cursor
}

"""A precise monetary value with its associated currency."""
type Money @shareable {
  amount: Decimal!
  currencyCode: CurrencyCode!
}

"""A weight measurement expressed in a supported unit."""
type Weight @shareable {
  value: Float!
  unit: WeightUnit!
}

"""Physical dimensions expressed in a common length unit."""
type Dimensions @shareable {
  width: Float!
  height: Float!
  length: Float!
  unit: DimensionUnit!
}

"""Localized rich text in plain text, HTML, and structured JSON formats."""
type RichText @shareable {
  text: String!
  html: HTML!
  json: JSON!
}

"""Represents a generic error in the input of a mutation."""
type UserError implements DisplayableError @shareable {
  field: [String!]
  message: String!
}

