# ═══════════════════════════════════════════════════════════════════
# GLOBAL SETTINGS
# ═══════════════════════════════════════════════════════════════════
global:
  environment: development # development | staging | production
  log_level: debug # debug | info | warn | error

# ═══════════════════════════════════════════════════════════════════
# SHARED RESOURCES (YAML anchors for DRY)
# ═══════════════════════════════════════════════════════════════════
shared:
  db:
    default: &db_default
      host: localhost
      port: 5432
      user: postgres
      password: postgres
      database: portal
      schema: portal

  s3:
    default: &s3_default
      endpoint: http://localhost:9000
      access_key: minioadmin
      secret_key: minioadmin
      region: us-east-1
      path_style: true

# ═══════════════════════════════════════════════════════════════════
# GATEWAY (GraphQL Federation)
# ═══════════════════════════════════════════════════════════════════
gateway:
  admin:
    port: 4001
    access_resolver_url: http://127.0.0.1:10010
  storefront:
    port: 4000
    access_resolver_url: http://127.0.0.1:10093
    customer_context_resolver_url: http://127.0.0.1:10013

# ═══════════════════════════════════════════════════════════════════
# SERVICES
# ═══════════════════════════════════════════════════════════════════
services:
  apps:
    ports:
      admin_graphql: 10001
      app_admin_graphql: 10022
      app_storefront_graphql: 10023
      metrics: 3033
    db:
      <<: *db_default
    applications:
      hello-world:
        enabled: true
        required: true
      shopana-online-store:
        enabled: true
        required: true
      shopana-headless:
        enabled: true
        required: true
        internal:
          port: 10093
      shopana-smtp:
        enabled: true
        required: true
        # Development-only Mailpit allowances; omit or set false in production.
        allow_private_network: true
        allow_insecure_smtp: true
      test-fedex:
        enabled: true
        required: true
      test-stripe:
        enabled: true
        required: true
      test-twilio:
        enabled: true
        required: true

  checkout:
    ports:
      storefront_graphql: 10002
      metrics: 3031
    db:
      <<: *db_default
      schema: checkout
    security:
      allowed_return_origins:
        - https://localhost:3000
      allowed_deep_link_schemes: []
    retention:
      active_ttl_days: 30
      snapshot_retention_days: 90
      cleanup_batch_size: 500

  catalog:
    ports:
      admin_graphql: 10011
      storefront_graphql: 10016
      metrics: 3038
    db:
      <<: *db_default
      schema: null
    s3:
      <<: *s3_default
      bucket: catalog

  listing:
    ports:
      admin_graphql: 10012
      storefront_graphql: 10017
      metrics: 3039
    db:
      <<: *db_default
      schema: null

  customers:
    ports:
      admin_graphql: 10013
      storefront_graphql: 10024
      metrics: 3040
    db:
      <<: *db_default
      schema: null
    storefront_auth:
      # Production deployments should use https://{store}.shopana.io.
      origin_template: http://localhost:3000
      callback_path: /auth/callback
      post_logout_path: /

  reviews:
    ports:
      admin_graphql: 10014
      storefront_graphql: 10018
      metrics: 3041
    db:
      <<: *db_default
      schema: null

  notifications:
    ports:
      admin_graphql: 10021
      metrics: 3043
    db:
      <<: *db_default
      schema: null

  media:
    ports:
      admin_graphql: 10007
      storefront_graphql: 10020
      metrics: 3035
    db:
      <<: *db_default
    s3:
      <<: *s3_default
      bucket: media

  orders:
    ports:
      admin_graphql: 10004
      storefront_graphql: 10003
      metrics: 3032
    db:
      <<: *db_default
      schema: orders

  project:
    ports:
      admin_graphql: 10009
      storefront_graphql: 10019
      metrics: 3036
    db:
      <<: *db_default

  iam:
    ports:
      iam_http: 10010
      metrics: 3037
    db:
      <<: *db_default
    application_auth_http:
      public_base_url: http://localhost:10010
      behind_reverse_proxy: false
      trusted_proxy_cidrs: []
      # Public reverse proxy must expose only these paths, never /graphql.
      external_paths:
        - /auth/applications/:applicationId/*
        - /.well-known/oauth-authorization-server/auth/applications/:applicationId
    # Email domains that automatically get super_admin role (comma-separated)
    super_admin_domains: "shopana.io"

  delivery:
    db:
      <<: *db_default
      schema: delivery

  payments:
    db:
      <<: *db_default
      schema: payments

  pricing:
    ports:
      admin_graphql: 10015
      metrics: 3042
    db:
      <<: *db_default
      schema: null

  # Included in federation as a contract-only subgraph. Runtime providers land separately.
  loyalty:
    enabled: true
    ports:
      admin_graphql: 10025
      storefront_graphql: 10026
      metrics: 3044
    db:
      <<: *db_default
      schema: null

# ═══════════════════════════════════════════════════════════════════
# WORKFLOWS (DBOS Transact)
# ═══════════════════════════════════════════════════════════════════
workflows:
  database_url: postgresql://postgres:postgres@localhost:5432/portal
  app_name: shopana
  schema: dbos
