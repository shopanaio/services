query CustomerDataRequest($id: ID!) {
  customersQuery {
    customerDataRequest(id: $id) {
      id
      customer {
        id
      }
      type
      status
      requestedByType
      requestedById
      idempotencyKey
      legalBasis
      requestMetadata
      resultFileId
      resultFile {
        id
      }
      rejectionReason
      requestedAt
      dueAt
      startedAt
      finishedAt
      updatedAt
    }
  }
}
