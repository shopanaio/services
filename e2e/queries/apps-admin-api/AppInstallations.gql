query AppsAppInstallations(
  $first: Int
  $after: String
  $last: Int
  $before: String
  $where: AppInstallationWhereInput
  $orderBy: [AppInstallationOrderByInput!]
) {
  appsQuery {
    appInstallations(
      first: $first
      after: $after
      last: $last
      before: $before
      where: $where
      orderBy: $orderBy
    ) {
      edges {
        node {
          id
          appCode
          status
          installedVersion
          targetVersion
          manifestHash
          configuration
          configurationVersion
          healthStatus
          createdAt
          updatedAt
        }
        cursor
      }
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
      totalCount
    }
  }
}
