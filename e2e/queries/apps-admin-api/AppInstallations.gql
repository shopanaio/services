query AppsAppInstallations(
  $first: Int
  $after: String
  $last: Int
  $before: String
  $where: AppWhereInput
  $orderBy: [AppOrderByInput!]
) {
  appsQuery {
    apps(
      first: $first
      after: $after
      last: $last
      before: $before
      where: $where
      orderBy: $orderBy
    ) {
      edges {
        node {
          code
          installed
          installation {
            id
            appCode
            status
            installedVersion
            targetVersion
            manifestHash
            configuration
            configurationVersion
            healthStatus
            createdAt
            updatedAt
          }
        }
        cursor
      }
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
      totalCount
    }
  }
}
