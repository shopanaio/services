mutation ApplicationAdminApplicationAuthProviderUpdate(
  $input: ApplicationAuthProviderUpdateInput!
) {
  applicationMutation {
    applicationAuthProviderUpdate(input: $input) {
      provider {
        applicationId
        provider
        supported
        configured
        enabled
        maskedClientId
        scopes
        revision
        updatedAt
        updatedBy
        callbackUrl
      }
      userErrors {
        field
        message
        code
      }
    }
  }
}
