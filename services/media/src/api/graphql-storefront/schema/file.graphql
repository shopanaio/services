"""How the image is resized to fit the requested box."""
enum ImageFitMode {
  COVER
  CONTAIN
  FILL
  INSIDE
  OUTSIDE
}

"""Anchor used when FIT_MODE crops or pads the image."""
enum ImageGravity {
  CENTER
  TOP
  BOTTOM
  LEFT
  RIGHT
  TOP_LEFT
  TOP_RIGHT
  BOTTOM_LEFT
  BOTTOM_RIGHT
  AUTO
}

"""List of supported image content types."""
enum ImageContentType {
  JPG
  PNG
  WEBP
  AVIF
}

"""The available options for transforming an image."""
input ImageTransformInput {
  fit: ImageFitMode
  gravity: ImageGravity
  maxHeight: Int
  maxWidth: Int
  preferredContentType: ImageContentType
  scale: Int = 1

  """Output quality, 1-100. Bounded by the selected CdnConfiguration's minQuality/maxQuality when configured."""
  quality: Int
}

"""An image resource with URL, dimensions, and transformation options."""
type Image @key(fields: "id") {
  altText: String
  height: Int
  id: ID!
  thumbhash: String
  url(transform: ImageTransformInput): URL!
  width: Int
}

"""
Any file that doesn't fit into a designated type like image or video. For
example, a PDF or JSON document.
"""
type GenericFile implements Node @key(fields: "id") {
  alt: String
  id: ID!
  mimeType: String
  originalFileSize: UnsignedInt64!
  previewImage: Image
  url: URL!
}

"""The possible content types for a media object."""
enum MediaContentType {
  EXTERNAL_VIDEO
  IMAGE
  MODEL_3D
  VIDEO
}

"""Host for a media resource."""
enum MediaHost {
  VIMEO
  YOUTUBE
}

"""A common set of fields for media content associated with products."""
interface Media {
  alt: String
  id: ID!
  mediaContentType: MediaContentType!
  previewImage: Image
}

"""An image hosted on the platform's content delivery network."""
type MediaImage implements Media & Node @key(fields: "id") {
  alt: String
  id: ID!
  image: Image!
  mediaContentType: MediaContentType!
  previewImage: Image
}

"""A source for a hosted video."""
type VideoSource {
  format: String!
  height: Int
  mimeType: String
  url: URL!
  width: Int
}

"""A video hosted on the platform's servers."""
type Video implements Media & Node @key(fields: "id") {
  alt: String
  id: ID!
  mediaContentType: MediaContentType!
  previewImage: Image
  sources: [VideoSource!]!
}

"""A video hosted outside of the platform."""
type ExternalVideo implements Media & Node @key(fields: "id") {
  alt: String
  """Embed URL when one was supplied by the external media source."""
  embedUrl: URL
  host: MediaHost!
  id: ID!
  mediaContentType: MediaContentType!
  originUrl: URL!
  previewImage: Image
}

"""A source for a hosted 3D model."""
type Model3dSource {
  filesize: UnsignedInt64!
  format: String!
  mimeType: String
  url: URL!
}

"""A hosted 3D model."""
type Model3d implements Media & Node @key(fields: "id") {
  alt: String
  id: ID!
  mediaContentType: MediaContentType!
  previewImage: Image
  sources: [Model3dSource!]!
}
