type MediaSettings {
  assetGroupId: ID!
  cdnConfigurations: [CdnConfiguration!]!
  cdnRoutingRules: [CdnRoutingRule!]!
}

type CdnAdapterCapabilities {
  transformStrategies: [String!]!
  signingModes: [String!]!
}

type CdnConfiguration implements Node {
  id: ID!
  name: String!
  provider: String!
  baseUrl: String!
  pathPrefix: String!
  enabled: Boolean!
  isDefault: Boolean!
  signingMode: String!
  secretRef: String
  transformStrategy: String!
  urlTemplate: String
  providerConfig: JSON!
  transformConfig: JSON!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type CdnRoutingRule implements Node {
  id: ID!
  configuration: CdnConfiguration!
  name: String!
  priority: Int!
  enabled: Boolean!
  conditions: JSON!
  transformOverrides: JSON!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type CdnDeliveryPreview {
  url: String!
  originUrl: String!
  configuration: CdnConfiguration
  routingRule: CdnRoutingRule
  fallback: Boolean!
  userErrors: [GenericUserError!]!
}

input CdnConfigurationCreateInput {
  name: String!
  provider: String!
  baseUrl: String!
  pathPrefix: String
  enabled: Boolean
  isDefault: Boolean
  signingMode: String
  secretRef: String
  transformStrategy: String
  urlTemplate: String
  providerConfig: JSON
  transformConfig: JSON
}

input CdnConfigurationUpdateInput {
  fields: CdnConfigurationFieldsInput
  lifecycle: CdnConfigurationLifecycleOperationInput
  routingRules: [CdnRoutingRuleOperationInput!]
}

input CdnConfigurationFieldsInput {
  name: String
  provider: String
  baseUrl: String
  pathPrefix: String
  enabled: Boolean
  isDefault: Boolean
  signingMode: String
  secretRef: String
  transformStrategy: String
  urlTemplate: String
  providerConfig: JSON
  transformConfig: JSON
}

enum CdnConfigurationLifecycleAction {
  SET_DEFAULT
}

input CdnConfigurationLifecycleOperationInput {
  action: CdnConfigurationLifecycleAction!
}

input CdnConfigurationTestInput {
  configuration: CdnConfigurationCreateInput!
  objectPath: String!
  transform: ImageTransformInput
}

type CdnConfigurationCreatePayload {
  configuration: CdnConfiguration
  userErrors: [GenericUserError!]!
}

enum CdnRoutingRuleOperationAction {
  CREATE
  UPDATE
  DELETE
}

input CdnRoutingRuleOperationInput {
  action: CdnRoutingRuleOperationAction!
  routingRuleId: ID
  create: CdnRoutingRuleCreateInput
  update: CdnRoutingRuleUpdateInput
}

enum CdnConfigurationOperationType {
  FIELDS
  LIFECYCLE
  ROUTING_RULE
}

type CdnConfigurationOperationResult {
  type: CdnConfigurationOperationType!
  applied: Boolean!
  entityId: ID
  routingRule: CdnRoutingRule
  errors: [GenericUserError!]!
}

type CdnConfigurationUpdatePayload {
  configuration: CdnConfiguration
  operationResults: [CdnConfigurationOperationResult!]!
  userErrors: [GenericUserError!]!
}

type CdnConfigurationDeletePayload {
  deletedConfigurationId: ID
  userErrors: [GenericUserError!]!
}

type CdnConfigurationTestPayload {
  preview: CdnDeliveryPreview
  userErrors: [GenericUserError!]!
}

input CdnRoutingRuleCreateInput {
  name: String!
  priority: Int
  enabled: Boolean
  conditions: JSON
  transformOverrides: JSON
}

input CdnRoutingRuleUpdateInput {
  targetCdnConfigurationId: ID
  name: String
  priority: Int
  enabled: Boolean
  conditions: JSON
  transformOverrides: JSON
}

type CdnRoutingRulePayload {
  routingRule: CdnRoutingRule
  userErrors: [GenericUserError!]!
}

type CdnRoutingRuleDeletePayload {
  deletedRoutingRuleId: ID
  userErrors: [GenericUserError!]!
}
