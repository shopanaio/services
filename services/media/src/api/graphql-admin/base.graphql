extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: [
      "@key"
      "@requires"
      "@provides"
      "@external"
      "@shareable"
      "@override"
      "@inaccessible"
    ]
  )

scalar DateTime
scalar BigInt
scalar JSON
scalar Upload

extend type Query {
  mediaQuery: MediaQuery!
}

extend type Mutation {
  mediaMutation: MediaMutation!
}

type MediaQuery {
  """Media delivery settings for the current store."""
  mediaSettings: MediaSettings

  """Resolve and inspect the CDN route for a current-store file."""
  cdnDeliveryPreview(
    fileId: ID!
    configurationId: ID
    country: String
    transform: ImageTransformInput
  ): CdnDeliveryPreview!

  """
  Get a node by its global ID
  """
  node(id: ID!): Node

  """
  Get multiple nodes by their global IDs
  """
  nodes(ids: [ID!]!): [Node]!

  """
  Get a file by ID
  """
  file(
    """
    File ID
    """
    id: ID!
  ): File

  """
  Get files with Relay-style pagination.
  Store context is determined from x-store-name header.
  """
  files(
    first: Int
    after: String
    last: Int
    before: String
    """
    Filter conditions
    """
    where: FileWhereInput
    """
    Sort order
    """
    orderBy: [FileOrderByInput!]
    """Select active media, trash, or both."""
    state: FileStateScope = ACTIVE
  ): FileConnection!
}

type MediaMutation {
  # Bucket mutations
  bucketCreate(input: BucketCreateInput!): BucketCreatePayload!

  # CDN configuration mutations
  cdnConfigurationCreate(input: CdnConfigurationCreateInput!): CdnConfigurationPayload!
  cdnConfigurationUpdate(input: CdnConfigurationUpdateInput!): CdnConfigurationPayload!
  cdnConfigurationDelete(id: ID!): CdnConfigurationDeletePayload!
  cdnConfigurationSetDefault(id: ID!): CdnConfigurationPayload!
  cdnConfigurationTest(input: CdnConfigurationTestInput!): CdnConfigurationTestPayload!

  # CDN routing mutations
  cdnRoutingRuleCreate(input: CdnRoutingRuleCreateInput!): CdnRoutingRulePayload!
  cdnRoutingRuleUpdate(input: CdnRoutingRuleUpdateInput!): CdnRoutingRulePayload!
  cdnRoutingRuleDelete(id: ID!): CdnRoutingRuleDeletePayload!

  # File mutations
  fileUpload(input: FileUploadMultipartInput!): FileUploadPayload!
  fileUploadFromUrl(input: FileUploadFromUrlInput!): FileUploadPayload!
  fileCreateExternal(
    input: FileCreateExternalInput!
  ): FileCreateExternalPayload!
  fileUpdate(input: FileUpdateInput!): FileUpdatePayload!
  fileDelete(input: FileDeleteInput!): FileDeletePayload!

  # Avatar/Logo upload
  """
  Upload avatar or logo for an entity (user profile or organization).
  The file is stored in the entity's asset group.
  """
  avatarUpload(input: AvatarUploadInput!): AvatarUploadPayload!

  """
  Delete multiple files by ID.
  """
  fileDeleteMany(input: FileDeleteManyInput!): FileDeleteManyPayload!

  """
  Restore a single deleted file by ID.
  """
  fileRestore(input: FileRestoreInput!): FileRestorePayload!

  """
  Restore multiple deleted files by ID.
  """
  fileRestoreMany(input: FileRestoreManyInput!): FileRestoreManyPayload!

  """
  Clear the deletion error for one file by ID.
  """
  fileClearError(input: FileClearErrorInput!): FileClearErrorPayload!

  # Prepared video/3D sources
  mediaSourceCreate(input: MediaSourceCreateInput!): MediaSourcePayload!
  mediaSourceUpdate(input: MediaSourceUpdateInput!): MediaSourcePayload!
  mediaSourceDelete(input: MediaSourceDeleteInput!): MediaSourceDeletePayload!
}
