extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: [
      "@key"
      "@requires"
      "@provides"
      "@external"
      "@shareable"
      "@override"
      "@inaccessible"
    ]
  )

scalar DateTime
scalar BigInt
scalar JSON
scalar Upload

extend type Query {
  mediaQuery: MediaQuery!
}

extend type Mutation {
  mediaMutation: MediaMutation!
}

type MediaQuery {
  """
  Media delivery settings for the current store.
  """
  mediaSettings: MediaSettings

  """
  Resolve and inspect the CDN route for a current-store file.
  """
  cdnDeliveryPreview(
    fileId: ID!
    configurationId: ID
    country: String
    transform: ImageTransformInput
  ): CdnDeliveryPreview!

  """
  Which transformStrategy/signingMode keys are actually registered and usable.
  """
  cdnAdapterCapabilities: CdnAdapterCapabilities!

  """
  Get a node by its global ID
  """
  node(id: ID!): Node

  """
  Get multiple nodes by their global IDs
  """
  nodes(ids: [ID!]!): [Node]!

  """
  Get a file by ID
  """
  file(
    """
    File ID
    """
    id: ID!
  ): File

  """
  Get files with Relay-style pagination.
  Store context is determined from x-store-name header.
  """
  files(
    first: Int
    after: String
    last: Int
    before: String
    """
    Filter conditions
    """
    where: FileWhereInput
    """
    Sort order
    """
    orderBy: [FileOrderByInput!]
    """
    Select active media, trash, or both.
    """
    state: FileStateScope = ACTIVE
  ): FileConnection!

  """
  Get a durable file bulk update job by its global ID.
  """
  fileBulkUpdateJob(id: ID!): FileBulkUpdateJob

  """
  Get durable file bulk update jobs for the current store.
  """
  fileBulkUpdateJobs(
    first: Int
    after: String
    last: Int
    before: String
    where: FileBulkUpdateJobWhereInput
  ): FileBulkUpdateJobConnection!

  fileBulkDeleteJob(id: ID!): FileBulkDeleteJob
  fileBulkDeleteJobs(
    first: Int
    after: String
    last: Int
    before: String
    where: FileBulkDeleteJobWhereInput
  ): FileBulkDeleteJobConnection!
}

type MediaMutation {
  # Bucket mutations
  bucketCreate(input: BucketCreateInput!): BucketCreatePayload!

  # CDN configuration mutations
  cdnConfigurationCreate(input: CdnConfigurationCreateInput!): CdnConfigurationCreatePayload!
  cdnConfigurationUpdate(
    cdnConfigurationId: ID!
    operations: CdnConfigurationUpdateInput!
  ): CdnConfigurationUpdatePayload!
  cdnConfigurationDelete(cdnConfigurationId: ID!): CdnConfigurationDeletePayload!
  cdnConfigurationTest(input: CdnConfigurationTestInput!): CdnConfigurationTestPayload!

  # File mutations
  fileUpload(input: FileUploadMultipartInput!): FileUploadPayload!
  fileUploadFromUrl(input: FileUploadFromUrlInput!): FileUploadPayload!
  fileCreateExternal(input: FileCreateExternalInput!): FileCreateExternalPayload!
  fileUpdate(fileId: ID!, operations: FileUpdateInput!): FileUpdatePayload!
  fileDelete(fileId: ID!, permanent: Boolean! = false): FileDeletePayload!

  # Avatar/Logo upload
  """
  Upload avatar or logo for an entity (user profile or organization).
  The file is stored in the entity's asset group.
  """
  avatarUpload(input: AvatarUploadInput!): AvatarUploadPayload!

  """
  Start a durable asynchronous update job for multiple files.
  Restore is expressed as the canonical FileUpdateInput lifecycle operation.
  """
  fileBulkUpdate(input: FileBulkUpdateInput!): FileBulkUpdatePayload!

  """
  Start a durable asynchronous delete job for multiple file aggregate roots.
  """
  fileBulkDelete(input: FileBulkDeleteInput!): FileBulkDeletePayload!

  """
  Cancel operations in a durable file bulk update job that have not started yet.
  """
  fileBulkUpdateCancel(jobId: ID!): FileBulkUpdatePayload!

  """
  Cancel operations in a durable file bulk delete job that have not started yet.
  """
  fileBulkDeleteCancel(jobId: ID!): FileBulkDeletePayload!
}
