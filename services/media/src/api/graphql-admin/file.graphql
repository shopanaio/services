# ---- File Connection Types ----

"""
A connection to a list of File items.
"""
type FileConnection {
  """
  A list of edges.
  """
  edges: [FileEdge!]!

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!

  """
  The total number of files.
  """
  totalCount: Int!
}

"""
An edge in a File connection.
"""
type FileEdge {
  """
  The item at the end of the edge.
  """
  node: File!

  """
  A cursor for use in pagination.
  """
  cursor: String!
}

# ---- File Types ----

"""
Provider type for files.
"""
enum FileProvider {
  """
  File stored in S3
  """
  S3
  """
  YouTube video
  """
  YOUTUBE
  """
  Vimeo video
  """
  VIMEO
  """
  External URL
  """
  URL
  """
  Local file storage
  """
  LOCAL
}

enum MediaType {
  IMAGE
  VIDEO
  EXTERNAL_VIDEO
  MODEL_3D
  GENERIC_FILE
}

enum MediaProcessingStatus {
  PENDING
  PROCESSING
  READY
  FAILED
}

enum FileStateScope {
  ACTIVE
  DELETED
  ALL
}

"""
How the image is resized to fit the requested box.
"""
enum ImageFitMode {
  COVER
  CONTAIN
  FILL
  INSIDE
  OUTSIDE
}

"""
Anchor used when FIT_MODE crops or pads the image.
"""
enum ImageGravity {
  CENTER
  TOP
  BOTTOM
  LEFT
  RIGHT
  TOP_LEFT
  TOP_RIGHT
  BOTTOM_LEFT
  BOTTOM_RIGHT
  AUTO
}

enum ImageContentType {
  JPG
  PNG
  WEBP
  AVIF
}

input ImageTransformInput {
  fit: ImageFitMode
  gravity: ImageGravity
  maxHeight: Int
  maxWidth: Int
  preferredContentType: ImageContentType
  scale: Int = 1

  """
  Output quality, 1-100. Bounded by the selected CdnConfiguration's minQuality/maxQuality when configured.
  """
  quality: Int
}

"""
Image/video dimensions.
"""
type MediaDimensions {
  """
  Width in pixels.
  """
  width: Int!

  """
  Height in pixels.
  """
  height: Int!
}

"""
S3-specific file data.
"""
type S3ObjectData {
  """
  The bucket ID where this file is stored.
  """
  bucketId: ID!

  """
  S3 object key (path within bucket).
  """
  objectKey: String!

  """
  ETag from S3.
  """
  etag: String

  """
  Storage class (STANDARD, GLACIER, etc).
  """
  storageClass: String!
}

"""
External media data (YouTube, Vimeo, etc).
"""
type ExternalMediaData {
  """
  External ID (YouTube video ID, Vimeo ID, etc).
  """
  externalId: String!

  """
  Provider-specific metadata.
  """
  providerMeta: JSON
}

"""
A file represents a stored media asset.
"""
type File implements Node @key(fields: "id") {
  """
  The globally unique ID of the file.
  """
  id: ID!

  """
  Provider type (s3, youtube, vimeo, url, local).
  """
  provider: FileProvider!

  """
  Public URL to access file.
  """
  url(transform: ImageTransformInput, country: String): String!

  """
  Canonical provider URL before CDN routing and transforms.
  """
  originUrl: String!

  """
  MIME type.
  """
  mimeType: String

  """
  File extension.
  """
  ext: String

  """
  Size in bytes (0 for external providers).
  """
  sizeBytes: BigInt!

  """
  Original filename from upload.
  """
  originalName: String

  """
  Image/video dimensions (null if not applicable).
  """
  dimensions: MediaDimensions

  """
  Duration in milliseconds (for video/audio).
  """
  durationMs: Int

  """
  Alt text for accessibility.
  """
  altText: String

  mediaType: MediaType!

  previewFile: File

  thumbhash: String

  processingStatus: MediaProcessingStatus!

  processingError: String

  processedAt: DateTime

  sources: [MediaSource!]!

  """
  Source URL (for files uploaded from URL).
  """
  sourceUrl: String

  """
  Whether the file has been processed.
  """
  isProcessed: Boolean!

  """
  Additional metadata.
  """
  meta: JSON

  """
  The date and time when the file was created.
  """
  createdAt: DateTime!

  """
  The date and time when the file was last updated.
  """
  updatedAt: DateTime!

  """
  The date and time when the file was deleted (soft delete).
  """
  deletedAt: DateTime

  """
  Current deletion state (ACTIVE, SOFT_DELETED, DELETING).
  """
  deletionState: String!

  """
  Deletion error code, if any.
  """
  deletionErrorCode: String

  """
  Last deletion error details.
  """
  lastDeletionError: String

  """
  The date and time when the last deletion error occurred.
  """
  failedAt: DateTime

  """
  S3-specific data (only for S3 provider).
  """
  s3Data: S3ObjectData

  """
  External media data (for YouTube, Vimeo, etc).
  """
  externalData: ExternalMediaData

  """
  Usage summary for this file.
  """
  usage: FileUsageSummary!
}

# ---- File Usage Types ----

type FileUsageCount {
  """
  Entity type (variant, user, organization, etc).
  """
  entityType: String!

  """
  Number of unique entities referencing the file.
  """
  count: Int!
}

type FileUsageSummary {
  """
  Total number of unique entities referencing the file.
  """
  totalCount: Int!

  """
  Usage breakdown by entity type.
  """
  byEntity: [FileUsageCount!]!

  """
  Whether the file is active (not soft-deleted).
  """
  fileActive: Boolean!
}

# ---- File Mutation Inputs ----

"""
Input for uploading a file via multipart form data.
Store context is determined from x-store-name header.
"""
input FileUploadMultipartInput {
  """
  The file to upload.
  """
  file: Upload!

  """
  Alt text for accessibility.
  """
  altText: String
}

"""
Input for uploading a file from URL.
Store context is determined from x-store-name header.
"""
input FileUploadFromUrlInput {
  """
  URL to fetch the file from.
  """
  sourceUrl: String!

  """
  Alt text for accessibility.
  """
  altText: String
}

"""
Input for creating an external media file (YouTube, Vimeo, etc).
Store context is determined from x-store-name header.
"""
input FileCreateExternalInput {
  """
  Provider type.
  """
  provider: FileProvider!

  """
  External ID (YouTube video ID, Vimeo ID, etc).
  """
  externalId: String!

  """
  Public URL to access the media.
  """
  url: String!

  """
  Thumbnail URL.
  """
  thumbnailUrl: String

  """
  Title/name of the media.
  """
  originalName: String

  """
  Image width in pixels.
  """
  width: Int

  """
  Image height in pixels.
  """
  height: Int

  """
  Duration in milliseconds.
  """
  durationMs: Int

  """
  Alt text for accessibility.
  """
  altText: String

  """
  Provider-specific metadata.
  """
  providerMeta: JSON
}

"""
Payload for file upload.
"""
type FileUploadPayload {
  """
  The uploaded file.
  """
  file: File

  """
  List of errors that occurred during the mutation.
  """
  userErrors: [GenericUserError!]!
}

"""
Payload for external file creation.
"""
type FileCreateExternalPayload {
  """
  The created file.
  """
  file: File

  """
  List of errors that occurred during the mutation.
  """
  userErrors: [GenericUserError!]!
}

"""
Input for updating a file.
"""
input FileUpdateInput {
  fields: FileFieldsUpdateInput
  lifecycle: FileLifecycleOperationInput
  sources: [MediaSourceOperationInput!]
}

input FileFieldsUpdateInput {
  """
  Alt text for accessibility.
  """
  altText: String

  """
  Original name.
  """
  originalName: String

  """
  Additional metadata.
  """
  meta: JSON

  mediaType: MediaType

  previewFileId: ID

  thumbhash: String

  processingStatus: MediaProcessingStatus

  processingError: String
}

enum FileLifecycleAction {
  RESTORE
  CLEAR_ERROR
}

input FileLifecycleOperationInput {
  action: FileLifecycleAction!
}

enum MediaSourceOperationAction {
  CREATE
  UPDATE
  DELETE
}

input MediaSourceOperationInput {
  action: MediaSourceOperationAction!
  sourceFileId: ID!
  values: MediaSourceValuesInput
}

enum FileOperationType {
  FIELDS
  LIFECYCLE
  SOURCE
}

type FileOperationResult {
  type: FileOperationType!
  applied: Boolean!
  entityId: ID
  source: MediaSource
  errors: [GenericUserError!]!
}

"""
Payload for file update.
"""
type FileUpdatePayload {
  """
  The updated file.
  """
  file: File

  operationResults: [FileOperationResult!]!

  """
  List of errors that occurred during the mutation.
  """
  userErrors: [GenericUserError!]!
}

"""
Input for deleting a file.
"""
input FileDeleteInput {
  """
  The ID of the file to delete.
  """
  id: ID!

  """
  Whether to permanently delete the file (hard delete).
  """
  permanent: Boolean
}

"""
Payload for file deletion.
"""
type FileDeletePayload {
  """
  The ID of the deleted file.
  """
  deletedFileId: ID

  """
  List of errors that occurred during the mutation.
  """
  userErrors: [GenericUserError!]!
}

# ---- File bulk mutations ----

"""
Durable file bulk mutation job lifecycle.
"""
enum FileBulkMutationJobStatus {
  QUEUED
  RUNNING
  COMPLETED
  CANCELLED
}

"""
Durable lifecycle of one public operation in a file bulk mutation job.
"""
enum FileBulkMutationItemStatus {
  PENDING
  RUNNING
  SUCCEEDED
  FAILED
  CANCELLED
  SUPERSEDED
}

enum FileBulkMutationCancelReason {
  USER
  SUPERSEDED
  SYSTEM
}

enum FileBulkMutationKind {
  UPDATE
  DELETE
}

enum FileBulkMutationOperationType {
  FIELDS
  LIFECYCLE
  SOURCE
  DELETE
}

"""
Start a bulk update using the same operations contract as fileUpdate.
The request is limited to 100 files and 500 public operations in total.
"""
input FileBulkUpdateInput {
  files: [FileBulkUpdateItem!]!
}

input FileBulkUpdateItem {
  fileId: ID!
  operations: FileUpdateInput!
}

"""
Start a bulk root-delete job. The request is limited to 100 files.
"""
input FileBulkDeleteInput {
  files: [FileBulkDeleteItem!]!
}

input FileBulkDeleteItem {
  fileId: ID!
  permanent: Boolean = false
}

type FileBulkMutationPayload {
  """
  Created or existing idempotent job; null when request validation fails.
  """
  job: FileBulkMutationJob
  userErrors: [FileBulkMutationUserError!]!
}

type FileBulkMutationJob implements Node {
  id: ID!
  kind: FileBulkMutationKind!
  status: FileBulkMutationJobStatus!
  createdAt: DateTime!
  startedAt: DateTime
  finishedAt: DateTime
  progress: FileBulkMutationJobProgress!
  items(
    first: Int
    after: String
    statusFilter: [FileBulkMutationItemStatus!]
  ): FileBulkMutationItemConnection!
}

type FileBulkMutationJobProgress {
  total: Int!
  done: Int!
  succeeded: Int!
  failed: Int!
  cancelled: Int!
  superseded: Int!
  running: Int!
  pending: Int!
}

type FileBulkMutationItem implements Node {
  id: ID!
  fileId: ID!
  operationType: FileBulkMutationOperationType!
  operationIndex: Int!
  status: FileBulkMutationItemStatus!
  startedAt: DateTime
  finishedAt: DateTime
  errors: [FileBulkMutationUserError!]!
  cancelReason: FileBulkMutationCancelReason
  supersededByJobId: ID
}

type FileBulkMutationItemConnection {
  edges: [FileBulkMutationItemEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type FileBulkMutationItemEdge {
  cursor: String!
  node: FileBulkMutationItem!
}

type FileBulkMutationJobConnection {
  edges: [FileBulkMutationJobEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type FileBulkMutationJobEdge {
  cursor: String!
  node: FileBulkMutationJob!
}

type FileBulkMutationUserError implements UserError {
  message: String!
  field: [String!]
  code: String
  fileId: ID
  operationType: FileBulkMutationOperationType
  operationIndex: Int
}

# ---- Legacy single-file helper types ----

input FileRestoreInput {
  """
  The ID of the file to restore.
  """
  id: ID!
}

type FileRestorePayload {
  """
  The restored file.
  """
  file: File

  """
  List of errors that occurred during the mutation.
  """
  userErrors: [GenericUserError!]!
}

input FileClearErrorInput {
  """
  The ID of the file to clear deletion error for.
  """
  id: ID!
}

type FileClearErrorPayload {
  """
  The file with cleared deletion error.
  """
  file: File

  """
  List of errors that occurred during the mutation.
  """
  userErrors: [GenericUserError!]!
}

# ---- Avatar/Logo Upload ----

"""
Input for uploading avatar or logo.
"""
input AvatarUploadInput {
  """
  Owner ID (User or Organization global ID).
  The asset group will be resolved by this ID.
  """
  ownerId: ID!

  """
  The file to upload.
  """
  file: Upload!
}

"""
Payload for avatar/logo upload.
"""
type AvatarUploadPayload {
  """
  The uploaded file.
  """
  file: File

  """
  List of errors that occurred during the mutation.
  """
  userErrors: [GenericUserError!]!
}

# ---- Prepared video/3D sources ----

type MediaSource {
  sourceFile: File!
  kind: String!
  format: String!
  sortOrder: Int!
  createdAt: DateTime!
}

input MediaSourceCreateInput {
  kind: String!
  format: String!
  sortOrder: Int
}

input MediaSourceUpdateInput {
  kind: String
  format: String
  sortOrder: Int
}

input MediaSourceValuesInput {
  kind: String
  format: String
  sortOrder: Int
}

type MediaSourcePayload {
  source: MediaSource
  userErrors: [GenericUserError!]!
}

type MediaSourceDeletePayload {
  deletedSourceFileId: ID
  userErrors: [GenericUserError!]!
}
