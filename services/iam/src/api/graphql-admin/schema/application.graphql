# ============================================================================
# APPLICATION TYPES
# ============================================================================

"""
Lifecycle status of an application realm.
"""
enum ApplicationLifecycleStatus {
  """
  The application is active.
  """
  ACTIVE
  """
  The application is archived and cannot be used for new authentication.
  """
  ARCHIVED
}

"""
How an IAM resource lifecycle is managed.
"""
enum ResourceManagementMode {
  """
  The resource is managed by the organization.
  """
  ORGANIZATION
  """
  The resource is managed by a linked service owner.
  """
  SERVICE
}

"""
Read-only management metadata for an IAM resource.
"""
type ResourceManagement {
  """
  Current management mode.
  """
  mode: ResourceManagementMode!
  """
  Linked service owner, when mode is SERVICE.
  """
  linkedService: String
  """
  Linked owner type, when mode is SERVICE.
  """
  linkedOwnerType: String
  """
  Linked owner id, when mode is SERVICE.
  """
  linkedOwnerId: ID
  """
  Whether generic organization Admin mutations may change this resource.
  """
  mutableFromOrganizationAdmin: Boolean!
}

"""
An organization-owned application authentication realm.
"""
type Application implements Node @key(fields: "id") {
  """
  Globally unique application identifier.
  """
  id: ID!
  """
  Identifier of the organization that owns the application.
  """
  organizationId: ID!
  """
  Organization that owns the application.
  """
  organization: Organization!
  """
  URL-friendly application name.
  """
  name: String!
  """
  Human-readable application name.
  """
  displayName: String!
  """
  Optional application description.
  """
  description: String
  """
  Current application lifecycle status.
  """
  status: ApplicationLifecycleStatus!
  """
  Immutable OAuth resource audience assigned by IAM.
  """
  resource: String!
  """
  Internal aggregate revision.
  """
  revision: Int!
  """
  Read-only resource lifecycle management metadata.
  """
  management: ResourceManagement!
  """
  Authentication configuration for this application.
  """
  auth: ApplicationAuthConfiguration!
  """
  Find an OAuth client by its public client identifier.
  """
  oauthClient(clientId: String!): ApplicationOAuthClient
  """
  OAuth clients registered for this application.
  """
  oauthClients(
    first: Int
    after: String
    last: Int
    before: String
    where: ApplicationOAuthClientWhereInput
    orderBy: [ApplicationOAuthClientOrderByInput!]
  ): ApplicationOAuthClientConnection!
  """
  Find a user within this application realm.
  """
  user(id: ID!): ApplicationUser
  """
  Users registered within this application realm.
  """
  users(
    first: Int
    after: String
    last: Int
    before: String
    where: ApplicationUserWhereInput
    orderBy: [ApplicationUserOrderByInput!]
  ): ApplicationUserConnection!
  """
  Timestamp when the application was created.
  """
  createdAt: DateTime!
  """
  Timestamp when the application was last updated.
  """
  updatedAt: DateTime!
  """
  Timestamp when the application was archived.
  """
  archivedAt: DateTime
}

# ============================================================================
# CONNECTION TYPES
# ============================================================================

"""
A paginated connection of applications.
"""
type ApplicationConnection {
  """
  Application edges in the current page.
  """
  edges: [ApplicationEdge!]!
  """
  Information needed to continue pagination.
  """
  pageInfo: PageInfo!
  """
  Total number of applications matching the filter.
  """
  totalCount: Int!
}

"""
An application and its pagination cursor.
"""
type ApplicationEdge {
  """
  Application at the end of the edge.
  """
  node: Application!
  """
  Opaque pagination cursor.
  """
  cursor: String!
}

# ============================================================================
# FILTER AND ORDER TYPES
# ============================================================================

"""
Filter conditions for applications.
"""
input ApplicationWhereInput {
  """
  Search by application name or display name.
  """
  search: String
  """
  Limit results to the selected lifecycle statuses.
  """
  status: [ApplicationLifecycleStatus!]
}

"""
Fields available for ordering applications.
"""
enum ApplicationOrderField {
  NAME
  DISPLAY_NAME
  CREATED_AT
  UPDATED_AT
}

"""
Ordering configuration for applications.
"""
input ApplicationOrderByInput {
  """
  Field to order by.
  """
  field: ApplicationOrderField!
  """
  Sort direction.
  """
  direction: SortDirection!
}

# ============================================================================
# INPUTS
# ============================================================================

"""
Input for creating an application.
"""
input ApplicationCreateInput {
  """
  Organization that will own the application.
  """
  organizationId: ID!
  """
  URL-friendly application name.
  """
  name: String!
  """
  Human-readable application name.
  """
  displayName: String!
  """
  Optional application description.
  """
  description: String
}

"""
Input for updating application metadata.
"""
input ApplicationUpdateInput {
  fields: ApplicationFieldsInput
  lifecycle: ApplicationLifecycleOperationInput
  authentication: ApplicationAuthUpdateInput
  authenticationRealmEnabled: Boolean
  authenticationMethods: [ApplicationAuthMethodUpdateInput!]
  authenticationProviders: [ApplicationAuthProviderOperationInput!]
  oauthClients: [ApplicationOAuthClientOperationInput!]
  users: [ApplicationUserOperationInput!]
}

input ApplicationFieldsInput {
  """
  New URL-friendly application name.
  """
  name: String
  """
  New human-readable application name.
  """
  displayName: String
  """
  New application description.
  """
  description: String
}

enum ApplicationLifecycleAction {
  ARCHIVE
}

input ApplicationLifecycleOperationInput {
  action: ApplicationLifecycleAction!
}

enum ApplicationOperationType {
  FIELDS
  LIFECYCLE
  AUTHENTICATION
  AUTHENTICATION_REALM
  AUTHENTICATION_METHOD
  AUTHENTICATION_PROVIDER
  OAUTH_CLIENT
  USER
}

type ApplicationOperationResult {
  type: ApplicationOperationType!
  applied: Boolean!
  entityId: ID
  configuration: ApplicationAuthConfiguration
  authMethod: ApplicationAuthMethod
  provider: ApplicationAuthProvider
  oauthClient: ApplicationOAuthClient
  clientSecret: String
  user: ApplicationUser
  revokedSessionCount: Int
  unlinkedAccountId: ID
  updatedBy: ID
  errors: [GenericUserError!]!
}

"""
Input for archiving an application.
"""
input ApplicationArchiveInput {
  """
  Organization that owns the application.
  """
  organizationId: ID!
  """
  Application to archive.
  """
  applicationId: ID!
}

# ============================================================================
# PAYLOADS
# ============================================================================

"""
Result of creating an application.
"""
type ApplicationCreatePayload {
  application: Application
  userErrors: [GenericUserError!]!
}

"""
Result of updating application metadata.
"""
type ApplicationUpdatePayload {
  application: Application
  operationResults: [ApplicationOperationResult!]!
  userErrors: [GenericUserError!]!
}

"""
Result of archiving an application.
"""
type ApplicationArchivePayload {
  application: Application
  userErrors: [GenericUserError!]!
}
