"""
A generic user error interface for mutation responses.
"""
interface UserError {
  """
  The error message.
  """
  message: String!
  """
  The path to the input field that caused the error.
  """
  field: [String!]
  """
  An error code for programmatic handling.
  """
  code: String
}

"""
A generic user error type for mutation responses.
"""
type GenericUserError implements UserError @shareable {
  message: String!
  field: [String!]
  code: String
}

"""
Authentication tokens.
"""
type AuthTokenPayload {
  """
  Access token for API requests.
  """
  accessToken: String!
  """
  Refresh token for obtaining new access tokens.
  """
  refreshToken: String!
  """
  Expiration time in seconds.
  """
  expiresIn: Int!
}

# ---- Admin Users Namespace ----

type UserQuery {
  """
  Get current authenticated admin user
  """
  current: User

  """
  Get all active sessions for the current user.
  """
  mySessions: [Session!]!

  """
  Check authorization for current user.
  Used for server-side permission checks.
  For client-side checks, use project.roles + user.role.
  """
  authorize(input: AuthorizeInput!): AuthorizePayload!
}

type UserMutation {
  # Profile
  userUpdateProfile(input: UserUpdateProfileInput!): UserUpdateProfilePayload!
  userUpdateEmail(input: UserUpdateEmailInput!): UserUpdateEmailPayload!
  userUpdatePassword(input: UserUpdatePasswordInput!): UserUpdatePasswordPayload!

  # Sessions
  """
  Revoke a specific session by ID.
  """
  sessionRevoke(input: SessionRevokeInput!): SessionRevokePayload!
  """
  Revoke all sessions except the current one.
  """
  sessionRevokeAll: SessionRevokeAllPayload!
}

type AuthMutation {
  # Auth
  signUp(input: UserSignUpInput!): UserSignUpPayload!
  signIn(input: UserSignInInput!): UserSignInPayload!
  signOut(input: UserSignOutInput!): UserSignOutPayload!
  tokenRefresh(input: UserTokenRefreshInput!): UserTokenRefreshPayload!
}

"""
Role mutations.
"""
type RoleMutation {
  """
  Create custom role.
  Requires: project:admin permission.
  """
  roleCreate(input: RoleCreateInput!): RoleCreatePayload!
  """
  Update role.
  Requires: project:admin permission.
  System roles cannot be modified.
  """
  roleUpdate(input: RoleUpdateInput!): RoleUpdatePayload!
  """
  Delete custom role.
  Requires: project:admin permission.
  System roles cannot be deleted.
  Roles with assigned users cannot be deleted.
  """
  roleDelete(input: RoleDeleteInput!): RoleDeletePayload!
}

# ---- Applications Namespace ----

"""
Application realm management queries.
"""
type ApplicationQuery {
  """
  Get an application owned by the selected organization.
  """
  application(organizationId: ID!, id: ID!): Application

  """
  List applications owned by the selected organization.
  """
  applications(
    organizationId: ID!
    first: Int
    after: String
    last: Int
    before: String
    where: ApplicationWhereInput
    orderBy: [ApplicationOrderByInput!]
  ): ApplicationConnection!
}

"""
Application realm management mutations.
"""
type ApplicationMutation {
  """
  Create an application realm.
  """
  applicationCreate(input: ApplicationCreateInput!): ApplicationCreatePayload!

  """
  Update application metadata.
  """
  applicationUpdate(input: ApplicationUpdateInput!): ApplicationUpdatePayload!

  """
  Archive an application realm.
  """
  applicationArchive(input: ApplicationArchiveInput!): ApplicationArchivePayload!

  """
  Update application authentication policy and presentation.
  """
  applicationAuthUpdate(input: ApplicationAuthUpdateInput!): ApplicationAuthUpdatePayload!

  """
  Enable or disable an application authentication realm.
  """
  applicationAuthRealmEnabledSet(
    input: ApplicationAuthRealmEnabledSetInput!
  ): ApplicationAuthUpdatePayload!

  """
  Update enabled capabilities of an authentication method.
  """
  applicationAuthMethodUpdate(
    input: ApplicationAuthMethodUpdateInput!
  ): ApplicationAuthMethodPayload!

  """
  Configure credentials and scopes of a social provider.
  """
  applicationAuthProviderConfigure(
    input: ApplicationAuthProviderConfigureInput!
  ): ApplicationAuthProviderPayload!

  """
  Update non-secret social provider settings.
  """
  applicationAuthProviderUpdate(
    input: ApplicationAuthProviderUpdateInput!
  ): ApplicationAuthProviderPayload!

  """
  Replace social provider credentials.
  """
  applicationAuthProviderCredentialsRotate(
    input: ApplicationAuthProviderCredentialsRotateInput!
  ): ApplicationAuthProviderPayload!

  """
  Delete credentials from a disabled social provider.
  """
  applicationAuthProviderCredentialsDelete(
    input: ApplicationAuthProviderCredentialsDeleteInput!
  ): ApplicationAuthProviderPayload!

  """
  Safely validate a social provider configuration.
  """
  applicationAuthProviderValidate(
    input: ApplicationAuthProviderValidateInput!
  ): ApplicationAuthProviderValidationPayload!

  """
  Create an OAuth client with fixed protocol policy.
  """
  applicationOAuthClientCreate(
    input: ApplicationOAuthClientCreateInput!
  ): ApplicationOAuthClientCreatePayload!

  """
  Update mutable OAuth client metadata.
  """
  applicationOAuthClientUpdate(
    input: ApplicationOAuthClientUpdateInput!
  ): ApplicationOAuthClientPayload!

  """
  Enable or disable an OAuth client.
  """
  applicationOAuthClientEnabledSet(
    input: ApplicationOAuthClientEnabledSetInput!
  ): ApplicationOAuthClientPayload!

  """
  Change first-party consent bypass policy for an OAuth client.
  """
  applicationOAuthClientSkipConsentSet(
    input: ApplicationOAuthClientSkipConsentSetInput!
  ): ApplicationOAuthClientPayload!

  """
  Rotate a confidential OAuth client secret.
  """
  applicationOAuthClientSecretRotate(
    input: ApplicationOAuthClientSecretRotateInput!
  ): ApplicationOAuthClientSecretRotatePayload!

  """
  Archive an OAuth client.
  """
  applicationOAuthClientArchive(
    input: ApplicationOAuthClientArchiveInput!
  ): ApplicationOAuthClientPayload!

  """
  Block an application user.
  """
  applicationUserBlock(input: ApplicationUserStatusSetInput!): ApplicationUserPayload!

  """
  Unblock an application user.
  """
  applicationUserUnblock(input: ApplicationUserStatusSetInput!): ApplicationUserPayload!

  """
  Revoke every active session of an application user.
  """
  applicationUserSessionsRevokeAll(
    input: ApplicationUserSessionsRevokeAllInput!
  ): ApplicationUserSessionsRevokeAllPayload!

  """
  Unlink a login account from an application user.
  """
  applicationUserAccountUnlink(
    input: ApplicationUserAccountUnlinkInput!
  ): ApplicationUserAccountUnlinkPayload!
}

# ============================================================================
# QUERIES & MUTATIONS
# ============================================================================

type Query {
  """
  User management queries.
  """
  userQuery: UserQuery!

  """
  Organization queries namespace.
  """
  organizationQuery: OrganizationQuery!

  """
  Application realm management queries.
  """
  applicationQuery: ApplicationQuery!
}

type Mutation {
  """
  User management mutations.
  """
  userMutation: UserMutation!
  """
  Role management mutations.
  """
  roleMutation: RoleMutation!
  """
  Authentication mutations.
  """
  authMutation: AuthMutation!
  """
  Organization management mutations.
  """
  organizationMutation: OrganizationMutation!
  """
  Application realm management mutations.
  """
  applicationMutation: ApplicationMutation!
}
