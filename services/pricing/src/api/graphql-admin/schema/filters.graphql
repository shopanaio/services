"""
Filters backed by pricing.discount_list_view and store-scoped relations.
"""
input DiscountWhereInput {
  _and: [DiscountWhereInput!]
  _or: [DiscountWhereInput!]
  _not: DiscountWhereInput
  id: IDFilter
  method: DiscountMethodFilter
  kind: DiscountKindFilter
  discountClass: DiscountClassFilter
  state: DiscountStateFilter
  effectiveStatus: DiscountEffectiveStatusFilter
  title: StringFilter
  """
  Match any code assigned to the discount, including disabled codes.
  """
  code: StringFilter
  primaryCode: StringFilter
  currency: DiscountCurrencyFilter
  priority: IntFilter
  usageLimit: BigIntFilter
  appliesOncePerCustomer: BooleanFilter
  appliesOnOneTimePurchase: BooleanFilter
  appliesOnSubscription: BooleanFilter
  startsAt: DateTimeFilter
  endsAt: DateTimeFilter
  reservedUsageCount: BigIntFilter
  usageCount: BigIntFilter
  """
  Match discounts assigned to at least one normalized tag.
  """
  tag: StringFilter
  """
  Match discounts available on a channel code.
  """
  channelCode: StringFilter
  """
  Match discounts featured on a channel code.
  """
  featuredChannelCode: StringFilter
  combinesWithProductDiscounts: BooleanFilter
  combinesWithOrderDiscounts: BooleanFilter
  combinesWithShippingDiscounts: BooleanFilter
  createdById: StringFilter
  createdAt: DateTimeFilter
  updatedAt: DateTimeFilter
  archivedAt: DateTimeFilter
}

enum DiscountOrderField {
  id
  method
