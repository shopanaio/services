  externalSystem: String!
  externalType: String!
  externalId: String!
  externalUrl: String
  direction: DiscountExternalSyncDirection!
  syncStatus: DiscountExternalSyncStatus!
  etag: String
  contentChecksum: String
  lastSyncedAt: DateTime
  lastError: String
  metadata: JSON!
  createdAt: DateTime!
