extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: [
      "@key"
      "@requires"
      "@provides"
      "@external"
      "@shareable"
      "@override"
      "@inaccessible"
    ]
  )

type Query {
  """
  Pricing Admin query namespace.
  """
  pricingQuery: PricingQuery!
}

type Mutation {
  """
  Pricing Admin mutation namespace.
  """
  pricingMutation: PricingMutation!
}

"""
Store-scoped pricing reads. The current Store is taken from trusted context.
"""
type PricingQuery {
  """
  Resolve a Pricing-owned Relay node by global ID.
  """
  node(id: ID!): Node

  """
  Resolve Pricing-owned Relay nodes while preserving input order.
  """
  nodes(ids: [ID!]!): [Node]!

  discount(id: ID!): Discount
  discounts(
    first: Int
    after: String
    last: Int
    before: String
    where: DiscountWhereInput
    orderBy: [DiscountOrderByInput!]
  ): DiscountConnection!

  discountCode(id: ID!): DiscountCode
  discountCodes(
    first: Int
    after: String
    last: Int
    before: String
    where: DiscountCodeWhereInput
    orderBy: [DiscountCodeOrderByInput!]
  ): DiscountCodeConnection!

  discountUsageReservation(id: ID!): DiscountUsageReservation
  discountUsageReservations(
    first: Int
    after: String
    last: Int
    before: String
    where: DiscountUsageReservationWhereInput
    orderBy: [DiscountUsageReservationOrderByInput!]
  ): DiscountUsageReservationConnection!

  discountRedemption(id: ID!): DiscountRedemption
  discountRedemptions(
    first: Int
    after: String
    last: Int
    before: String
    where: DiscountRedemptionWhereInput
    orderBy: [DiscountRedemptionOrderByInput!]
  ): DiscountRedemptionConnection!
  discountRedemptionAllocation(id: ID!): DiscountRedemptionAllocation

  discountExternalReference(id: ID!): DiscountExternalReference
  discountExternalReferences(
    first: Int
    after: String
    last: Int
    before: String
    where: DiscountExternalReferenceWhereInput
    orderBy: [DiscountExternalReferenceOrderByInput!]
  ): DiscountExternalReferenceConnection!
}

"""
Store-scoped pricing commands.
"""
type PricingMutation {
  discountCreate(input: DiscountCreateInput!): DiscountCreatePayload!

  """
  Unified discount configuration update.
  """
  discountUpdate(discountId: ID!, operations: DiscountUpdateInput!): DiscountUpdatePayload!

  """
  Permanently delete an unused draft. Active, historical, or redeemed discounts
  must be archived through discountUpdate instead.
  """
  discountDelete(discountId: ID!): DiscountDeletePayload!
}
