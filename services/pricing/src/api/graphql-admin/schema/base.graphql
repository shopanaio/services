extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: [
      "@key"
      "@requires"
      "@provides"
      "@external"
      "@shareable"
      "@override"
      "@inaccessible"
    ]
  )

type Query {
  """Pricing Admin query namespace."""
  pricingQuery: PricingQuery!
}

type Mutation {
  """Pricing Admin mutation namespace."""
  pricingMutation: PricingMutation!
}

"""Store-scoped pricing reads. The current Store is taken from trusted context."""
type PricingQuery {
  """Resolve a Pricing-owned Relay node by global ID."""
  node(id: ID!): Node

  """Resolve Pricing-owned Relay nodes while preserving input order."""
  nodes(ids: [ID!]!): [Node]!

  discount(id: ID!): Discount
  discounts(
    first: Int
    after: String
    last: Int
    before: String
    where: DiscountWhereInput
    orderBy: [DiscountOrderByInput!]
  ): DiscountConnection!

  discountCode(id: ID!): DiscountCode
  discountUsageReservation(id: ID!): DiscountUsageReservation
  discountRedemption(id: ID!): DiscountRedemption
  discountExternalReference(id: ID!): DiscountExternalReference
}

"""Store-scoped pricing commands."""
type PricingMutation {
  discountCreate(input: DiscountCreateInput!): DiscountCreatePayload!

  """Unified discount configuration update with optimistic locking."""
  discountUpdate(
    discountId: ID!
    expectedRevision: Int!
    operations: DiscountUpdateInput!
  ): DiscountUpdatePayload!

  """
  Permanently delete an unused draft. Active, historical, or redeemed discounts
  must be archived through discountUpdate instead.
  """
  discountDelete(input: DiscountDeleteInput!): DiscountDeletePayload!

  discountExternalReferenceCreate(
    input: DiscountExternalReferenceCreateInput!
  ): DiscountExternalReferenceCreatePayload!
  discountExternalReferenceUpdate(
    externalReferenceId: ID!
    expectedUpdatedAt: DateTime!
    operations: DiscountExternalReferenceUpdateInput!
  ): DiscountExternalReferenceUpdatePayload!
  discountExternalReferenceDelete(
    input: DiscountExternalReferenceDeleteInput!
  ): DiscountExternalReferenceDeletePayload!
}
