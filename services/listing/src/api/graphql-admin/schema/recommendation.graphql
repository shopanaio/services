enum RecommendationPlacement {
  PRODUCT_RELATED
  FREQUENTLY_BOUGHT_TOGETHER
}

enum RecommendationStrategy {
  CURATED_ONLY
  CURATED_FIRST
  BLENDED
  AUTOMATED_ONLY
}

enum ManualRecommendationAction {
  PIN
  BOOST
  EXCLUDE
}

enum RecommendationReferenceStatus {
  VALID
  STALE
}

enum ProductRecommendationSource {
  MANUAL
  FREQUENTLY_BOUGHT_TOGETHER
  CONTENT_SIMILARITY
  POPULARITY
  FALLBACK
}

type RecommendationPlacementPolicy implements Node {
  id: ID!
  placement: RecommendationPlacement!
  enabled: Boolean!
  strategy: RecommendationStrategy!
  minimumResults: Int!
  maximumResults: Int!
  fallbackChain: [String!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ManualProductRecommendation implements Node {
  id: ID!
  anchorProduct: Product!
  targetProduct: Product!
  placement: RecommendationPlacement!
  action: ManualRecommendationAction!
  position: Int
  boost: String
  enabled: Boolean!
  startsAt: DateTime
  endsAt: DateTime
  anchorReferenceStatus: RecommendationReferenceStatus!
  targetReferenceStatus: RecommendationReferenceStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ManualProductRecommendationEdge {
  cursor: String!
  node: ManualProductRecommendation!
}

type ManualProductRecommendationConnection {
  edges: [ManualProductRecommendationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input RecommendationPlacementPolicyCreateInput {
  placement: RecommendationPlacement!
  strategy: RecommendationStrategy!
  minimumResults: Int!
  maximumResults: Int!
  fallbackChain: [String!]!
}

input RecommendationPlacementPolicyUpdateInput {
  enabled: Boolean
  strategy: RecommendationStrategy
  minimumResults: Int
  maximumResults: Int
  fallbackChain: [String!]
}

type RecommendationPlacementPolicyCreatePayload {
  policy: RecommendationPlacementPolicy
  userErrors: [GenericUserError!]!
}

type RecommendationPlacementPolicyUpdatePayload {
  policy: RecommendationPlacementPolicy
  operationResults: [RecommendationPlacementPolicyOperationResult!]!
  userErrors: [GenericUserError!]!
}

enum RecommendationPlacementPolicyOperationType {
  FIELDS_UPDATE
}

type RecommendationPlacementPolicyOperationResult {
  type: RecommendationPlacementPolicyOperationType!
  applied: Boolean!
  entityId: ID
  errors: [GenericUserError!]!
}

input ManualProductRecommendationCreateInput {
  anchorProductId: ID!
  targetProductId: ID!
  placement: RecommendationPlacement!
  action: ManualRecommendationAction!
  position: Int
  boost: String
  enabled: Boolean!
  startsAt: DateTime
  endsAt: DateTime
}

input ManualProductRecommendationUpdateInput {
  targetProductId: ID
  action: ManualRecommendationAction
  position: Int
  boost: String
  enabled: Boolean
  startsAt: DateTime
  endsAt: DateTime
}

type ManualProductRecommendationCreatePayload {
  recommendation: ManualProductRecommendation
  userErrors: [GenericUserError!]!
}

type ManualProductRecommendationUpdatePayload {
  recommendation: ManualProductRecommendation
  operationResults: [ManualProductRecommendationOperationResult!]!
  userErrors: [GenericUserError!]!
}

enum ManualProductRecommendationOperationType {
  FIELDS_UPDATE
}

type ManualProductRecommendationOperationResult {
  type: ManualProductRecommendationOperationType!
  applied: Boolean!
  entityId: ID
  errors: [GenericUserError!]!
}

type ManualProductRecommendationDeletePayload {
  deletedId: ID
  userErrors: [GenericUserError!]!
}

input RecommendationPlacementPolicyDraftInput {
  enabled: Boolean!
  strategy: RecommendationStrategy!
  minimumResults: Int!
  maximumResults: Int!
  fallbackChain: [String!]!
}

input ManualRecommendationDraftCreateInput {
  targetProductId: ID!
  action: ManualRecommendationAction!
  position: Int
  boost: String
  enabled: Boolean!
  startsAt: DateTime
  endsAt: DateTime
}

input ManualRecommendationDraftUpdateInput {
  id: ID!
  targetProductId: ID
  action: ManualRecommendationAction
  position: Int
  boost: String
  enabled: Boolean
  startsAt: DateTime
  endsAt: DateTime
}

input ManualRecommendationDraftDeleteInput {
  id: ID!
}

input ManualRecommendationDraftChangeInput {
  create: ManualRecommendationDraftCreateInput
  update: ManualRecommendationDraftUpdateInput
  delete: ManualRecommendationDraftDeleteInput
}

input RecommendationSnapshotPreviewInput {
  anchorProductId: ID!
  placement: RecommendationPlacement!
  policy: RecommendationPlacementPolicyDraftInput
  manualChanges: [ManualRecommendationDraftChangeInput!]!
}

enum RecommendationPreviewExcludedReason {
  STALE
  UNPUBLISHED
  UNAVAILABLE
  EXCLUDED
  INSUFFICIENT_SUPPORT
  LIMIT_EXCEEDED
}

type RecommendationPreviewSourceBreakdown {
  manualAction: ManualRecommendationAction
  manualPosition: Int
  manualBoost: String
  fbtRunId: ID
  fbtSourceScore: String
  categoryPopularityScore: String
  storePopularityScore: String
}

type RecommendationPreviewCandidate {
  product: Product!
  rank: Int!
  score: String!
  source: ProductRecommendationSource!
  sourceBreakdown: RecommendationPreviewSourceBreakdown!
}

type RecommendationPreviewExcludedCandidate {
  product: Product!
  reason: RecommendationPreviewExcludedReason!
}

type RecommendationPreviewResult {
  candidates: [RecommendationPreviewCandidate!]!
  excluded: [RecommendationPreviewExcludedCandidate!]!
  asOf: DateTime!
  modelVersion: String!
}

type RecommendationSnapshotPreviewPayload {
  active: RecommendationPreviewResult
  draft: RecommendationPreviewResult
  userErrors: [GenericUserError!]!
}
