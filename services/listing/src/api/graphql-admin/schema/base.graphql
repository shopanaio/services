extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: [
      "@key"
      "@requires"
      "@provides"
      "@external"
      "@shareable"
      "@override"
      "@inaccessible"
    ]
  )

extend type Query {
  """
  Listing query namespace.
  """
  listingQuery: ListingQuery!
}

extend type Mutation {
  """
  Listing mutation namespace.
  """
  listingMutation: ListingMutation!
}

type ListingQuery {
  """
  Search configuration and diagnostics namespace.
  """
  search: ListingSearchQuery!

  """
  Get a node by its global ID.
  """
  node(id: ID!): Node

  """
  Get multiple nodes by their global IDs.
  """
  nodes(ids: [ID!]!): [Node]!

  """
  Get ordered listing structure for Admin.

  Listing service returns listing-owned order, pagination, counts, aggregates,
  and canonical entity references only. Entity details are resolved by owning
  subgraphs through federation.
  """
  listing(
    first: Int
    after: String
    last: Int
    before: String
    scope: ListingScopeInput
    query: String
    locale: LocaleCode
    currency: CurrencyCode
    facets: [ListingProductFilter!]
    orderBy: ListingOrderByInput
  ): ListingConnection!

  """
  Get a facet by ID.
  """
  facet(id: ID!): Facet

  """
  Get all facets.
  """
  facets: [Facet!]!

  """
  Get available facet source candidates for create flow.
  """
  facetSourceCandidates(
    first: Int
    after: String
    last: Int
    before: String
    """
    Filter conditions.
    """
    where: FacetSourceCandidateWhereInput
    """
    Sort order.
    """
    orderBy: [FacetSourceCandidateOrderByInput!]
  ): FacetSourceCandidateConnection!

  """
  Get available facet source value candidates for create and edit flows.
  """
  facetValueCandidates(
    first: Int
    after: String
    last: Int
    before: String
    """
    Filter conditions.
    """
    where: FacetValueCandidateWhereInput
    """
    Sort order.
    """
    orderBy: [FacetValueCandidateOrderByInput!]
    """
    Candidate routing and source scope.
    """
    meta: FacetValueCandidatesMetaInput!
  ): FacetValueCandidateConnection!

  """
  Get a facet value by ID.
  """
  facetValue(id: ID!): FacetValue

  """
  Get all facet values for a specific facet.
  """
  facetValues(facetId: ID!): [FacetValue!]!

  """
  Get a facet swatch by ID.
  """
  facetSwatch(id: ID!): FacetSwatch

  """
  Get all facet swatches.
  """
  facetSwatches: [FacetSwatch!]!
}

type ListingMutation {
  """
  Search configuration mutation namespace.
  """
  search: ListingSearchMutation!

  """
  Create a new facet.
  """
  facetCreate(input: FacetCreateInput!): FacetCreatePayload!

  """
  Update an existing facet.
  """
  facetUpdate(facetId: ID!, operations: FacetUpdateInput!): FacetUpdatePayload!

  """
  Atomically replace scopes for several facets.

  This is a store-wide configuration command rather than a write to one facet
  aggregate; see the Listing facets architecture decision.
  """
  facetScopesUpdate(input: FacetScopesUpdateInput!): FacetScopesUpdatePayload!

  """
  Repair the store-wide facet rank sequence without changing visible order.
  """
  facetRebalance(confirm: Boolean = true): FacetRebalancePayload!

  """
  Delete a facet.
  """
  facetDelete(facetId: ID!): FacetDeletePayload!

  """
  Create a new facet swatch.
  """
  facetSwatchCreate(input: FacetSwatchCreateInput!): FacetSwatchCreatePayload!

  """
  Update an existing facet swatch.
  """
  facetSwatchUpdate(
    facetSwatchId: ID!
    operations: FacetSwatchUpdateInput!
  ): FacetSwatchUpdatePayload!

  """
  Delete a facet swatch.
  """
  facetSwatchDelete(facetSwatchId: ID!): FacetSwatchDeletePayload!
}
