extend type ListingQuery {
  """Search configuration and diagnostics namespace."""
  search: ListingSearchQuery!
}

extend type ListingMutation {
  """Search configuration mutation namespace."""
  search: ListingSearchMutation!
}

type ListingSearchQuery {
  """Current search settings for the selected store, if initialized."""
  settings: SearchSettings
  synonymGroup(id: ID!): SearchSynonymGroup
  synonymGroups(locale: LocaleCode, limit: Int = 20, offset: Int = 0): SearchSynonymGroupConnection!
  productBoost(id: ID!): SearchProductBoost
  productBoosts(locale: LocaleCode, limit: Int = 20, offset: Int = 0): SearchProductBoostConnection!
  """Explain the canonical request-level search plan and its candidate membership."""
  explain(query: String!, locale: LocaleCode!): SearchExplain!
}

type ListingSearchMutation {
  settingsCreate(input: SearchSettingsCreateInput!): SearchSettingsPayload!
  settingsUpdate(input: SearchSettingsUpdateInput!): SearchSettingsPayload!
  synonymGroupCreate(input: SearchSynonymGroupCreateInput!): SearchSynonymGroupPayload!
  synonymGroupUpdate(input: SearchSynonymGroupUpdateInput!): SearchSynonymGroupPayload!
  synonymGroupDelete(input: SearchConfigurationDeleteInput!): SearchSynonymGroupDeletePayload!
  productBoostCreate(input: SearchProductBoostCreateInput!): SearchProductBoostPayload!
  productBoostUpdate(input: SearchProductBoostUpdateInput!): SearchProductBoostPayload!
  productBoostDelete(input: SearchConfigurationDeleteInput!): SearchProductBoostDeletePayload!
}

type SearchSynonymGroup {
  id: ID!
  locale: LocaleCode!
  name: String!
  enabled: Boolean!
  version: Int!
  values: [SearchSynonymValue!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SearchSynonymValue {
  value: String!
  position: Int!
}

type SearchSynonymGroupConnection {
  nodes: [SearchSynonymGroup!]!
  totalCount: Int!
}

type SearchProductBoost {
  id: ID!
  locale: LocaleCode!
  name: String!
  enabled: Boolean!
  version: Int!
  phrases: [SearchProductBoostPhrase!]!
  productIds: [ID!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SearchProductBoostPhrase {
  phrase: String!
  position: Int!
}

type SearchProductBoostConnection {
  nodes: [SearchProductBoost!]!
  totalCount: Int!
}

enum SearchExecutionMode {
  PRIMARY
  FUZZY
}

enum SearchLexicalUnitKind {
  TEXT
  NUMBER
  CODE
  FOREIGN
  MIXED_SCRIPT
  STOPWORD
}

enum SearchExplainClauseKind {
  FTS_TERMS
  FTS_PHRASE
  SYNONYM
  IDENTIFIER_EXACT
  IDENTIFIER_PREFIX
}

enum SearchField {
  PRODUCT_TITLE
  VARIANT_TITLE
  VENDOR_NAME
  CATEGORY_NAME
}

enum SearchOutOfStockPolicy {
  SHOW
  HIDE
  PLACE_LAST
}

enum SearchExplainReason {
  STOPWORD_REMOVAL
  SYNONYM_EXPANSION
  IDENTIFIER_EXPANSION
  PRODUCT_BOOST
  BOOST_ONLY_CANDIDATE
  FUZZY_FALLBACK
  TYPO_EXPANSION
}

type SearchExplain {
  mode: SearchExecutionMode!
  originalQuery: String!
  normalizedQuery: String!
  locale: LocaleCode!
  normalizationContractVersion: String!
  normalizationProfileRevision: String!
  units: [SearchExplainUnit!]!
  wholeQueryClauses: [SearchExplainClause!]!
  settings: SearchExplainSettings!
  candidateCount: Int!
  boostOnlyCandidateCount: Int!
  membershipSerializedBytes: Int!
  planFingerprint: String!
  matchedSynonymGroupIds: [ID!]!
  applicableProductBoostIds: [ID!]!
  reasons: [SearchExplainReason!]!
}

type SearchExplainUnit {
  source: String!
  normalized: String!
  kind: SearchLexicalUnitKind!
  removedAsStopword: Boolean!
  lexemes: [String!]!
  """Required plan unit containing this token, or null for a removed stopword."""
  planUnitIndex: Int
  """Executed clauses; emitted once on the first token of a grouped plan unit."""
  clauses: [SearchExplainClause!]!
  typoAlternatives: [SearchExplainTypoAlternative!]!
}

type SearchExplainClause {
  kind: SearchExplainClauseKind!
  value: String
  lexemes: [String!]!
  fields: [SearchField!]!
  synonymGroupId: ID
  requireSameElement: Boolean!
  alternatives: [SearchExplainClause!]!
}

type SearchExplainTypoAlternative {
  value: String!
  lexemes: [String!]!
  editDistance: Int!
  trigramSimilarity: Float!
}

type SearchExplainSettings {
  version: Int!
  enabledFields: [SearchField!]!
  fieldWeights: [SearchExplainFieldWeight!]!
  typoToleranceEnabled: Boolean!
  outOfStockPolicy: SearchOutOfStockPolicy!
}

type SearchExplainFieldWeight {
  field: SearchField!
  weight: Float!
}

type SearchSettings {
  version: Int!
  fields: [SearchFieldConfiguration!]!
  typoToleranceEnabled: Boolean!
  outOfStockPolicy: SearchOutOfStockPolicy!
  updatedAt: DateTime!
  updatedById: ID!
}

type SearchFieldConfiguration {
  field: SearchField!
  weight: Float!
}

input SearchSettingsCreateInput {
  fields: [SearchFieldConfigurationInput!]!
  typoToleranceEnabled: Boolean!
  outOfStockPolicy: SearchOutOfStockPolicy!
}

input SearchSettingsUpdateInput {
  expectedVersion: Int!
  fields: [SearchFieldConfigurationInput!]!
  typoToleranceEnabled: Boolean!
  outOfStockPolicy: SearchOutOfStockPolicy!
}

input SearchFieldConfigurationInput {
  field: SearchField!
  weight: Float!
}

input SearchSynonymGroupCreateInput {
  locale: LocaleCode!
  name: String!
  enabled: Boolean = true
  values: [String!]!
}

input SearchSynonymGroupUpdateInput {
  id: ID!
  expectedVersion: Int!
  locale: LocaleCode!
  name: String!
  enabled: Boolean!
  values: [String!]!
}

input SearchProductBoostCreateInput {
  locale: LocaleCode!
  name: String!
  enabled: Boolean = true
  phrases: [String!]!
  productIds: [ID!]!
}

input SearchProductBoostUpdateInput {
  id: ID!
  expectedVersion: Int!
  locale: LocaleCode!
  name: String!
  enabled: Boolean!
  phrases: [String!]!
  productIds: [ID!]!
}

input SearchConfigurationDeleteInput {
  id: ID!
  expectedVersion: Int!
}

type SearchSynonymGroupPayload {
  synonymGroup: SearchSynonymGroup
  userErrors: [GenericUserError!]!
}

type SearchSynonymGroupDeletePayload {
  deletedSynonymGroupId: ID
  userErrors: [GenericUserError!]!
}

type SearchProductBoostPayload {
  productBoost: SearchProductBoost
  userErrors: [GenericUserError!]!
}

type SearchProductBoostDeletePayload {
  deletedProductBoostId: ID
  userErrors: [GenericUserError!]!
}

type SearchSettingsPayload {
  settings: SearchSettings
  currentVersion: Int
  userErrors: [GenericUserError!]!
}
