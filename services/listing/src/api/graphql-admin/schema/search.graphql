type ListingSearchQuery {
  """Current search settings for the selected store, if initialized."""
  settings: SearchSettings
  synonymGroup(id: ID!): SearchSynonymGroup
  synonymGroups(
    first: Int
    after: String
    last: Int
    before: String
    where: SearchSynonymGroupWhereInput
    orderBy: [SearchSynonymGroupOrderByInput!]
  ): SearchSynonymGroupConnection!
  productBoost(id: ID!): SearchProductBoost
  productBoosts(
    first: Int
    after: String
    last: Int
    before: String
    where: SearchProductBoostWhereInput
    orderBy: [SearchProductBoostOrderByInput!]
    meta: SearchProductBoostsMetaInput
  ): SearchProductBoostConnection!
  """Explain the canonical request-level search plan and its candidate membership."""
  explain(query: String!, locale: LocaleCode!): SearchExplain!
}

type ListingSearchMutation {
  """Unified update of the complete search configuration."""
  settingsUpdate(
    """Expected global search configuration version."""
    expectedVersion: Int!
    """Operations to apply."""
    operations: SearchSettingsOperationsInput!
  ): SearchSettingsUpdatePayload!
}

type SearchSynonymGroup {
  id: ID!
  locale: LocaleCode!
  name: String!
  enabled: Boolean!
  version: Int!
  values: [SearchSynonymValue!]!
  valuesCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SearchSynonymValue {
  value: String!
  position: Int!
}

type SearchSynonymGroupConnection {
  edges: [SearchSynonymGroupEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type SearchSynonymGroupEdge {
  node: SearchSynonymGroup!
  cursor: String!
}

type SearchProductBoost {
  id: ID!
  locale: LocaleCode!
  name: String!
  enabled: Boolean!
  version: Int!
  phrases: [SearchProductBoostPhrase!]!
  phrasesCount: Int!
  productIds: [ID!]!
  productsCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SearchProductBoostPhrase {
  phrase: String!
  position: Int!
}

type SearchProductBoostConnection {
  edges: [SearchProductBoostEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type SearchProductBoostEdge {
  node: SearchProductBoost!
  cursor: String!
}

input SearchProductBoostsMetaInput {
  """Match boosts containing any selected Product global ID."""
  productIds: [ID!]!
}

enum SearchExecutionMode {
  PRIMARY
  FUZZY
}

enum SearchLexicalUnitKind {
  TEXT
  NUMBER
  CODE
  FOREIGN
  MIXED_SCRIPT
  STOPWORD
}

enum SearchExplainClauseKind {
  FTS_TERMS
  FTS_PHRASE
  SYNONYM
  IDENTIFIER_EXACT
  IDENTIFIER_PREFIX
}

enum SearchField {
  PRODUCT_TITLE
  VARIANT_TITLE
  VENDOR_NAME
  CATEGORY_NAME
}

enum SearchOutOfStockPolicy {
  SHOW
  HIDE
  PLACE_LAST
}

enum SearchExplainReason {
  STOPWORD_REMOVAL
  SYNONYM_EXPANSION
  IDENTIFIER_EXPANSION
  PRODUCT_BOOST
  BOOST_ONLY_CANDIDATE
  FUZZY_FALLBACK
  TYPO_EXPANSION
}

type SearchExplain {
  mode: SearchExecutionMode!
  originalQuery: String!
  normalizedQuery: String!
  locale: LocaleCode!
  normalizationContractVersion: String!
  normalizationProfileRevision: String!
  units: [SearchExplainUnit!]!
  wholeQueryClauses: [SearchExplainClause!]!
  settings: SearchExplainSettings!
  candidateCount: Int!
  boostOnlyCandidateCount: Int!
  membershipSerializedBytes: Int!
  planFingerprint: String!
  matchedSynonymGroupIds: [ID!]!
  applicableProductBoostIds: [ID!]!
  reasons: [SearchExplainReason!]!
}

type SearchExplainUnit {
  source: String!
  normalized: String!
  kind: SearchLexicalUnitKind!
  removedAsStopword: Boolean!
  lexemes: [String!]!
  """Required plan unit containing this token, or null for a removed stopword."""
  planUnitIndex: Int
  """Executed clauses; emitted once on the first token of a grouped plan unit."""
  clauses: [SearchExplainClause!]!
  typoAlternatives: [SearchExplainTypoAlternative!]!
}

type SearchExplainClause {
  kind: SearchExplainClauseKind!
  value: String
  lexemes: [String!]!
  fields: [SearchField!]!
  synonymGroupId: ID
  requireSameElement: Boolean!
  alternatives: [SearchExplainClause!]!
}

type SearchExplainTypoAlternative {
  value: String!
  lexemes: [String!]!
  editDistance: Int!
  trigramSimilarity: Float!
}

type SearchExplainSettings {
  version: Int!
  enabledFields: [SearchField!]!
  fieldWeights: [SearchExplainFieldWeight!]!
  typoToleranceEnabled: Boolean!
  outOfStockPolicy: SearchOutOfStockPolicy!
}

type SearchExplainFieldWeight {
  field: SearchField!
  weight: Float!
}

type SearchSettings {
  version: Int!
  fields: [SearchFieldConfiguration!]!
  typoToleranceEnabled: Boolean!
  outOfStockPolicy: SearchOutOfStockPolicy!
  updatedAt: DateTime!
}

type SearchFieldConfiguration {
  field: SearchField!
  weight: Float!
}

input SearchSettingsOperationsInput {
  """Main search settings replacement."""
  settings: SearchSettingsValuesInput
  """Synonym group operations."""
  synonymGroups: [SearchSynonymGroupOperationInput!]
  """Product boost operations."""
  productBoosts: [SearchProductBoostOperationInput!]
}

input SearchSettingsValuesInput {
  fields: [SearchFieldConfigurationInput!]!
  typoToleranceEnabled: Boolean!
  outOfStockPolicy: SearchOutOfStockPolicy!
}

enum SearchConfigurationOperationAction {
  CREATE
  UPDATE
  DELETE
}

input SearchFieldConfigurationInput {
  field: SearchField!
  weight: Float!
}

input SearchSynonymGroupOperationInput {
  action: SearchConfigurationOperationAction!
  id: ID
  clientMutationId: String
  locale: LocaleCode
  name: String
  enabled: Boolean
  values: [String!]
}

input SearchProductBoostOperationInput {
  action: SearchConfigurationOperationAction!
  id: ID
  clientMutationId: String
  locale: LocaleCode
  name: String
  enabled: Boolean
  phrases: [String!]
  productIds: [ID!]
}

enum SearchSettingsOperationType {
  SETTINGS_UPDATE
  SYNONYM_GROUP_CREATE
  SYNONYM_GROUP_UPDATE
  SYNONYM_GROUP_DELETE
  PRODUCT_BOOST_CREATE
  PRODUCT_BOOST_UPDATE
  PRODUCT_BOOST_DELETE
}

type SearchSettingsOperationResult {
  type: SearchSettingsOperationType!
  applied: Boolean!
  clientMutationId: String
  entityId: ID
  errors: [GenericUserError!]!
}

type SearchSettingsUpdatePayload {
  settings: SearchSettings
  operationResults: [SearchSettingsOperationResult!]!
  userErrors: [GenericUserError!]!
}
