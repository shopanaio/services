enum FacetType {
  PRICE
  TAG
  FEATURE
  OPTION
  IN_STOCK
}

enum FacetUIType {
  CHECKBOX
  RADIO
  DROPDOWN
  RANGE
  BOOLEAN
}

enum FacetSelectionMode {
  SINGLE
  MULTI
}

"""
Listing contexts where a facet is available.

SEARCH applies to listing requests without a category context.
CATEGORY applies to every category-scoped listing request.
COLLECTION applies to every collection-scoped listing request.
"""
enum FacetScopeType {
  SEARCH
  CATEGORY
  COLLECTION
}

enum FacetValueKind {
  SOURCE
  GROUP
}

"""
Type of visual swatch for facet values.
"""
enum SwatchType {
  COLOR
  GRADIENT
  IMAGE
}

type Facet implements Node {
  id: ID!
  facetType: FacetType!
  slug: String!
  label: String!
  uiType: FacetUIType!
  selectionMode: FacetSelectionMode!
  scopes: [FacetScopeType!]!
  lexoRank: String!
  sources: [FacetSource!]!
  values: [FacetValue!]!
}

type FacetSource {
  handle: String!
  name: String!
}

type FacetSourceCandidate {
  id: ID!
  locale: String!
  facetType: FacetType!
  handle: String!
  name: String
}

type FacetSourceCandidateEdge {
  cursor: String!
  node: FacetSourceCandidate!
}

type FacetSourceCandidateConnection {
  edges: [FacetSourceCandidateEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type FacetValueCandidate {
  id: ID!
  facetType: FacetType!
  sourceHandle: String!
  handle: String!
  label: String!
}

type FacetValueCandidateEdge {
  cursor: String!
  node: FacetValueCandidate!
}

type FacetValueCandidateConnection {
  edges: [FacetValueCandidateEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type FacetValue implements Node {
  id: ID!
  facet: Facet!
  parent: FacetValue
  kind: FacetValueKind!
  handle: String!
  label: String!
  sourceValues: [FacetValue!]!
  swatch: FacetSwatch
  sortIndex: Int!
  enabled: Boolean!
}

type FacetSwatch implements Node @key(fields: "id") {
  id: ID!
  swatchType: SwatchType!
  colorOne: String
  colorTwo: String
  file: File
  metadata: JSON
}

input FacetCreateSourceInput {
  handle: String!
  name: String!
}

input FacetCreateValueCandidateInput {
  handle: String!
  label: String!
  sourceHandle: String!
}

enum FacetValueCandidateType {
  TAG
  OPTION
  FEATURE
}

input FacetValueCandidatesMetaInput {
  candidateType: FacetValueCandidateType!
  sourceHandles: [String!]
  facetId: ID
}

input FacetCreateInput {
  facetType: FacetType!
  slug: String!
  uiType: FacetUIType
  selectionMode: FacetSelectionMode
  label: String!
  sources: [FacetCreateSourceInput!]
  valueCandidates: [FacetCreateValueCandidateInput!]
  """
  Defaults to SEARCH, CATEGORY, and COLLECTION when omitted.
  """
  scopes: [FacetScopeType!]
}

input FacetUpdateInput {
  fields: FacetFieldsInput
  position: FacetPositionInput
  values: [FacetValueOperationInput!]
}

input FacetFieldsInput {
  slug: String
  uiType: FacetUIType
  selectionMode: FacetSelectionMode
  label: String
  """
  Replaces the current scopes when provided. The list cannot be empty.
  """
  scopes: [FacetScopeType!]
}

"""
One item of the store-wide facet-scope replacement command. It deliberately
addresses several independent facet aggregates atomically.
"""
input FacetScopesUpdateItemInput {
  id: ID!
  scopes: [FacetScopeType!]!
}

input FacetScopesUpdateInput {
  updates: [FacetScopesUpdateItemInput!]!
}

input FacetPositionInput {
  afterFacetId: ID
  beforeFacetId: ID
}

enum FacetValueOperationAction {
  CREATE
  UPDATE
  DELETE
  MERGE
  UNMERGE
}

input FacetValueOperationInput {
  action: FacetValueOperationAction!
  facetValueId: ID
  values: FacetValueValuesInput
  merge: FacetValueMergeValuesInput
}

input FacetValueValuesInput {
  kind: FacetValueKind
  handle: String
  label: String
  """
  Source values to attach when this operation creates a group value.
  Ignored for UPDATE; use MERGE to attach values to an existing group.
  """
  sourceValueIds: [ID!]
  swatchId: ID
  sortIndex: Int
  enabled: Boolean
}

input FacetValueMergeValuesInput {
  targetGroupValueId: ID
  targetHandle: String
  targetLabel: String
  sourceValueIds: [ID!]
}

input FacetSwatchCreateInput {
  swatchType: SwatchType!
  colorOne: String
  colorTwo: String
  fileId: ID
  metadata: JSON
}

input FacetSwatchUpdateInput {
  fields: FacetSwatchFieldsInput
}

input FacetSwatchFieldsInput {
  swatchType: SwatchType
  colorOne: String
  colorTwo: String
  fileId: ID
  metadata: JSON
}

type FacetCreatePayload {
  facet: Facet
  userErrors: [GenericUserError!]!
}

type FacetUpdatePayload {
  facet: Facet
  operationResults: [FacetOperationResult!]!
  userErrors: [GenericUserError!]!
}

type FacetScopesUpdatePayload {
  facets: [Facet!]!
  userErrors: [GenericUserError!]!
}

type FacetDeletePayload {
  deletedFacetId: ID
  userErrors: [GenericUserError!]!
}

type FacetRebalancePayload {
  facets: [Facet!]!
  userErrors: [GenericUserError!]!
}

enum FacetOperationType {
  FIELDS_UPDATE
  MOVE
  VALUE_CREATE
  VALUE_UPDATE
  VALUE_DELETE
  VALUE_MERGE
  VALUE_UNMERGE
}

type FacetOperationResult {
  type: FacetOperationType!
  applied: Boolean!
  entityId: ID
  errors: [GenericUserError!]!
}

type FacetSwatchCreatePayload {
  facetSwatch: FacetSwatch
  userErrors: [GenericUserError!]!
}

type FacetSwatchUpdatePayload {
  facetSwatch: FacetSwatch
  operationResults: [FacetSwatchOperationResult!]!
  userErrors: [GenericUserError!]!
}

enum FacetSwatchOperationType {
  FIELDS_UPDATE
}

type FacetSwatchOperationResult {
  type: FacetSwatchOperationType!
  applied: Boolean!
  entityId: ID
  errors: [GenericUserError!]!
}

type FacetSwatchDeletePayload {
  deletedFacetSwatchId: ID
  userErrors: [GenericUserError!]!
}
