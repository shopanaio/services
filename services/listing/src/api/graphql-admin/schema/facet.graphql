enum FacetType {
  PRICE
  TAG
  FEATURE
  OPTION
  IN_STOCK
}

enum FacetUIType {
  CHECKBOX
  RADIO
  DROPDOWN
  RANGE
  BOOLEAN
}

enum FacetSelectionMode {
  SINGLE
  MULTI
}

"""
Listing contexts where a facet is available.

SEARCH applies to listing requests without a category context.
CATEGORY applies to every category-scoped listing request.
COLLECTION applies to every collection-scoped listing request.
"""
enum FacetScopeType {
  SEARCH
  CATEGORY
  COLLECTION
}

enum FacetValueKind {
  SOURCE
  GROUP
}

"""
Type of visual swatch for facet values.
"""
enum SwatchType {
  COLOR
  GRADIENT
  IMAGE
}

type Facet implements Node {
  id: ID!
  facetType: FacetType!
  slug: String!
  label: String!
  uiType: FacetUIType!
  selectionMode: FacetSelectionMode!
  scopes: [FacetScopeType!]!
  lexoRank: String!
  sources: [FacetSource!]!
  values: [FacetValue!]!
}

type FacetSource {
  handle: String!
  name: String!
}

type FacetSourceCandidate {
  id: ID!
  locale: String!
  facetType: FacetType!
  handle: String!
  name: String
}

type FacetSourceCandidateEdge {
  cursor: String!
  node: FacetSourceCandidate!
}

type FacetSourceCandidateConnection {
  edges: [FacetSourceCandidateEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type FacetValueCandidate {
  id: ID!
  facetType: FacetType!
  sourceHandle: String!
  handle: String!
  label: String!
}

type FacetValueCandidateEdge {
  cursor: String!
  node: FacetValueCandidate!
}

type FacetValueCandidateConnection {
  edges: [FacetValueCandidateEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type FacetValue implements Node {
  id: ID!
  facet: Facet!
  parent: FacetValue
  kind: FacetValueKind!
  handle: String!
  label: String!
  sourceValues: [FacetValue!]!
  swatch: FacetSwatch
  sortIndex: Int!
  enabled: Boolean!
}

type FacetSwatch implements Node @key(fields: "id") {
  id: ID!
  swatchType: SwatchType!
  colorOne: String
  colorTwo: String
  file: File
  metadata: JSON
}

input FacetCreateSourceInput {
  handle: String!
  name: String!
}

input FacetCreateValueCandidateInput {
  handle: String!
  label: String!
  sourceHandle: String!
}

enum FacetValueCandidateType {
  TAG
  OPTION
  FEATURE
}

input FacetValueCandidatesMetaInput {
  candidateType: FacetValueCandidateType!
  sourceHandles: [String!]
  facetId: ID
}

input FacetCreateInput {
  facetType: FacetType!
  slug: String!
  uiType: FacetUIType
  selectionMode: FacetSelectionMode
  label: String!
  sources: [FacetCreateSourceInput!]
  valueCandidates: [FacetCreateValueCandidateInput!]
  """Defaults to SEARCH, CATEGORY, and COLLECTION when omitted."""
  scopes: [FacetScopeType!]
}

input FacetUpdateInput {
  id: ID!
  slug: String
  uiType: FacetUIType
  selectionMode: FacetSelectionMode
  label: String
  """Replaces the current scopes when provided. The list cannot be empty."""
  scopes: [FacetScopeType!]
}

input FacetScopesUpdateItemInput {
  id: ID!
  """Replaces the current scopes. The list cannot be empty."""
  scopes: [FacetScopeType!]!
}

input FacetScopesUpdateInput {
  """Only changed facets need to be included. All updates are applied atomically."""
  updates: [FacetScopesUpdateItemInput!]!
}

input FacetDeleteInput {
  id: ID!
}

input FacetMoveInput {
  id: ID!
  afterFacetId: ID
  beforeFacetId: ID
}

input FacetRebalanceInput {
  confirm: Boolean = true
}

input FacetValueCreateInput {
  facetId: ID!
  kind: FacetValueKind
  handle: String!
  label: String!
  sourceValueIds: [ID!]
  swatchId: ID
  sortIndex: Int
  enabled: Boolean
}

input FacetValueUpdateInput {
  id: ID!
  handle: String
  label: String
  swatchId: ID
  sortIndex: Int
  enabled: Boolean
}

input FacetValueMergeInput {
  facetId: ID!
  targetGroupValueId: ID
  targetHandle: String
  targetLabel: String
  sourceValueIds: [ID!]!
}

input FacetValueUnmergeInput {
  sourceValueIds: [ID!]!
}

input FacetValueDeleteInput {
  id: ID!
}

input FacetSwatchCreateInput {
  swatchType: SwatchType!
  colorOne: String
  colorTwo: String
  fileId: ID
  metadata: JSON
}

input FacetSwatchUpdateInput {
  id: ID!
  swatchType: SwatchType
  colorOne: String
  colorTwo: String
  fileId: ID
  metadata: JSON
}

input FacetSwatchDeleteInput {
  id: ID!
}

type FacetCreatePayload {
  facet: Facet
  userErrors: [GenericUserError!]!
}

type FacetUpdatePayload {
  facet: Facet
  userErrors: [GenericUserError!]!
}

type FacetScopesUpdatePayload {
  facets: [Facet!]!
  userErrors: [GenericUserError!]!
}

type FacetDeletePayload {
  deletedFacetId: ID
  userErrors: [GenericUserError!]!
}

type FacetMovePayload {
  facet: Facet
  userErrors: [GenericUserError!]!
}

type FacetRebalancePayload {
  facets: [Facet!]!
  userErrors: [GenericUserError!]!
}

type FacetValueCreatePayload {
  facetValue: FacetValue
  userErrors: [GenericUserError!]!
}

type FacetValueUpdatePayload {
  facetValue: FacetValue
  userErrors: [GenericUserError!]!
}

type FacetValueMergePayload {
  facetValue: FacetValue
  sourceValues: [FacetValue!]!
  userErrors: [GenericUserError!]!
}

type FacetValueUnmergePayload {
  sourceValues: [FacetValue!]!
  affectedGroupValues: [FacetValue!]!
  userErrors: [GenericUserError!]!
}

type FacetValueDeletePayload {
  deletedFacetValueId: ID
  userErrors: [GenericUserError!]!
}

type FacetSwatchCreatePayload {
  facetSwatch: FacetSwatch
  userErrors: [GenericUserError!]!
}

type FacetSwatchUpdatePayload {
  facetSwatch: FacetSwatch
  userErrors: [GenericUserError!]!
}

type FacetSwatchDeletePayload {
  deletedFacetSwatchId: ID
  userErrors: [GenericUserError!]!
}
