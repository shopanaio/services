  actionType: LoyaltyEarningActionType!
  actionSchemaVersion: Int = 1
  action: JSON!
  limitSchemaVersion: Int = 1
  limits: JSON! = {}
  stopProcessing: Boolean = false
}

input LoyaltyEarningRuleUpdateInput {
  earningRuleId: ID!
  name: String
  priority: Int
  triggerType: LoyaltyEarningTriggerType
  triggerSchemaVersion: Int
  triggerConfig: JSON
  conditionSchemaVersion: Int
  conditions: JSON
  actionType: LoyaltyEarningActionType
  actionSchemaVersion: Int
  action: JSON
  limitSchemaVersion: Int
  limits: JSON
  stopProcessing: Boolean
}

input LoyaltyEarningRuleDeleteInput {
  earningRuleId: ID!
