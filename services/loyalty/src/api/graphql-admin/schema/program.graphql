input LoyaltyTierPolicyUpsertInput {
  programVersionId: ID!
  windowType: LoyaltyTierEvaluationWindowType!
  rollingWindowDays: Int
  calendarPeriod: LoyaltyTierCalendarPeriod
  programYearStartsMonth: Int
  membershipDurationDays: Int
  gracePeriodDays: Int = 0
  downgradePolicy: LoyaltyTierDowngradePolicy = IMMEDIATE
  requalificationPolicy: LoyaltyTierRequalificationPolicy = AUTOMATIC
  metricSchemaVersion: Int = 1
}

input LoyaltyTierPolicyDeleteInput {
