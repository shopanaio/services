input LoyaltyRewardDefinitionUpdateInput {
  rewardDefinitionId: ID!
  name: String
  rewardType: LoyaltyRewardType
  configurationSchemaVersion: Int
  configuration: JSON
  validityDays: Int
  clearValidityDays: Boolean = false
  startsAt: DateTime
  clearStartsAt: Boolean = false
  endsAt: DateTime
  clearEndsAt: Boolean = false
  issuanceLimit: BigInt
  clearIssuanceLimit: Boolean = false
  perAccountLimit: BigInt
  clearPerAccountLimit: Boolean = false
