input LoyaltyRewardDefinitionCreateInput {
  programVersionId: ID!
  code: String!
  name: String!
  rewardType: LoyaltyRewardType!
  configurationSchemaVersion: Int = 1
  configuration: JSON!
  validityDays: Int
  startsAt: DateTime
  endsAt: DateTime
