type LoyaltyMoney {
  amountMinor: BigInt!
  currencyCode: CurrencyCode!
}

type LoyaltyProgram implements Node @key(fields: "id") {
  id: ID!
  code: String!
  name: String!
  status: LoyaltyProgramStatus!
  isDefault: Boolean!
  defaultCurrencyCode: CurrencyCode!
  metadata: JSON!
  activeVersion: LoyaltyProgramVersion
  versions: [LoyaltyProgramVersion!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  archivedAt: DateTime
}

type LoyaltyProgramVersion implements Node @key(fields: "id") {
  id: ID!
  program: LoyaltyProgram!
  version: Int!
  status: LoyaltyProgramVersionStatus!
  effectiveFrom: DateTime
  effectiveTo: DateTime
  earningEnabled: Boolean!
  redemptionEnabled: Boolean!
  activationDelaySeconds: Int!
  pointsExpiryDays: Int
  earnPoints: BigInt!
  earnAmountMinor: BigInt!
  minimumEligibleAmountMinor: BigInt!
  redeemPoints: BigInt!
  redeemAmountMinor: BigInt!
  minimumRedeemPoints: BigInt!
  maximumRedeemPointsPerOrder: BigInt
  maximumOrderPercentageBps: Int!
  roundingMode: LoyaltyRoundingMode!
  refundPolicy: LoyaltyRefundPolicy!
  debtPolicy: LoyaltyDebtPolicy!
  restoredPointsExpiryPolicy: LoyaltyRestoredPointsExpiryPolicy!
  rulesSchemaVersion: Int!
  rules: LoyaltyProgramRules!
  earningRules: [LoyaltyEarningRule!]!
  rewardDefinitions: [LoyaltyRewardDefinition!]!
  tierPolicy: LoyaltyTierPolicy
  tiers: [LoyaltyTier!]!
  createdById: ID
  publishedById: ID
  createdAt: DateTime!
  publishedAt: DateTime
  referenceReconciliationStatus: LoyaltyReferenceReconciliationStatus!
  referenceReconciliationCheckedAt: DateTime
}

type LoyaltyTier implements Node @key(fields: "id") {
  id: ID!
  programVersion: LoyaltyProgramVersion!
  code: String!
  name: String!
  rank: Int!
  qualificationSchemaVersion: Int!
  qualification: JSON!
  maintenance: JSON
  rewardBenefits: [LoyaltyTierRewardBenefit!]!
  createdAt: DateTime!
}

type LoyaltyTierPolicy implements Node @key(fields: "id") {
  id: ID!
  programVersion: LoyaltyProgramVersion!
  windowType: LoyaltyTierEvaluationWindowType!
  rollingWindowDays: Int
  calendarPeriod: LoyaltyTierCalendarPeriod
  programYearStartsMonth: Int
  membershipDurationDays: Int
  gracePeriodDays: Int!
  downgradePolicy: LoyaltyTierDowngradePolicy!
  requalificationPolicy: LoyaltyTierRequalificationPolicy!
  metricSchemaVersion: Int!
  createdAt: DateTime!
}

type LoyaltyEarningRule implements Node @key(fields: "id") {
  id: ID!
  programVersion: LoyaltyProgramVersion!
  code: String!
  name: String!
  priority: Int!
  triggerType: LoyaltyEarningTriggerType!
  triggerSchemaVersion: Int!
  triggerConfig: JSON!
  conditionSchemaVersion: Int!
  conditions: JSON!
  actionType: LoyaltyEarningActionType!
  actionSchemaVersion: Int!
  action: JSON!
  limitSchemaVersion: Int!
  limits: JSON!
  stopProcessing: Boolean!
  createdAt: DateTime!
}

type LoyaltyRewardDefinition implements Node @key(fields: "id") {
  id: ID!
  programVersion: LoyaltyProgramVersion!
  code: String!
  name: String!
  rewardType: LoyaltyRewardType!
  configurationSchemaVersion: Int!
  configuration: JSON!
  validityDays: Int
  startsAt: DateTime
  endsAt: DateTime
  issuanceLimit: BigInt
  perAccountLimit: BigInt
  issuedQuantity: BigInt!
  createdAt: DateTime!
}

type LoyaltyProgramRules {
  schemaVersion: Int!
  eligibility: LoyaltyProgramEligibility!
  earning: LoyaltyProgramEarningRules!
}

type LoyaltyProgramEligibility {
  type: LoyaltyProgramEligibilityType!
  channelCodes: [String!]!
  """
  Present only for SEGMENTS eligibility.
  """
  segmentMatchMode: LoyaltySegmentMatchMode
  segmentIds: [ID!]!
  excludedSegmentIds: [ID!]!
}

type LoyaltyProgramEarningRules {
  eligibleSpendBasis: LoyaltyEligibleSpendBasis!
  excludedSelectors: [LoyaltyCatalogSelector!]!
  modifierStackingMode: LoyaltyModifierStackingMode!
  modifiers: [LoyaltyEarningModifier!]!
}

type LoyaltyCatalogSelector {
  type: LoyaltyCatalogSelectorType!
  ids: [ID!]!
}

type LoyaltyEarningModifier {
  id: ID!
  title: String!
  priority: Int!
  multiplierBps: Int!
  selector: LoyaltyCatalogSelector!
  segmentIds: [ID!]!
  startsAt: DateTime
  endsAt: DateTime
}

type LoyaltyProgramConnection {
  edges: [LoyaltyProgramEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type LoyaltyProgramEdge {
  node: LoyaltyProgram!
  cursor: String!
}

input LoyaltyProgramWhereInput {
  ids: [ID!]
  statuses: [LoyaltyProgramStatus!]
  isDefault: Boolean
  search: String
}

input LoyaltyProgramCreateInput {
  code: String!
  name: String!
  defaultCurrencyCode: CurrencyCode!
  isDefault: Boolean = false
  metadata: JSON
}

input LoyaltyProgramUpdateInput {
  programId: ID!
  name: String
  status: LoyaltyProgramStatus
  isDefault: Boolean
  metadata: JSON
}

input LoyaltyProgramVersionCreateInput {
  programId: ID!
  effectiveFrom: DateTime
  effectiveTo: DateTime
  earningEnabled: Boolean = true
  redemptionEnabled: Boolean = true
  activationDelaySeconds: Int = 0
  pointsExpiryDays: Int
  earnPoints: BigInt!
  earnAmountMinor: BigInt!
  minimumEligibleAmountMinor: BigInt = "0"
  redeemPoints: BigInt!
  redeemAmountMinor: BigInt!
  minimumRedeemPoints: BigInt = "1"
  maximumRedeemPointsPerOrder: BigInt
  maximumOrderPercentageBps: Int = 10000
  roundingMode: LoyaltyRoundingMode = DOWN
  refundPolicy: LoyaltyRefundPolicy = PROPORTIONAL
  debtPolicy: LoyaltyDebtPolicy = TRACK_DEBT
  restoredPointsExpiryPolicy: LoyaltyRestoredPointsExpiryPolicy = ORIGINAL_EXPIRY
  rulesSchemaVersion: Int = 1
  rules: LoyaltyProgramRulesInput!
  earningRules: [LoyaltyEarningRuleInput!]! = []
  rewardDefinitions: [LoyaltyRewardDefinitionInput!]! = []
  tierPolicy: LoyaltyTierPolicyInput
  tiers: [LoyaltyTierInput!]
}

input LoyaltyTierInput {
  code: String!
  name: String!
  rank: Int!
  qualificationSchemaVersion: Int = 1
  qualification: JSON!
  maintenance: JSON
}

input LoyaltyTierPolicyInput {
  windowType: LoyaltyTierEvaluationWindowType!
  rollingWindowDays: Int
  calendarPeriod: LoyaltyTierCalendarPeriod
  programYearStartsMonth: Int
  membershipDurationDays: Int
  gracePeriodDays: Int = 0
  downgradePolicy: LoyaltyTierDowngradePolicy = IMMEDIATE
  requalificationPolicy: LoyaltyTierRequalificationPolicy = AUTOMATIC
  metricSchemaVersion: Int = 1
}

input LoyaltyEarningRuleInput {
  code: String!
  name: String!
  priority: Int = 0
  triggerType: LoyaltyEarningTriggerType!
  triggerSchemaVersion: Int = 1
  triggerConfig: JSON! = {}
  conditionSchemaVersion: Int = 1
  conditions: JSON!
  actionType: LoyaltyEarningActionType!
  actionSchemaVersion: Int = 1
  action: JSON!
  limitSchemaVersion: Int = 1
  limits: JSON! = {}
  stopProcessing: Boolean = false
}

input LoyaltyRewardDefinitionInput {
  code: String!
  name: String!
  rewardType: LoyaltyRewardType!
  configurationSchemaVersion: Int = 1
  configuration: JSON!
  validityDays: Int
  startsAt: DateTime
  endsAt: DateTime
  issuanceLimit: BigInt
  perAccountLimit: BigInt
}

input LoyaltyProgramRulesInput {
  schemaVersion: Int = 1
  eligibility: LoyaltyProgramEligibilityInput!
  earning: LoyaltyProgramEarningRulesInput!
}

input LoyaltyProgramEligibilityInput {
  type: LoyaltyProgramEligibilityType!
  channelCodes: [String!]!
  """
  Required for SEGMENTS and forbidden for ALL.
  """
  segmentMatchMode: LoyaltySegmentMatchMode
  """
  Must be empty for ALL and non-empty for SEGMENTS.
  """
  segmentIds: [ID!]! = []
  excludedSegmentIds: [ID!]! = []
}

input LoyaltyProgramEarningRulesInput {
  eligibleSpendBasis: LoyaltyEligibleSpendBasis!
  excludedSelectors: [LoyaltyCatalogSelectorInput!]!
  modifierStackingMode: LoyaltyModifierStackingMode = HIGHEST
  modifiers: [LoyaltyEarningModifierInput!]!
}

input LoyaltyCatalogSelectorInput {
  type: LoyaltyCatalogSelectorType!
  """
  Must be empty for ALL and non-empty for every specific selector type.
  """
  ids: [ID!]!
}

input LoyaltyEarningModifierInput {
  id: ID!
  title: String!
  priority: Int!
  """
  10000 equals a 1x multiplier.
  """
  multiplierBps: Int!
  selector: LoyaltyCatalogSelectorInput!
  segmentIds: [ID!]!
  startsAt: DateTime
  endsAt: DateTime
}

input LoyaltyProgramVersionPublishInput {
  programVersionId: ID!
  effectiveFrom: DateTime!
  effectiveTo: DateTime
}

type LoyaltyProgramCreatePayload {
  program: LoyaltyProgram
  userErrors: [LoyaltyUserError!]!
}

type LoyaltyProgramUpdatePayload {
  program: LoyaltyProgram
  userErrors: [LoyaltyUserError!]!
}

type LoyaltyProgramVersionCreatePayload {
  programVersion: LoyaltyProgramVersion
  userErrors: [LoyaltyUserError!]!
}

type LoyaltyProgramVersionPublishPayload {
  programVersion: LoyaltyProgramVersion
  userErrors: [LoyaltyUserError!]!
}

input LoyaltyProgramVersionUpdateInput {
  programVersionId: ID!
  effectiveFrom: DateTime
  effectiveTo: DateTime
  clearEffectiveTo: Boolean = false
  earningEnabled: Boolean
  redemptionEnabled: Boolean
  activationDelaySeconds: Int
  pointsExpiryDays: Int
  clearPointsExpiryDays: Boolean = false
  earnPoints: BigInt
  earnAmountMinor: BigInt
  minimumEligibleAmountMinor: BigInt
  redeemPoints: BigInt
  redeemAmountMinor: BigInt
  minimumRedeemPoints: BigInt
  maximumRedeemPointsPerOrder: BigInt
  clearMaximumRedeemPointsPerOrder: Boolean = false
  maximumOrderPercentageBps: Int
  roundingMode: LoyaltyRoundingMode
  refundPolicy: LoyaltyRefundPolicy
  debtPolicy: LoyaltyDebtPolicy
  restoredPointsExpiryPolicy: LoyaltyRestoredPointsExpiryPolicy
  rules: LoyaltyProgramRulesInput
}

input LoyaltyProgramVersionDeleteInput {
  programVersionId: ID!
}

type LoyaltyProgramVersionUpdatePayload {
  programVersion: LoyaltyProgramVersion
  userErrors: [LoyaltyUserError!]!
}

type LoyaltyProgramVersionDeletePayload {
  deletedProgramVersionId: ID
  userErrors: [LoyaltyUserError!]!
}

