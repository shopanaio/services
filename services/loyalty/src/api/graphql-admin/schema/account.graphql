type LoyaltyAccount implements Node @key(fields: "id") {
  id: ID!
  program: LoyaltyProgram!
  customerId: ID!
  customer: Customer
  status: LoyaltyAccountStatus!
  balance: LoyaltyAccountBalance!
  tierMembership: LoyaltyTierMembership
  tierMemberships(
    first: Int
    after: String
    last: Int
    before: String
    orderBy: [LoyaltyTierMembershipOrderByInput!]
  ): LoyaltyTierMembershipConnection!
  rewardEntitlements(
    first: Int
    after: String
    last: Int
    before: String
    orderBy: [LoyaltyRewardEntitlementOrderByInput!]
  ): LoyaltyRewardEntitlementConnection!
  monetaryWallets: [LoyaltyMonetaryWallet!]!
  mergedIntoAccount: LoyaltyAccount
  suspendedReason: String
  openedAt: DateTime!
  suspendedAt: DateTime
  closedAt: DateTime
  updatedAt: DateTime!
  expiringPoints(first: Int = 20): [LoyaltyExpiringPoints!]!
  transactions(
    first: Int
    after: String
    last: Int
    before: String
    where: LoyaltyTransactionWhereInput
    orderBy: [LoyaltyTransactionOrderByInput!]
  ): LoyaltyTransactionConnection!
}

type LoyaltyAccountBalance {
  pendingPoints: BigInt!
  availablePoints: BigInt!
  reservedPoints: BigInt!
  debtPoints: BigInt!
  lifetimeEarnedPoints: BigInt!
  lifetimeRedeemedPoints: BigInt!
  lifetimeExpiredPoints: BigInt!
  lifetimeAdjustedPoints: BigInt!
  updatedAt: DateTime!
}

type LoyaltyExpiringPoints {
  lotId: ID!
  points: BigInt!
  expiresAt: DateTime!
}

type LoyaltyTierMembership implements Node @key(fields: "id") {
  id: ID!
  account: LoyaltyAccount!
  tier: LoyaltyTier!
  status: LoyaltyTierMembershipStatus!
  evaluationPeriodStartedAt: DateTime!
  evaluationPeriodEndedAt: DateTime!
  qualifiedAt: DateTime!
  effectiveFrom: DateTime!
  effectiveTo: DateTime
  events: [LoyaltyTierMembershipEvent!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type LoyaltyTierMembershipEvent implements Node @key(fields: "id") {
  id: ID!
  account: LoyaltyAccount!
  membership: LoyaltyTierMembership!
  previousTier: LoyaltyTier
  tier: LoyaltyTier!
  eventType: LoyaltyTierMembershipEventType!
  evaluationRevision: String!
  reasonCode: String!
  occurredAt: DateTime!
  metadata: JSON!
  createdAt: DateTime!
}

type LoyaltyAccountConnection {
  edges: [LoyaltyAccountEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type LoyaltyAccountEdge {
  node: LoyaltyAccount!
  cursor: String!
}

input LoyaltyAccountWhereInput {
  ids: [ID!]
  programIds: [ID!]
  customerIds: [ID!]
  statuses: [LoyaltyAccountStatus!]
  minimumAvailablePoints: BigInt
  hasDebt: Boolean
  tierIds: [ID!]
}

enum LoyaltyAccountOrderField {
  id
  customerId
  status
  openedAt
  suspendedAt
  closedAt
  updatedAt
}

input LoyaltyAccountOrderByInput {
  field: LoyaltyAccountOrderField!
  direction: SortDirection!
}

type LoyaltyTierMembershipConnection {
  edges: [LoyaltyTierMembershipEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type LoyaltyTierMembershipEdge {
  node: LoyaltyTierMembership!
  cursor: String!
}

enum LoyaltyTierMembershipOrderField {
  id
  status
  qualifiedAt
  effectiveFrom
  effectiveTo
  createdAt
  updatedAt
}

input LoyaltyTierMembershipOrderByInput {
  field: LoyaltyTierMembershipOrderField!
  direction: SortDirection!
}

input LoyaltyAccountStatusUpdateInput {
  accountId: ID!
  status: LoyaltyAccountStatus!
  reason: String!
}

input LoyaltyPointsAdjustInput {
  accountId: ID!
  direction: LoyaltyPointsAdjustmentDirection!
  points: BigInt!
  reasonCode: String!
  description: String!
  expiresAt: DateTime
  metadata: JSON
}

type LoyaltyAccountStatusUpdatePayload {
  account: LoyaltyAccount
  userErrors: [LoyaltyUserError!]!
}

type LoyaltyPointsAdjustPayload {
  account: LoyaltyAccount
  transaction: LoyaltyTransaction
  userErrors: [LoyaltyUserError!]!
}

input LoyaltyAccountUpdateInput {
  status: LoyaltyAccountStatusOperationInput
  pointAdjustments: [LoyaltyPointsAdjustmentOperationInput!]
  monetaryConversions: [LoyaltyPointsToMonetaryOperationInput!]
  tierMemberships: [LoyaltyTierMembershipOperationInput!]
  rewardEntitlements: [LoyaltyRewardEntitlementOperationInput!]
  rebuildBalance: Boolean
}

input LoyaltyAccountStatusOperationInput {
  status: LoyaltyAccountStatus!
  reason: String!
}

input LoyaltyPointsAdjustmentOperationInput {
  direction: LoyaltyPointsAdjustmentDirection!
  points: BigInt!
  reasonCode: String!
  description: String!
  expiresAt: DateTime
  metadata: JSON
}

input LoyaltyPointsToMonetaryOperationInput {
  programVersionId: ID!
  walletType: LoyaltyMonetaryWalletType!
  currencyCode: CurrencyCode!
  points: BigInt!
  occurredAt: DateTime
}

enum LoyaltyTierMembershipOperationAction {
  EVALUATE
  REVOKE
}

input LoyaltyTierMembershipOperationInput {
  action: LoyaltyTierMembershipOperationAction!
  tierMembershipId: ID
  programVersionId: ID
  effectiveAt: DateTime
  forceRequalification: Boolean = false
  reasonCode: String!
}

enum LoyaltyRewardEntitlementOperationAction {
  ISSUE
  RELEASE
  REVOKE
}

input LoyaltyRewardEntitlementOperationInput {
  action: LoyaltyRewardEntitlementOperationAction!
  rewardEntitlementId: ID
  rewardDefinitionId: ID
  quantity: BigInt = "1"
  externalReference: String
  occurredAt: DateTime
  reasonCode: String
}

type LoyaltyAccountUpdatePayload {
  account: LoyaltyAccount
  operationResults: [LoyaltyOperationResult!]!
  userErrors: [LoyaltyUserError!]!
}
