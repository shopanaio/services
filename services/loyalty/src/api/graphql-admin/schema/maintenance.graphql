input LoyaltyMaintenanceRunInput {
  effectiveAt: DateTime!
  limit: Int = 100
  rebuildBalances: Boolean = false
}

type LoyaltyMaintenanceResult {
  activatedProgramVersions: Int!
  expiredReservations: Int!
  activatedPointLots: Int!
  expiredPointLots: Int!
  activatedMonetaryLots: Int!
  expiredMonetaryLots: Int!
  evaluatedTiers: Int!
  expiredRewards: Int!
  rebuiltBalances: Int!
  reconciledProgramVersions: Int!
  staleProgramVersions: Int!
}

type LoyaltyMaintenanceRunPayload {
  result: LoyaltyMaintenanceResult
  userErrors: [LoyaltyUserError!]!
}

input LoyaltyAccountBalanceRebuildInput {
  accountId: ID!
}

type LoyaltyAccountBalanceRebuildPayload {
  account: LoyaltyAccount
  balance: LoyaltyAccountBalance
  userErrors: [LoyaltyUserError!]!
}

input LoyaltyMonetaryWalletBalanceRebuildInput {
  walletId: ID!
}
