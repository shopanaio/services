type LoyaltyEventFact implements Node @key(fields: "id") {
  id: ID!
  producer: String!
  externalEventId: String!
  eventType: String!
  subjectType: String!
  subjectId: String!
  customerId: ID
  occurredAt: DateTime!
  payloadSchemaVersion: Int!
  payloadHash: String!
  payload: JSON!
  receivedAt: DateTime!
  evaluations: [LoyaltyEventEvaluation!]!
}

type LoyaltyEventEvaluation implements Node @key(fields: "id") {
  id: ID!
  eventFact: LoyaltyEventFact!
  earningRule: LoyaltyEarningRule!
  account: LoyaltyAccount!
  decision: LoyaltyEventEvaluationDecision!
  reasonCode: String!
  pointsAwarded: BigInt
  monetaryAmount: LoyaltyMoney
  transaction: LoyaltyTransaction
  resultSchemaVersion: Int!
  result: JSON!
  evaluatedAt: DateTime!
}

type LoyaltyEarningRuleUsage implements Node @key(fields: "id") {
  id: ID!
  earningRule: LoyaltyEarningRule!
  scopeKey: String!
  windowStartedAt: DateTime!
  windowEndedAt: DateTime
  occurrenceCount: BigInt!
  pointsAwarded: BigInt!
  monetaryAmounts: JSON!
  updatedAt: DateTime!
}

type LoyaltyEventFactConnection {
  edges: [LoyaltyEventFactEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type LoyaltyEventFactEdge {
  node: LoyaltyEventFact!
  cursor: String!
}

enum LoyaltyEventFactOrderField {
  id
  producer
  externalEventId
  eventType
  subjectType
  subjectId
  customerId
  occurredAt
  receivedAt
}

input LoyaltyEventFactOrderByInput {
  field: LoyaltyEventFactOrderField!
  direction: SortDirection!
}

type LoyaltyEventEvaluationConnection {
  edges: [LoyaltyEventEvaluationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type LoyaltyEventEvaluationEdge {
  node: LoyaltyEventEvaluation!
  cursor: String!
}

enum LoyaltyEventEvaluationOrderField {
  id
  decision
  pointsAwarded
  evaluatedAt
}

input LoyaltyEventEvaluationOrderByInput {
  field: LoyaltyEventEvaluationOrderField!
  direction: SortDirection!
}

type LoyaltyEarningRuleUsageConnection {
  edges: [LoyaltyEarningRuleUsageEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type LoyaltyEarningRuleUsageEdge {
  node: LoyaltyEarningRuleUsage!
  cursor: String!
}

enum LoyaltyEarningRuleUsageOrderField {
  id
  scopeKey
  windowStartedAt
  windowEndedAt
  occurrenceCount
  pointsAwarded
  updatedAt
}

input LoyaltyEarningRuleUsageOrderByInput {
  field: LoyaltyEarningRuleUsageOrderField!
  direction: SortDirection!
}

input LoyaltyEventFactWhereInput {
  customerIds: [ID!]
  producers: [String!]
  eventTypes: [String!]
  occurredFrom: DateTime
  occurredTo: DateTime
}

input LoyaltyEventEvaluationWhereInput {
  eventFactId: ID
  accountId: ID
  earningRuleId: ID
  decisions: [LoyaltyEventEvaluationDecision!]
}

input LoyaltyEarningRuleUsageWhereInput {
  earningRuleId: ID!
  scopeKey: String
  effectiveAt: DateTime
}
