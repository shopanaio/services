enum StoreIntegrationType {
  IAM
  PAYMENT
  SHIPPING
  STORAGE
  EMAIL
  ANALYTICS
}

enum StoreIntegrationStatus {
  ACTIVE
  INACTIVE
  ERROR
}

type StoreIntegration implements Node @key(fields: "id") {
  id: ID!
}

type StoreIntegrationConnection {
  edges: [StoreIntegrationEdge!]!
  nodes: [StoreIntegration!]!
  pageInfo: PageInfo!
}

type StoreIntegrationEdge {
  cursor: String!
  node: StoreIntegration!
}
