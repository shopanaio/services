type Store implements Node @key(fields: "id") {
  id: ID!
}

type Locale implements Node @key(fields: "id") {
  id: ID!
}

type StoreConnection {
  edges: [StoreEdge!]!
  nodes: [Store!]!
  pageInfo: PageInfo!
}

type StoreEdge {
  cursor: String!
  node: Store!
}

type LocaleConnection {
  edges: [LocaleEdge!]!
  nodes: [Locale!]!
  pageInfo: PageInfo!
}

type LocaleEdge {
  cursor: String!
  node: Locale!
}
