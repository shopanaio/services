type Store implements Node @key(fields: "id") {
  id: ID!
  handle: String!
  name: String!
  description: String
  email: String
  timezone: String!
  defaultLocale: LocaleCode!
  defaultCurrency: CurrencyCode!
  contact: StoreContact
  address: StoreAddress
  brand: StoreBrand!
  markets(
    first: Int = 20
    after: String
    last: Int
    before: String
  ): MarketConnection!
}
