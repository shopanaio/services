"""
Locale configuration for the project
"""
type Locale {
  """
  BCP 47 locale code
  """
  code: LocaleCode!
  """
  Display name of the locale
  """
  name: String!
  """
  Whether this locale is currently active for the project
  """
  isActive: Boolean!
}

"""
Operation on a locale owned by the store. The order of items in this list is
preserved by storeUpdate.
"""
input StoreLocaleOperationInput {
  action: StoreLocaleOperationAction!
  code: LocaleCode!
  """
  Required for CREATE; ignored by DELETE and SET_DEFAULT.
  """
  isActive: Boolean
}

enum StoreLocaleOperationAction {
  CREATE
  DELETE
  SET_DEFAULT
}
