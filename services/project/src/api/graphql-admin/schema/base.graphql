extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: [
      "@key"
      "@requires"
      "@provides"
      "@external"
      "@shareable"
      "@override"
      "@inaccessible"
    ]
  )

"""
ISO 8601 date-time string
"""
scalar DateTime
"""
Valid email address
"""
scalar Email

extend type Query {
  """
  Store-related queries
  """
  storeQuery: StoreQuery!
}

extend type Mutation {
  """
  Store-related mutations
  """
  storeMutation: StoreMutation!
}

"""
Queries for store management
"""
type StoreQuery {
  """
  Get a Store-owned Relay node by its global ID
  """
  node(id: ID!): Node

  """
  Get Store-owned Relay nodes while preserving input order
  """
  nodes(ids: [ID!]!): [Node]!

  """
  Get all stores accessible to the current user in the organization
  """
  stores(
    """
    Organization ID to list stores from
    """
    organizationId: ID!
  ): [Store!]!

  """
  Get the current store from context
  """
  currentStore: Store
}

"""
Mutations for store management
"""
type StoreMutation {
  # Store mutations
  """
  Create a new store
  """
  storeCreate(input: StoreCreateInput!): StoreCreatePayload!
  """
  Unified store update composed from independent settings operations
  """
  storeUpdate(
    """
    The store ID to update
    """
    storeId: ID!
    """
    Store settings operations to apply
    """
    operations: StoreUpdateInput!
  ): StoreUpdatePayload!
  """
  Delete a store
  """
  storeDelete(storeId: ID!): StoreDeletePayload!
}
