# ---- Stock & Warehouse Types ----

"""
A warehouse represents a physical location where inventory is stored.
"""
type Warehouse implements Node @key(fields: "id") {
  """
  The globally unique ID of the warehouse.
  """
  id: ID!

  """
  The unique code identifying this warehouse.
  """
  code: String!

  """
  The display name of the warehouse.
  """
  name: String!

  """
  Whether this is the default warehouse for the project.
  """
  isDefault: Boolean!

  """
  The date and time when the warehouse was created.
  """
  createdAt: DateTime!

  """
  The date and time when the warehouse was last updated.
  """
  updatedAt: DateTime!

  """
  Stock levels for all variants in this warehouse.
  """
  stock(
    first: Int
    after: String
    last: Int
    before: String
    """
    Filter conditions
    """
    where: WarehouseStockWhereInput
    """
    Sort order
    """
    orderBy: [WarehouseStockOrderByInput!]
  ): WarehouseStockConnection!

  """
  Total number of variants stocked in this warehouse.
  """
  variantsCount: Int!
}

"""
A connection to a list of Warehouse items.
"""
type WarehouseConnection {
  """
  A list of edges.
  """
  edges: [WarehouseEdge!]!

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!

  """
  The total number of warehouses.
  """
  totalCount: Int!
}

"""
An edge in a Warehouse connection.
"""
type WarehouseEdge {
  """
  The item at the end of the edge.
  """
  node: Warehouse!

  """
  A cursor for use in pagination.
  """
  cursor: String!
}

"""
Represents stock level for a variant in a specific warehouse.
"""
type WarehouseStock implements Node {
  """
  The globally unique ID of the stock record.
  """
  id: ID!

  """
  The globally unique ID of the warehouse this stock belongs to.
  """
  warehouseId: ID!

  """
  The globally unique ID of the variant this stock belongs to.
  """
  variantId: ID!

  """
  The warehouse where this stock is located.
  """
  warehouse: Warehouse!

  """
  The variant this stock record is for.
  """
  variant: Variant!

  """
  The quantity currently on hand.
  """
  quantityOnHand: Int!

  """
  The quantity currently reserved.
  """
  reservedQuantity: Int!

  """
  The quantity currently unavailable.
  """
  unavailableQuantity: Int!

  """
  The quantity available for sale.
  """
  availableForSale: Int!

  """
  The date and time when the stock was created.
  """
  createdAt: DateTime!

  """
  The date and time when the stock was last updated.
  """
  updatedAt: DateTime!
}

"""
A connection to a list of WarehouseStock items.
"""
type WarehouseStockConnection {
  """
  A list of edges.
  """
  edges: [WarehouseStockEdge!]!

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!

  """
  The total number of stock records.
  """
  totalCount: Int!
}

"""
An edge in a WarehouseStock connection.
"""
type WarehouseStockEdge {
  """
  The item at the end of the edge.
  """
  node: WarehouseStock!

  """
  A cursor for use in pagination.
  """
  cursor: String!
}

"""
Input for creating a warehouse.
"""
input WarehouseCreateInput {
  """
  The unique code for the warehouse.
  """
  code: String!

  """
  The display name for the warehouse.
  """
  name: String!

  """
  Whether this should be the default warehouse.
  """
  isDefault: Boolean
}

"""
Payload for warehouse creation.
"""
type WarehouseCreatePayload {
  """
  The created warehouse.
  """
  warehouse: Warehouse

  """
  List of errors that occurred during the mutation.
  """
  userErrors: [GenericUserError!]!
}

"""
Input for updating a warehouse.
"""
input WarehouseUpdateInput {
  """
  The new code for the warehouse.
  """
  code: String

  """
  The new name for the warehouse.
  """
  name: String

  """
  Whether this should be the default warehouse.
  """
  isDefault: Boolean

  """
  Owned warehouse-stock changes, applied in array order.
  """
  stock: [WarehouseStockOperationInput!]
}

"""
Payload for warehouse update.
"""
type WarehouseUpdatePayload {
  """
  The updated warehouse.
  """
  warehouse: Warehouse

  operationResults: [OperationResult!]!

  """
  List of errors that occurred during the mutation.
  """
  userErrors: [GenericUserError!]!
}

"""
Batch coordinator input for updates spanning multiple warehouse aggregates.

The request accepts at most 100 warehouses and 500 public operations in total.
Empty operations, empty operation arrays, and requests exceeding either limit
are rejected before any warehouse workflow is started. Repeated warehouse IDs
are grouped into one warehouseUpdate workflow, matching product bulk-update
semantics, while item and operation results retain their original input order.
"""
input WarehouseBatchUpdateInput {
  warehouses: [WarehouseBatchUpdateItemInput!]!
}

"""
One warehouse aggregate update within a batch. Items are processed and returned
in input order. The aggregate ID remains separate from its operations.
"""
input WarehouseBatchUpdateItemInput {
  warehouseId: ID!
  operations: WarehouseUpdateInput!
}

"""
Result of one warehouseUpdate coordinated by warehouseBatchUpdate.
"""
type WarehouseBatchUpdateItemResult {
  warehouseId: ID!
  warehouse: Warehouse
  operationResults: [OperationResult!]!
  userErrors: [GenericUserError!]!
}

"""
Ordered results for a multi-warehouse update.

userErrors contains request-level errors. Per-warehouse business errors are
returned both in the corresponding result and its operationResults.
"""
type WarehouseBatchUpdatePayload {
  results: [WarehouseBatchUpdateItemResult!]!
  userErrors: [GenericUserError!]!
}

"""
Payload for warehouse deletion.
"""
type WarehouseDeletePayload {
  """
  The ID of the deleted warehouse.
  """
  deletedWarehouseId: ID

  """
  List of errors that occurred during the mutation.
  """
  userErrors: [GenericUserError!]!
}

"""
An owned warehouse-stock operation. The warehouse is identified by the parent
`warehouseUpdate` argument, so it is deliberately not repeated here.
"""
input WarehouseStockOperationInput {
  action: WarehouseStockOperationAction!

  """
  The variant whose stock should be added.
  """
  variantId: ID!
}

enum WarehouseStockOperationAction {
  CREATE
  DELETE
}
