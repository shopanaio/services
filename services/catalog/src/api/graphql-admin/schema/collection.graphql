type Collection implements Node @key(fields: "id") {
  id: ID!
  handle: String
  type: CollectionType!
  name: String!
  description: RichText
  excerpt: RichText
  media: [CollectionMediaItem!]!
  seo: Seo
  defaultSort: ProductSortBy!
  defaultSortDirection: SortDirection!
  activeFrom: DateTime
  activeTo: DateTime
  isActive: Boolean!
  publishedAt: DateTime
  isPublished: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  revision: Int!
  listingRevision: Int! @inaccessible
  rules: [CollectionRule!]!
}

enum CollectionType {
  MANUAL
  RULE
}

type CollectionRule {
  id: ID!
  field: CollectionRuleField!
  operator: CollectionRuleOperator!
  value: JSON!
  sortIndex: Int!
  referenceStatus: CollectionRuleReferenceStatus!
}

enum CollectionRuleReferenceStatus {
  VALID
  STALE
  NOT_APPLICABLE
}

type CollectionMediaItem {
  file: File!
  sortIndex: Int!
}

type CollectionConnection {
  edges: [CollectionEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CollectionEdge {
  node: Collection!
  cursor: String!
}

enum CollectionRuleField {
  CATEGORY
  TAG
  VENDOR
  FEATURE
  OPTION
  PRICE
  IN_STOCK
  CREATED_AT
}

enum CollectionRuleOperator {
  IN
  ALL
  EQ
  GT
  GTE
  LT
  LTE
  BETWEEN
}

input CollectionRuleInput {
  field: CollectionRuleField!
  operator: CollectionRuleOperator!
  value: JSON!
}

input CollectionCreateInput {
  clientMutationId: String!
  handle: String
  type: CollectionType!
  name: String!
  description: RichTextInput
  excerpt: RichTextInput
  media: [CollectionMediaInput!]
  seo: SeoInput
  defaultSort: ProductSortBy
  defaultSortDirection: SortDirection
  activeFrom: DateTime
  activeTo: DateTime
  publish: Boolean
}

input CollectionUpdateInput {
  clientMutationId: String!
  id: ID!
  expectedRevision: Int!
  handle: String
  name: String
  description: RichTextInput
  excerpt: RichTextInput
  media: [CollectionMediaInput!]
  seo: SeoInput
  defaultSort: ProductSortBy
  defaultSortDirection: SortDirection
  activeFrom: DateTime
  activeTo: DateTime
  publish: Boolean
}

input CollectionMediaInput {
  fileId: ID!
  sortIndex: Int
}

input CollectionDeleteInput {
  clientMutationId: String!
  id: ID!
  expectedRevision: Int!
}

input CollectionAddProductsInput {
  clientMutationId: String!
  collectionId: ID!
  expectedRevision: Int!
  productIds: [ID!]!
}

input CollectionRemoveProductsInput {
  clientMutationId: String!
  collectionId: ID!
  expectedRevision: Int!
  productIds: [ID!]!
}

input CollectionMoveProductInput {
  clientMutationId: String!
  collectionId: ID!
  expectedRevision: Int!
  productId: ID!
  afterProductId: ID
  beforeProductId: ID
}

input CollectionUpdateRulesInput {
  clientMutationId: String!
  collectionId: ID!
  expectedRevision: Int!
  rules: [CollectionRuleInput!]!
}

input CollectionRulesPreviewCountInput {
  rules: [CollectionRuleInput!]!
}

input CollectionRebalanceInput {
  clientMutationId: String!
  collectionId: ID!
  expectedRevision: Int!
}

input CollectionClearProductsInput {
  clientMutationId: String!
  collectionId: ID!
  expectedRevision: Int!
}

type CollectionCreatePayload {
  collection: Collection
  userErrors: [GenericUserError!]!
}

type CollectionUpdatePayload {
  collection: Collection
  userErrors: [GenericUserError!]!
}

type CollectionDeletePayload {
  deletedCollectionId: ID
  userErrors: [GenericUserError!]!
}

type CollectionAddProductsPayload {
  collection: Collection
  userErrors: [GenericUserError!]!
}

type CollectionRemoveProductsPayload {
  collection: Collection
  userErrors: [GenericUserError!]!
}

type CollectionMoveProductPayload {
  collection: Collection
  userErrors: [GenericUserError!]!
}

type CollectionUpdateRulesPayload {
  collection: Collection
  userErrors: [GenericUserError!]!
}

type CollectionRebalancePayload {
  collection: Collection
  userErrors: [GenericUserError!]!
}

type CollectionClearProductsPayload {
  collection: Collection
  userErrors: [GenericUserError!]!
}

type CollectionRulesPreviewCountPayload {
  count: Int
  rulesHash: String
  indexObservedAt: DateTime
  userErrors: [GenericUserError!]!
}
