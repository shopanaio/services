# A media resource owned by the Media subgraph. Concrete image, video,
# external-video, and 3D-model fields are selected through inline fragments on
# the concrete Media implementations.
extend interface Media {
  id: ID!
}

# Concrete entity stubs make Media a resolvable abstract return type inside the
# Catalog subgraph while the Media subgraph remains the owner of all fields.
extend type MediaImage implements Media @key(fields: "id") {
  id: ID! @external
}

extend type Video implements Media @key(fields: "id") {
  id: ID! @external
}

extend type ExternalVideo implements Media @key(fields: "id") {
  id: ID! @external
}

extend type Model3d implements Media @key(fields: "id") {
  id: ID! @external
}

"""An ordered media item registered on a product."""
type ProductMediaEdge {
  cursor: Cursor!
  node: Media!
}

"""A Relay connection to the media registered on a product."""
type ProductMediaConnection implements Connection {
  edges: [ProductMediaEdge!]!
  nodes: [Media!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"""An ordered media item registered on a category."""
type CategoryMediaEdge {
  cursor: Cursor!
  node: Media!
}

"""A Relay connection to the media registered on a category."""
type CategoryMediaConnection implements Connection {
  edges: [CategoryMediaEdge!]!
  nodes: [Media!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"""An ordered media item selected for a particular product variant."""
type ProductVariantMediaEdge {
  cursor: Cursor!
  node: Media!
}

"""A Relay connection to media selected for a particular product variant."""
type ProductVariantMediaConnection implements Connection {
  edges: [ProductVariantMediaEdge!]!
  nodes: [Media!]!
  pageInfo: PageInfo!
  totalCount: Int!
}
