"""A published item offered for sale in the storefront catalog."""
type Product implements Node @key(fields: "id") {
  id: ID!
  handle: String!
  title: String!
  description: RichText
  excerpt: RichText
  seo: SEO!
  vendor: Vendor
  tags: [Tag!]!
  primaryCategory: Category
  categories(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
  ): CategoryConnection!
  options: [ProductOption!]!
  features: [ProductFeature!]!
  featureGroups: [ProductFeatureGroup!]!
  """
  Fully prepared comparison for this product in the current storefront context.

  Catalog selects every product and concrete variant available for comparison,
  applies the server-defined order and limit, and resolves the complete matrix.
  The storefront provides no comparison inputs and only renders the result.
  """
  comparison: ProductComparison
  media(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
  ): ProductMediaConnection!
  featuredMedia: Media
  variants(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
  ): ProductVariantConnection!
  variantBySelectedOptions(
    selectedOptions: [SelectedOptionInput!]!
  ): ProductVariant
  selectedOrFirstAvailableVariant(
    selectedOptions: [SelectedOptionInput!]
  ): ProductVariant
  priceRange: ProductPriceRange
  compareAtPriceRange: ProductPriceRange
  availableForSale: Boolean!
  totalInventory: Int
  publishedAt: DateTime!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""A purchasable combination of product option values."""
type ProductVariant implements Node @key(fields: "id") {
  id: ID!
  product: Product!
  handle: String!
  title: String!
  sku: String
  isDefault: Boolean!
  selectedOptions: [SelectedOption!]!
  price: Money
  compareAtPrice: Money
  availableForSale: Boolean!
  currentlyNotInStock: Boolean!
  quantityAvailable: Int
  inventoryItem: InventoryItem
  requiresShipping: Boolean!
  weight: Weight
  dimensions: Dimensions
  media(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
  ): ProductVariantMediaConnection!
  featuredMedia: Media
  componentConfiguration(
    """
    Complete current component selection.

    When omitted, merchant-defined default selections are applied. An explicit
    empty list means that no items are selected. Catalog evaluates dependency
    rules and returns a presentation-ready configuration for this state.
    """
    selections: [ProductComponentSelectionInput!]
  ): ProductComponentConfiguration
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""A configurable product dimension such as size, color, or material."""
type ProductOption implements Node @key(fields: "id") {
  id: ID!
  handle: String!
  name: String!
  category: ProductOptionCategory!
  position: Int!
  optionValues: [ProductOptionValue!]!
}

"""A reusable product option category."""
type ProductOptionCategory implements Node @key(fields: "id") {
  id: ID!
  name: String!
  handle: String!
}

"""One customer-selectable value of a product option."""
type ProductOptionValue implements Node @key(fields: "id") {
  id: ID!
  handle: String!
  name: String!
  position: Int!
  swatch: ProductOptionValueSwatch
}

"""The visual representation used for an option value."""
enum ProductOptionSwatchType {
  COLOR
  GRADIENT
  IMAGE
}

type ProductOptionValueSwatch {
  type: ProductOptionSwatchType!
  color: Color
  secondaryColor: Color
  image: Media
  metadata: JSON
}

"""A resolved option/value pair selected by a product variant."""
type SelectedOption {
  option: ProductOption!
  optionValue: ProductOptionValue!
  name: String!
  value: String!
}

"""Stable option and value handles used to resolve a product variant."""
input SelectedOptionInput {
  option: String!
  value: String!
}

"""The lowest and highest current variant prices for a product."""
type ProductPriceRange {
  minVariantPrice: Money!
  maxVariantPrice: Money!
}

"""A Relay connection to product variants."""
type ProductVariantConnection implements Connection {
  edges: [ProductVariantEdge!]!
  nodes: [ProductVariant!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ProductVariantEdge {
  cursor: Cursor!
  node: ProductVariant!
}
