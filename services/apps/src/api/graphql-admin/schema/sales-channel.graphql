enum SalesChannelConnectionStatus {
  DRAFT CONNECTING ACTIVE CONNECT_FAILED UPDATING UPDATE_FAILED
  SUSPENDING SUSPENDED RESUMING DISCONNECTING DISCONNECTED DISCONNECT_FAILED
}

enum SalesChannelHealthStatus { UNKNOWN HEALTHY DEGRADED UNHEALTHY }
enum SalesChannelOperationType { CONNECT UPDATE SUSPEND RESUME DISCONNECT }

type SalesChannelSpecification implements Node @key(fields: "id") {
  id: ID!
  appCode: String!
  appVersion: String!
  handle: String!
  label: String!
  definition: JSON!
  createdAt: DateTime!
}

type SalesChannelSpecificationDefinition {
  id: ID
  handle: String!
  label: String!
  allowMultipleConnections: Boolean!
  requiresExternalAccount: Boolean!
  definition: JSON!
}

type SalesChannelConnection implements Node @key(fields: "id") {
  id: ID!
  installation: AppInstallation!
  specification: SalesChannelSpecification!
  displayName: String!
  externalAccountId: String
  externalAccountLabel: String
  status: SalesChannelConnectionStatus!
  effectiveActive: Boolean!
  configuration: JSON!
  configurationVersion: Int!
  healthStatus: SalesChannelHealthStatus!
  lastError: AppInstallationError
  createdAt: DateTime!
  updatedAt: DateTime!
  connectedAt: DateTime
  suspendedAt: DateTime
  disconnectedAt: DateTime
}

type SalesChannelOperation implements Node @key(fields: "id") {
  id: ID!
  connection: SalesChannelConnection!
  type: SalesChannelOperationType!
  status: AppLifecycleOperationStatus!
  workflowId: String!
  error: AppLifecycleOperationError
  startedAt: DateTime
  completedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SalesChannelConnectionConnection {
  edges: [SalesChannelConnectionEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type SalesChannelConnectionEdge {
  node: SalesChannelConnection!
  cursor: String!
}

extend type AppsQuery {
  salesChannelSpecification(id: ID!): SalesChannelSpecification
  salesChannelConnection(id: ID!): SalesChannelConnection
  salesChannelConnections(
    first: Int
    after: String
    last: Int
    before: String
  ): SalesChannelConnectionConnection!
}

extend type AppDefinition {
  salesChannelSpecifications: [SalesChannelSpecificationDefinition!]!
}

extend type AppInstallation {
  salesChannelConnections(
    first: Int
    after: String
    last: Int
    before: String
  ): SalesChannelConnectionConnection!
}

extend type AppsMutation {
  salesChannelConnectionCreate(
    input: SalesChannelConnectionCreateInput!
  ): SalesChannelLifecyclePayload!
  salesChannelConnectionUpdate(
    input: SalesChannelConnectionUpdateInput!
  ): SalesChannelLifecyclePayload!
  salesChannelConnectionSuspend(
    input: SalesChannelConnectionActionInput!
  ): SalesChannelLifecyclePayload!
  salesChannelConnectionResume(
    input: SalesChannelConnectionActionInput!
  ): SalesChannelLifecyclePayload!
  salesChannelConnectionDisconnect(
    input: SalesChannelConnectionActionInput!
  ): SalesChannelLifecyclePayload!
}

input SalesChannelConnectionCreateInput {
  installationId: ID!
  specificationId: ID!
  displayName: String!
  configuration: JSON
  clientMutationId: String!
}

input SalesChannelConnectionUpdateInput {
  connectionId: ID!
  displayName: String
  configuration: JSON!
  expectedConfigurationVersion: Int!
  targetSpecificationId: ID
  clientMutationId: String!
}

input SalesChannelConnectionActionInput {
  connectionId: ID!
  clientMutationId: String!
}

type SalesChannelLifecyclePayload {
  connection: SalesChannelConnection
  operation: SalesChannelOperation
  duplicate: Boolean!
  userErrors: [GenericUserError!]!
}
