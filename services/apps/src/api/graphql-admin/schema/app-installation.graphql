"""
Lifecycle state of an App installation.
"""
enum AppInstallationStatus {
  PENDING_CONSENT
  INSTALLING
  ACTIVE
  INSTALL_FAILED
  SUSPENDING
  SUSPENDED
  RESUMING
  UPDATING
  UPDATE_FAILED
  UNINSTALLING
  UNINSTALLED
  UNINSTALL_FAILED
}

"""
Persisted health state of an App installation.
"""
enum AppInstallationHealthStatus {
  UNKNOWN
  HEALTHY
  DEGRADED
  UNHEALTHY
}

"""
State of a capability route owned by an installation.
"""
enum AppCapabilityBindingStatus {
  ACTIVE
  INACTIVE
  MAINTENANCE
  DEPRECATED
}

"""
State of the route assignment used to resolve a capability.
"""
enum AppCapabilityAssignmentStatus {
  ACTIVE
  DISABLED
}

"""
A permission grant recorded for an App installation.
"""
type AppInstallationScope {
  scope: String!
  grantedAt: DateTime!
  revokedAt: DateTime
  granted: Boolean!
}

"""
A concrete capability route contributed by an installed App.
"""
type AppCapabilityBinding implements Node @key(fields: "id") {
  id: ID!
  capability: String!
  assignmentMode: AppCapabilityAssignmentMode!
  operation: String!
  targetAppCode: String!
  targetAction: String!
  status: AppCapabilityBindingStatus!
  precedence: Int
  assignmentStatus: AppCapabilityAssignmentStatus
}

"""
The latest persisted App installation failure.
"""
type AppInstallationError {
  code: String!
  message: String!
}

"""
A bundled App installed in the current store.
"""
type AppInstallation implements Node @key(fields: "id") {
  id: ID!
  appCode: String!
  status: AppInstallationStatus!
  installedVersion: String
  targetVersion: String
  manifestHash: String
  configuration: JSON!
  healthStatus: AppInstallationHealthStatus!
  lastError: AppInstallationError
  installedByUserId: ID
  scopes: [AppInstallationScope!]!
  capabilities: [AppCapabilityBinding!]!
  lifecycleOperations(
    first: Int
    after: String
    last: Int
    before: String
  ): AppLifecycleOperationConnection!
  manifestSnapshots(
    first: Int
    after: String
    last: Int
    before: String
  ): AppManifestSnapshotConnection!
  installedAt: DateTime
  suspendedAt: DateTime
  uninstalledAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
A write-only secret supplied during install or update.
"""
input AppSecretInput {
  name: String!
  value: String!
}

"""
Input for creating an App installation in the current store.
"""
input AppInstallationCreateInput {
  appCode: String!
  configuration: JSON
  grantedScopes: [String!]
  secrets: [AppSecretInput!]
}

"""
Root configuration operation for an existing App installation.
"""
input AppInstallationConfigurationUpdateInput {
  configuration: JSON!
}

"""
Complete replacement of the scope links owned by an App installation.
"""
input AppInstallationScopesReplaceInput {
  grantedScopes: [String!]!
}

enum AppInstallationSecretOperationAction {
  SET
}

"""
Operation for setting or rotating one write-only App installation secret.
"""
input AppInstallationSecretOperationInput {
  action: AppInstallationSecretOperationAction!
  name: String!
  value: String!
}

"""
Lifecycle action applied to an existing App installation.

Deletion is intentionally absent: aggregate deletion is exposed only through
appInstallationDelete.
"""
enum AppInstallationLifecycleOperationAction {
  UPGRADE
  SUSPEND
  RESUME
}

input AppInstallationLifecycleOperationInput {
  action: AppInstallationLifecycleOperationAction!
}

"""
All operations that can be applied to an existing App installation.

At least one field must be supplied. Empty operation arrays and an input object without a supplied
operation are rejected during request validation before the workflow is started.

operationResults use the canonical group order declared below: configuration, lifecycle, scopes,
then secrets. The order of secrets is preserved within its group.
"""
input AppInstallationUpdateInput {
  configuration: AppInstallationConfigurationUpdateInput
  lifecycle: AppInstallationLifecycleOperationInput
  scopes: AppInstallationScopesReplaceInput
  secrets: [AppInstallationSecretOperationInput!]
}

"""
Stable type of an App installation update operation result.
"""
enum AppInstallationOperationType {
  CONFIGURATION_UPDATE
  VERSION_UPGRADE
  STATUS_SUSPEND
  STATUS_RESUME
  SCOPES_REPLACE
  SECRET_SET
}

"""
Result of one public App installation update operation.
"""
type AppInstallationOperationResult {
  type: AppInstallationOperationType!
  applied: Boolean!
  entityId: ID
  errors: [GenericUserError!]!
}

"""
Payload returned after creating an App installation.
"""
type AppInstallationCreatePayload {
  appInstallation: AppInstallation
  """
  Lifecycle operation accepted while creating the installation.
  """
  operation: AppLifecycleOperation
  userErrors: [GenericUserError!]!
}

"""
Payload returned after applying ordered operations to an App installation.
"""
type AppInstallationUpdatePayload {
  appInstallation: AppInstallation
  operationResults: [AppInstallationOperationResult!]!
  """
  Lifecycle operation accepted by an UPGRADE, SUSPEND, or RESUME operation, when present.
  """
  operation: AppLifecycleOperation
  userErrors: [GenericUserError!]!
}

"""
Payload returned after deleting an App installation.
"""
type AppInstallationDeletePayload {
  deletedAppInstallationId: ID
  """
  Lifecycle operation accepted while deleting the installation.
  """
  operation: AppLifecycleOperation
  userErrors: [GenericUserError!]!
}
