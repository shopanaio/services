extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: [
      "@key"
      "@requires"
      "@provides"
      "@external"
      "@shareable"
      "@override"
      "@inaccessible"
    ]
  )

extend type Query {
  """
  Apps control-plane queries for the current store.
  """
  appsQuery: AppsQuery!
}

extend type Mutation {
  """
  Apps control-plane mutations for the current store.
  """
  appsMutation: AppsMutation!
}

type AppsQuery {
  """
  Resolve an Apps-owned Relay node by its global ID.
  """
  node(id: ID!): Node

  """
  Resolve Apps-owned Relay nodes while preserving input order.
  """
  nodes(ids: [ID!]!): [Node]!

  """
  Get a bundled App definition by its stable code.
  """
  appDefinition(code: String!): AppDefinition

  """
  List bundled Apps and their installation state for the current store.
  """
  apps(
    first: Int
    after: String
    last: Int
    before: String
    where: AppWhereInput
    orderBy: [AppOrderByInput!]
  ): AppConnection!

  """
  Get an App installation by its global ID.
  """
  appInstallation(id: ID!): AppInstallation

  """
  Get a lifecycle operation by its global ID.
  """
  appLifecycleOperation(id: ID!): AppLifecycleOperation
}

type AppsMutation {
  """
  Create an App installation in the current store.
  """
  appInstallationCreate(input: AppInstallationCreateInput!): AppInstallationCreatePayload!

  """
  Apply an ordered set of operations to an existing App installation.
  """
  appInstallationUpdate(
    appInstallationId: ID!
    operations: AppInstallationUpdateInput!
  ): AppInstallationUpdatePayload!

  """
  Delete an App installation from the current store.

  The current domain implementation may perform this as a soft delete, but it remains a distinct
  aggregate delete command and is not an AppInstallationUpdate operation.
  """
  appInstallationDelete(appInstallationId: ID!): AppInstallationDeletePayload!
}
