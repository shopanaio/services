extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: ["@key", "@shareable", "@inaccessible"]
  )

scalar DateTime
scalar JSON

type Query {
  notificationsQuery: NotificationsQuery!
}

type Mutation {
  notificationsMutation: NotificationsMutation!
}

type NotificationsQuery {
  definitions: [NotificationDefinition!]!
  channelSettings(key: String!): [NotificationChannelSetting!]!
  template(
    key: String!
    channel: NotificationChannel!
    locale: LocaleCode!
  ): NotificationEffectiveTemplate!
  staffRecipients: [StaffNotificationRecipient!]!
  webhookCapabilities: NotificationWebhookCapabilities!
  webhookSubscriptions: [NotificationWebhookSubscription!]!
}

type NotificationsMutation {
  notificationConfigurationUpdate(
    operations: NotificationConfigurationUpdateInput!
  ): NotificationConfigurationUpdatePayload!
  notificationPreview(input: NotificationPreviewInput!): NotificationPreviewPayload!
  notificationSendTest(input: NotificationTestMessageInput!): NotificationSendTestPayload!
  notificationWebhookSecretReveal: NotificationWebhookSecretPayload!
}

interface UserError {
  message: String!
  field: [String!]
  code: String
}

type GenericUserError implements UserError @shareable {
  message: String!
  field: [String!]
  code: String
}

enum NotificationChannel {
  EMAIL
  SMS
  WEBHOOK
}

enum NotificationAudience {
  CUSTOMER
  STAFF
}

enum NotificationWebhookFormat {
  JSON
  XML
}

enum NotificationWebhookStatus {
  ACTIVE
  DISABLED
}

type NotificationDefinition {
  key: String!
  title: String!
  audience: NotificationAudience!
  optional: Boolean!
  enabled: Boolean!
  allowedChannels: [NotificationChannel!]!
  defaultChannels: [NotificationChannel!]!
  activeChannels: [NotificationChannel!]!
  variables: [NotificationTemplateVariable!]!
}

type NotificationTemplateVariable {
  path: String!
  type: String!
  required: Boolean!
  description: String!
  children: [NotificationTemplateVariable!]
}

type NotificationDefinitionSetting {
  definitionKey: String!
  enabled: Boolean!
  updatedAt: DateTime!
}

input NotificationDefinitionSetEnabledInput {
  key: String!
  enabled: Boolean!
}

input NotificationConfigurationUpdateInput {
  definitions: [NotificationDefinitionOperationInput!]
  channels: [NotificationChannelOperationInput!]
  templates: [NotificationTemplateOperationInput!]
  staffRecipients: [StaffNotificationRecipientOperationInput!]
  webhooks: [NotificationWebhookOperationInput!]
}

input NotificationDefinitionOperationInput {
  key: String!
  enabled: Boolean!
}

input NotificationChannelOperationInput {
  values: NotificationChannelSettingInput!
}

input NotificationTemplateOperationInput {
  values: NotificationTemplateUpdateInput!
}

enum StaffNotificationRecipientOperationAction {
  CREATE
  UPDATE
  DELETE
}

input StaffNotificationRecipientOperationInput {
  action: StaffNotificationRecipientOperationAction!
  recipientId: ID
  values: StaffNotificationRecipientInput
}

enum NotificationWebhookOperationAction {
  CREATE
  UPDATE
  DELETE
}

input NotificationWebhookOperationInput {
  action: NotificationWebhookOperationAction!
  webhookId: ID
  create: NotificationWebhookCreateInput
  update: NotificationWebhookValuesInput
}

enum NotificationConfigurationOperationType {
  DEFINITION
  CHANNEL
  TEMPLATE
  STAFF_RECIPIENT
  WEBHOOK
}

type NotificationConfigurationOperationResult {
  type: NotificationConfigurationOperationType!
  applied: Boolean!
  entityId: ID
  definitionSetting: NotificationDefinitionSetting
  channelSetting: NotificationChannelSetting
  template: NotificationEffectiveTemplate
  staffRecipient: StaffNotificationRecipient
  webhook: NotificationWebhookSubscription
  errors: [GenericUserError!]!
}

type NotificationConfigurationUpdatePayload {
  operationResults: [NotificationConfigurationOperationResult!]!
  userErrors: [GenericUserError!]!
}

type NotificationDefinitionSetEnabledPayload {
  setting: NotificationDefinitionSetting
  userErrors: [GenericUserError!]!
}

input NotificationChannelSettingInput {
  key: String!
  channel: NotificationChannel!
  enabled: Boolean!
  senderName: String
  senderEmail: String
  replyTo: String
}

type NotificationChannelSetEnabledPayload {
  setting: NotificationChannelSetting
  userErrors: [GenericUserError!]!
}

type NotificationChannelSetting {
  definitionKey: String!
  channel: NotificationChannel!
  enabled: Boolean!
  senderName: String
  senderEmail: String
  replyTo: String
  updatedAt: DateTime
}

input NotificationTemplateUpdateInput {
  key: String!
  channel: NotificationChannel!
  locale: LocaleCode!
  subjectTemplate: String
  bodyTemplate: String!
  plainTextTemplate: String
}

type NotificationTemplateUpdatePayload {
  template: NotificationEffectiveTemplate
  userErrors: [GenericUserError!]!
}

type NotificationEffectiveTemplate {
  key: String!
  channel: NotificationChannel!
  locale: LocaleCode!
  source: String!
  subjectTemplate: String
  bodyTemplate: String!
  plainTextTemplate: String
  revisionId: ID
  revision: Int
  sourceVersion: String
}

input NotificationPreviewInput {
  key: String!
  channel: NotificationChannel!
  locale: LocaleCode
  data: JSON!
  subjectTemplate: String
  bodyTemplate: String
  plainTextTemplate: String
}

type NotificationPreviewPayload {
  preview: NotificationPreview
  userErrors: [GenericUserError!]!
}

type NotificationPreview {
  subject: String
  html: String
  text: String!
  locale: LocaleCode!
  warnings: [String!]!
  sms: NotificationSmsMetrics
}

type NotificationSmsMetrics {
  encoding: String!
  segmentCount: Int!
  length: Int!
}

input StaffNotificationRecipientInput {
  userId: ID
  name: String!
  email: String!
  locale: LocaleCode!
  timezone: String!
  enabled: Boolean!
  eventKeys: [String!]!
}

input StaffRecipientDeleteInput {
  id: ID!
}

type StaffRecipientUpsertPayload {
  recipient: StaffNotificationRecipient
  userErrors: [GenericUserError!]!
}

type StaffRecipientDeletePayload {
  deletedStaffRecipientId: ID
  userErrors: [GenericUserError!]!
}

type StaffNotificationRecipient {
  id: ID!
  userId: ID
  name: String!
  email: String!
  locale: LocaleCode!
  timezone: String!
  scope: String!
  enabled: Boolean!
  eventKeys: [String!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type NotificationSendTestPayload {
  workflow: NotificationWorkflowPayload
  userErrors: [GenericUserError!]!
}

input NotificationTestMessageInput {
  channel: NotificationChannel!
  key: String!
  recipientId: ID
  customerId: ID
  userId: ID
  email: String
  phone: String
  name: String
  locale: LocaleCode
  data: JSON!
}

input NotificationWebhookCreateInput {
  eventType: String!
  format: NotificationWebhookFormat!
  url: String!
  apiVersion: String!
}

enum NotificationWebhookApiStability {
  UNSTABLE
  STABLE
  DEPRECATED
}

type NotificationWebhookCapabilities {
  events: [NotificationWebhookEvent!]!
  apiVersions: [NotificationWebhookApiVersion!]!
}

type NotificationWebhookEvent {
  eventType: String!
  title: String!
}

type NotificationWebhookApiVersion {
  version: String!
  stability: NotificationWebhookApiStability!
  isDefault: Boolean!
}

input NotificationWebhookUpdateInput {
  id: ID!
  eventType: String
  format: NotificationWebhookFormat
  url: String
  apiVersion: String
  status: NotificationWebhookStatus
}

input NotificationWebhookValuesInput {
  eventType: String
  format: NotificationWebhookFormat
  url: String
  apiVersion: String
  status: NotificationWebhookStatus
}

input NotificationWebhookDeleteInput {
  id: ID!
}

type NotificationWebhookCreatePayload {
  webhook: NotificationWebhookSubscription
  userErrors: [GenericUserError!]!
}

type NotificationWebhookUpdatePayload {
  webhook: NotificationWebhookSubscription
  userErrors: [GenericUserError!]!
}

type NotificationWebhookDeletePayload {
  deletedWebhookId: ID
  userErrors: [GenericUserError!]!
}

type NotificationWebhookSubscription {
  id: ID!
  eventType: String!
  format: NotificationWebhookFormat!
  url: String!
  apiVersion: String!
  status: NotificationWebhookStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type NotificationWebhookSecretPayload {
  secret: String
  userErrors: [GenericUserError!]!
}

type NotificationWorkflowPayload {
  workflowId: String!
  accepted: Boolean!
}
