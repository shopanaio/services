extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: ["@key", "@shareable", "@inaccessible"]
  )

scalar DateTime
scalar JSON

type Query {
  notificationsQuery: NotificationsQuery!
}

type Mutation {
  notificationsMutation: NotificationsMutation!
}

type NotificationsQuery {
  definitions: [NotificationDefinition!]!
  channelSettings(key: String!): [NotificationChannelSetting!]!
  template(
    key: String!
    channel: NotificationChannel!
    locale: String!
  ): NotificationEffectiveTemplate!
  staffRecipients: [StaffNotificationRecipient!]!
  providerRoutes: [NotificationProviderRoute!]!
  providerConfiguration(channel: NotificationChannel!): NotificationProviderMaskedConfiguration!
  webhookCapabilities: NotificationWebhookCapabilities!
  webhookSubscriptions: [NotificationWebhookSubscription!]!
}

type NotificationsMutation {
  setDefinitionEnabled(input: NotificationDefinitionSetEnabledInput!): NotificationDefinitionSetEnabledPayload!
  setChannelEnabled(input: NotificationChannelSettingInput!): NotificationChannelSetEnabledPayload!
  updateTemplate(input: NotificationTemplateUpdateInput!): NotificationTemplateUpdatePayload!
  preview(input: NotificationPreviewInput!): NotificationPreviewPayload!
  upsertStaffRecipient(input: StaffNotificationRecipientInput!): StaffRecipientUpsertPayload!
  deleteStaffRecipient(input: StaffRecipientDeleteInput!): StaffRecipientDeletePayload!
  configureProvider(input: NotificationProviderConfigurationInput!): NotificationProviderConfigurePayload!
  testProvider(input: NotificationProviderTestInput!): NotificationProviderTestPayload!
  sendTest(input: NotificationTestMessageInput!): NotificationSendTestPayload!
  createWebhook(input: NotificationWebhookCreateInput!): NotificationWebhookCreatePayload!
  updateWebhook(input: NotificationWebhookUpdateInput!): NotificationWebhookUpdatePayload!
  deleteWebhook(input: NotificationWebhookDeleteInput!): NotificationWebhookDeletePayload!
  revealWebhookSecret: NotificationWebhookSecretPayload!
}

interface UserError {
  message: String!
  field: [String!]
  code: String
}

type GenericUserError implements UserError @shareable {
  message: String!
  field: [String!]
  code: String
}

enum NotificationChannel {
  EMAIL
  SMS
  WEBHOOK
}

enum NotificationAudience {
  CUSTOMER
  STAFF
}

enum NotificationWebhookFormat {
  JSON
  XML
}

enum NotificationWebhookStatus {
  ACTIVE
  DISABLED
}

type NotificationDefinition {
  key: String!
  title: String!
  audience: NotificationAudience!
  optional: Boolean!
  enabled: Boolean!
  allowedChannels: [NotificationChannel!]!
  defaultChannels: [NotificationChannel!]!
  activeChannels: [NotificationChannel!]!
  variables: [NotificationTemplateVariable!]!
  version: Int!
}

type NotificationTemplateVariable {
  path: String!
  type: String!
  required: Boolean!
  description: String!
  children: [NotificationTemplateVariable!]
}

type NotificationDefinitionSetting {
  definitionKey: String!
  enabled: Boolean!
  version: Int!
  updatedAt: DateTime!
}

input NotificationDefinitionSetEnabledInput {
  key: String!
  enabled: Boolean!
  expectedVersion: Int!
}

type NotificationDefinitionSetEnabledPayload {
  setting: NotificationDefinitionSetting
  userErrors: [GenericUserError!]!
}

input NotificationChannelSettingInput {
  key: String!
  channel: NotificationChannel!
  enabled: Boolean!
  expectedVersion: Int!
  senderName: String
  senderEmail: String
  replyTo: String
}

type NotificationChannelSetEnabledPayload {
  setting: NotificationChannelSetting
  userErrors: [GenericUserError!]!
}

type NotificationChannelSetting {
  definitionKey: String!
  channel: NotificationChannel!
  enabled: Boolean!
  senderName: String
  senderEmail: String
  replyTo: String
  version: Int!
  updatedAt: DateTime
}

input NotificationTemplateUpdateInput {
  key: String!
  channel: NotificationChannel!
  locale: String!
  subjectTemplate: String
  bodyTemplate: String!
  plainTextTemplate: String
  expectedVersion: Int!
}

type NotificationTemplateUpdatePayload {
  template: NotificationEffectiveTemplate
  userErrors: [GenericUserError!]!
}

type NotificationEffectiveTemplate {
  key: String!
  channel: NotificationChannel!
  locale: String!
  source: String!
  subjectTemplate: String
  bodyTemplate: String!
  plainTextTemplate: String
  revisionId: ID
  revision: Int
  pointerVersion: Int
  sourceVersion: String
}

input NotificationPreviewInput {
  key: String!
  channel: NotificationChannel!
  locale: String
  data: JSON!
  subjectTemplate: String
  bodyTemplate: String
  plainTextTemplate: String
}

type NotificationPreviewPayload {
  preview: NotificationPreview
  userErrors: [GenericUserError!]!
}

type NotificationPreview {
  subject: String
  html: String
  text: String!
  locale: String!
  warnings: [String!]!
  sms: NotificationSmsMetrics
}

type NotificationSmsMetrics {
  encoding: String!
  segmentCount: Int!
  length: Int!
}

input StaffNotificationRecipientInput {
  id: ID
  userId: ID
  name: String!
  email: String!
  locale: String!
  timezone: String!
  enabled: Boolean!
  eventKeys: [String!]!
}

input StaffRecipientDeleteInput {
  id: ID!
}

type StaffRecipientUpsertPayload {
  recipient: StaffNotificationRecipient
  userErrors: [GenericUserError!]!
}

type StaffRecipientDeletePayload {
  deletedStaffRecipientId: ID
  userErrors: [GenericUserError!]!
}

type StaffNotificationRecipient {
  id: ID!
  userId: ID
  name: String!
  email: String!
  locale: String!
  timezone: String!
  scope: String!
  enabled: Boolean!
  eventKeys: [String!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type NotificationProviderRoute {
  channel: NotificationChannel!
  configured: Boolean!
  providerCode: String
  slotId: ID
  assignmentId: ID
  status: String
}

input NotificationProviderConfigurationInput {
  providerCode: String!
  channel: NotificationChannel!
  config: JSON!
  secretFields: JSON
  active: Boolean = true
}

input NotificationProviderTestInput {
  channel: NotificationChannel!
  recipient: String
}

type NotificationProviderConfigurePayload {
  configuration: NotificationProviderConfiguration
  userErrors: [GenericUserError!]!
}

type NotificationProviderTestPayload {
  testResult: NotificationProviderTestResult
  userErrors: [GenericUserError!]!
}

type NotificationSendTestPayload {
  workflow: NotificationWorkflowPayload
  userErrors: [GenericUserError!]!
}

type NotificationProviderConfiguration {
  providerCode: String!
  channel: NotificationChannel!
  slotId: ID!
  assignmentId: ID!
  maskedConfig: JSON!
}

type NotificationProviderMaskedConfiguration {
  providerCode: String!
  channel: NotificationChannel!
  status: String!
  config: JSON!
}

type NotificationProviderTestResult {
  ok: Boolean!
  providerCode: String!
  message: String
}

input NotificationTestMessageInput {
  channel: NotificationChannel!
  key: String!
  recipientId: ID
  customerId: ID
  userId: ID
  email: String
  phone: String
  name: String
  locale: String
  data: JSON!
  idempotencyKey: String!
}

input NotificationWebhookCreateInput {
  eventType: String!
  format: NotificationWebhookFormat!
  url: String!
  apiVersion: String!
}

enum NotificationWebhookApiStability {
  UNSTABLE
  STABLE
  DEPRECATED
}

type NotificationWebhookCapabilities {
  events: [NotificationWebhookEvent!]!
  apiVersions: [NotificationWebhookApiVersion!]!
}

type NotificationWebhookEvent {
  eventType: String!
  title: String!
}

type NotificationWebhookApiVersion {
  version: String!
  stability: NotificationWebhookApiStability!
  isDefault: Boolean!
}

input NotificationWebhookUpdateInput {
  id: ID!
  eventType: String
  format: NotificationWebhookFormat
  url: String
  apiVersion: String
  status: NotificationWebhookStatus
  expectedVersion: Int!
}

input NotificationWebhookDeleteInput {
  id: ID!
}

type NotificationWebhookCreatePayload {
  webhook: NotificationWebhookSubscription
  userErrors: [GenericUserError!]!
}

type NotificationWebhookUpdatePayload {
  webhook: NotificationWebhookSubscription
  userErrors: [GenericUserError!]!
}

type NotificationWebhookDeletePayload {
  deletedWebhookId: ID
  userErrors: [GenericUserError!]!
}

type NotificationWebhookSubscription {
  id: ID!
  eventType: String!
  format: NotificationWebhookFormat!
  url: String!
  apiVersion: String!
  status: NotificationWebhookStatus!
  version: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type NotificationWebhookSecretPayload {
  secret: String
  userErrors: [GenericUserError!]!
}

type NotificationWorkflowPayload {
  workflowId: String!
  accepted: Boolean!
}
