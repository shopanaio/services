extend type Product @key(fields: "id") {
  id: ID! @external

  """Published reviews for this product."""
  reviews(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
    rating: Int
    verifiedOnly: Boolean = false
    withMediaOnly: Boolean = false
  ): ReviewConnection!

  """Published review aggregates for this product."""
  reviewSummary: ProductReviewSummary!

  """Rating criteria applicable to this product in display order."""
  reviewRatingCriteria(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
  ): ReviewRatingCriterionConnection!

  """Published questions for this product."""
  questions(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
    answered: Boolean
  ): ProductQuestionConnection!

  """Published question and answer aggregates for this product."""
  questionSummary: ProductQuestionSummary!
}

extend type ProductVariant @key(fields: "id") {
  id: ID! @external

  reviews(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
  ): ReviewConnection!

  questions(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
  ): ProductQuestionConnection!
}

extend type Category @key(fields: "id", resolvable: false) {
  id: ID! @external
}

extend type Customer @key(fields: "id") {
  id: ID! @external

  reviews(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
  ): ReviewConnection!

  productQuestions(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
  ): ProductQuestionConnection!

  reviewRequests(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
  ): ReviewRequestConnection!
}

extend type File @key(fields: "id", resolvable: false) {
  id: ID! @external
}
