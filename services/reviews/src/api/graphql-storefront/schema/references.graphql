extend type Product @key(fields: "id") {
  id: ID! @external

  """
  Published reviews for this product.
  """
  reviews(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
    rating: Int
    verifiedOnly: Boolean = false
    withMediaOnly: Boolean = false
    sort: ReviewSort = NEWEST
  ): ReviewConnection!

  """
  Published review aggregates for this product.
  """
  reviewSummary: ProductReviewSummary!

  """
  Rating criteria applicable to this product in display order.
  """
  reviewRatingCriteria(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
  ): ReviewRatingCriterionConnection!

  """
  Published questions for this product.
  """
  questions(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
    answered: Boolean
    sort: ProductQuestionSort = NEWEST
  ): ProductQuestionConnection!

  """
  Published question and answer aggregates for this product.
  """
  questionSummary: ProductQuestionSummary!
}

extend type ProductVariant @key(fields: "id") {
  id: ID! @external

  reviews(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
    sort: ReviewSort = NEWEST
  ): ReviewConnection!

  questions(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
    sort: ProductQuestionSort = NEWEST
  ): ProductQuestionConnection!
}

extend type Category @key(fields: "id", resolvable: false) {
  id: ID! @external
}

extend type Customer @key(fields: "id") {
  id: ID! @external

  reviews(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
    sort: ReviewSort = NEWEST
  ): ReviewConnection!

  productQuestions(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
    sort: ProductQuestionSort = NEWEST
  ): ProductQuestionConnection!

  reviewRequests(first: Int, after: Cursor, last: Int, before: Cursor): ReviewRequestConnection!
}

extend interface Media {
  id: ID!
}
