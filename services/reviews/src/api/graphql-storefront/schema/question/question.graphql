type ProductQuestion implements Node & ReviewContent @key(fields: "id") {
  id: ID!
  kind: ReviewContentKind!
  title: String
  body: String!
  locale: LocaleCode!
  author: ReviewContentAuthor!
  status: ReviewContentStatus!
  revision: Int!
  publishedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  metrics: ReviewContentMetrics!
  translations: [ReviewContentTranslation!]!
  viewerEngagement: ReviewContentViewerEngagement!

  product: Product!
  variant: ProductVariant
  answers(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
  ): ProductQuestionAnswerConnection!
  viewerSubscription: ProductQuestionSubscription
}

type ProductQuestionAnswer implements Node & ReviewContent @key(fields: "id") {
  id: ID!
  kind: ReviewContentKind!
  title: String
  body: String!
  locale: LocaleCode!
  author: ReviewContentAuthor!
  status: ReviewContentStatus!
  revision: Int!
  publishedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  metrics: ReviewContentMetrics!
  translations: [ReviewContentTranslation!]!
  viewerEngagement: ReviewContentViewerEngagement!

  question: ProductQuestion!
  isOfficial: Boolean!
  isAccepted: Boolean!
  sortIndex: Int!
}

type ProductQuestionSubscription implements Node @key(fields: "id") {
  id: ID!
  question: ProductQuestion!
  subscriberCustomer: Customer
  channel: ReviewNotificationChannel!
  status: ProductQuestionSubscriptionStatus!
  locale: LocaleCode!
  lastNotifiedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ProductQuestionConnection implements Connection {
  edges: [ProductQuestionEdge!]!
  nodes: [ProductQuestion!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ProductQuestionEdge {
  cursor: Cursor!
  node: ProductQuestion!
}

type ProductQuestionAnswerConnection implements Connection {
  edges: [ProductQuestionAnswerEdge!]!
  nodes: [ProductQuestionAnswer!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ProductQuestionAnswerEdge {
  cursor: Cursor!
  node: ProductQuestionAnswer!
}

"""Input for a customer or guest product-question submission."""
input ProductQuestionCreateInput {
  """Shared text, locale, guest identity, and idempotency metadata."""
  content: ReviewContentSubmissionInput!
  productId: ID!
  variantId: ID
}

"""Result of submitting a product question."""
type ProductQuestionCreatePayload {
  productQuestion: ProductQuestion
  userErrors: [ReviewUserError!]!
}

"""Input for an authenticated customer answer to a product question."""
input ProductQuestionAnswerCreateInput {
  productQuestionId: ID!
  """Revision returned by ProductQuestion.revision."""
  expectedRevision: Int!
  """
  Shared text, locale, and idempotency metadata. Guest author data is rejected
  because storefront question answers require an authenticated customer.
  """
  content: ReviewContentSubmissionInput!
}

"""Result of adding a customer answer to a product question."""
type ProductQuestionAnswerCreatePayload {
  productQuestion: ProductQuestion
  answer: ProductQuestionAnswer
  userErrors: [ReviewUserError!]!
}
