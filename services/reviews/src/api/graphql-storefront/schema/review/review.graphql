type Review implements Node & ReviewContent @key(fields: "id") {
  id: ID!
  kind: ReviewContentKind!
  title: String
  body: String!
  locale: LocaleCode!
  author: ReviewContentAuthor!
  status: ReviewContentStatus!
  revision: Int!
  publishedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  metrics: ReviewContentMetrics!
  translations: [ReviewContentTranslation!]!
  viewerEngagement: ReviewContentViewerEngagement!

  product: Product!
  variant: ProductVariant
  rating: Int!
  ratings: [ReviewRating!]!
  verificationStatus: ReviewVerificationStatus!
  isVerifiedPurchase: Boolean!
  isIncentivized: Boolean!
  incentiveDisclosure: String
  media: [ReviewMedia!]!
  replies(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
  ): ReviewReplyConnection!
}

type ReviewMedia implements Node @key(fields: "id") {
  id: ID!
  review: Review!
  media: Media!
  sortIndex: Int!
  caption: String
  status: ReviewContentStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ReviewReply implements Node & ReviewContent @key(fields: "id") {
  id: ID!
  kind: ReviewContentKind!
  title: String
  body: String!
  locale: LocaleCode!
  author: ReviewContentAuthor!
  status: ReviewContentStatus!
  revision: Int!
  publishedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  metrics: ReviewContentMetrics!
  translations: [ReviewContentTranslation!]!
  viewerEngagement: ReviewContentViewerEngagement!

  review: Review!
  isOfficial: Boolean!
  sortIndex: Int!
}

type ReviewRating {
  criterion: ReviewRatingCriterion!
  value: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""A Relay connection to product reviews."""
type ReviewConnection implements Connection {
  edges: [ReviewEdge!]!
  nodes: [Review!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ReviewEdge {
  cursor: Cursor!
  node: Review!
}

type ReviewReplyConnection implements Connection {
  edges: [ReviewReplyEdge!]!
  nodes: [ReviewReply!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ReviewReplyEdge {
  cursor: Cursor!
  node: ReviewReply!
}

"""One detailed rating value supplied for an active product criterion."""
input ReviewRatingValueInput {
  criterionId: ID!
  """Rating from 1 through 5."""
  value: Int!
}

"""One media attachment submitted with a review."""
input ReviewMediaCreateInput {
  mediaId: ID!
  """Zero-based display position. Defaults to the input list position."""
  sortIndex: Int
  caption: String
}

"""Input for a customer or guest product-review submission."""
input ReviewCreateInput {
  """Shared text, locale, guest identity, and idempotency metadata."""
  content: ReviewContentSubmissionInput!
  productId: ID!
  variantId: ID
  """
  Order associated with the review. Ownership and eligibility are validated by
  the service and cannot be used to self-assign verified-purchase status.
  """
  orderId: ID
  """Order line associated with the reviewed product or variant."""
  orderLineId: ID
  """Optional review title, limited to 150 characters."""
  title: String
  """Overall rating from 1 through 5."""
  rating: Int!
  """Detailed values for the product's active rating criteria."""
  ratings: [ReviewRatingValueInput!]
  """Review media in storefront display order."""
  media: [ReviewMediaCreateInput!]
}

"""Result of submitting a product review."""
type ReviewCreatePayload {
  review: Review
  userErrors: [ReviewUserError!]!
}
