"""
A report submitted against storefront content.
"""
type ReviewContentReport implements Node @key(fields: "id") {
  id: ID!
  content: ReviewContent!
  reporterCustomer: Customer
  reason: ReviewContentReportReason!
  details: String
  status: ReviewContentReportStatus!
  resolvedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
A moderation case associated with content owned by the current customer.
"""
type ReviewModerationCase implements Node @key(fields: "id") {
  id: ID!
  content: ReviewContent!
  status: ReviewModerationCaseStatus!
  priority: Int!
  reasonCode: String!
  dueAt: DateTime
  resolutionCode: String
  resolvedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
An append-only public lifecycle event for moderated content.
"""
type ReviewModerationEvent implements Node @key(fields: "id") {
  id: ID!
  content: ReviewContent!
  moderationCase: ReviewModerationCase
  action: ReviewModerationAction!
  fromStatus: ReviewContentStatus
  toStatus: ReviewContentStatus
  reasonCode: String
  isAutomated: Boolean!
  createdAt: DateTime!
}

"""
Automated moderation evidence associated with customer-owned content.
"""
type ReviewModerationSignal implements Node @key(fields: "id") {
  id: ID!
  content: ReviewContent!
  provider: String!
  signalType: String!
  score: Float
  verdict: ReviewModerationVerdict!
  modelVersion: String
  createdAt: DateTime!
}

"""
A revision of content owned by the current customer.
"""
type ReviewContentRevision implements Node @key(fields: "id") {
  id: ID!
  content: ReviewContent!
  revision: Int!
  changeReason: String
  createdAt: DateTime!
}

type ReviewContentReportConnection implements Connection {
  edges: [ReviewContentReportEdge!]!
  nodes: [ReviewContentReport!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ReviewContentReportEdge {
  cursor: Cursor!
  node: ReviewContentReport!
}

type ReviewModerationCaseConnection implements Connection {
  edges: [ReviewModerationCaseEdge!]!
  nodes: [ReviewModerationCase!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ReviewModerationCaseEdge {
  cursor: Cursor!
  node: ReviewModerationCase!
}

type ReviewModerationEventConnection implements Connection {
  edges: [ReviewModerationEventEdge!]!
  nodes: [ReviewModerationEvent!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ReviewModerationEventEdge {
  cursor: Cursor!
  node: ReviewModerationEvent!
}

type ReviewModerationSignalConnection implements Connection {
  edges: [ReviewModerationSignalEdge!]!
  nodes: [ReviewModerationSignal!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ReviewContentRevisionConnection implements Connection {
  edges: [ReviewContentRevisionEdge!]!
  nodes: [ReviewContentRevision!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ReviewContentRevisionEdge {
  cursor: Cursor!
  node: ReviewContentRevision!
}

type ReviewModerationSignalEdge {
  cursor: Cursor!
  node: ReviewModerationSignal!
}

"""
Input for reporting storefront review content to moderation.
"""
input ReviewContentReportCreateInput {
  """
  Review, reply, product question, or question answer being reported.
  """
  contentId: ID!
  reason: ReviewContentReportReason!
  """
  Additional customer-provided context, limited to 2,000 characters. Details
  are required when reason is OTHER.
  """
  details: String
}

"""
Result of submitting a storefront content report.
"""
type ReviewContentReportCreatePayload {
  """
  Reported content with refreshed viewer engagement.
  """
  content: ReviewContent
  """
  The viewer's active report. An existing active report is returned when the
  same logical submission is safely retried.
  """
  report: ReviewContentReport
  userErrors: [ReviewUserError!]!
}
