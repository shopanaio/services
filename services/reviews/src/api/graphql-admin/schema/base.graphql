extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: [
      "@key"
      "@requires"
      "@provides"
      "@external"
      "@shareable"
      "@override"
      "@inaccessible"
    ]
  )

extend type Query {
  """Admin-only Reviews query namespace."""
  reviewsQuery: ReviewsQuery!

  """Shared query namespace for product widgets."""
  widgetQuery: WidgetQuery! @shareable
}

"""Product widgets contributed by the Reviews service."""
type WidgetQuery {
  """Aggregated reviews and Q&A data for a product."""
  reviews(productId: ID!): ProductReviewsWidget!
}

extend type Mutation {
  """Admin-only Reviews mutation namespace."""
  reviewsMutation: ReviewsMutation!
}

"""Administrative reads for review, Q&A, moderation, and configuration data."""
type ReviewsQuery {
  """Resolve a Reviews-owned node by global ID."""
  node(id: ID!): Node

  """Resolve multiple Reviews-owned nodes while preserving input order."""
  nodes(ids: [ID!]!): [Node]!

  """Current store review and Q&A configuration."""
  storeConfiguration: ReviewStoreConfiguration

  ratingCriterion(id: ID!): ReviewRatingCriterion
  ratingCriteria(
    first: Int
    after: String
    last: Int
    before: String
    where: ReviewRatingCriterionWhereInput
    orderBy: [ReviewRatingCriterionOrderByInput!]
  ): ReviewRatingCriterionConnection!

  """Any moderated content aggregate owned by Reviews."""
  content(id: ID!): ReviewContent
  contents(
    first: Int
    after: String
    last: Int
    before: String
    where: ReviewContentWhereInput
    orderBy: [ReviewContentOrderByInput!]
    meta: ReviewContentConnectionMetaInput
  ): ReviewContentConnection!

  review(id: ID!): Review
  reviews(
    first: Int
    after: String
    last: Int
    before: String
    where: ReviewWhereInput
    orderBy: [ReviewOrderByInput!]
    meta: ReviewContentConnectionMetaInput
  ): ReviewConnection!

  reviewReply(id: ID!): ReviewReply
  reviewReplies(
    first: Int
    after: String
    last: Int
    before: String
    where: ReviewReplyWhereInput
    orderBy: [ReviewReplyOrderByInput!]
    meta: ReviewContentConnectionMetaInput
  ): ReviewReplyConnection!

  productQuestion(id: ID!): ProductQuestion
  productQuestions(
    first: Int
    after: String
    last: Int
    before: String
    where: ProductQuestionWhereInput
    orderBy: [ProductQuestionOrderByInput!]
    meta: ReviewContentConnectionMetaInput
  ): ProductQuestionConnection!

  productQuestionAnswer(id: ID!): ProductQuestionAnswer
  productQuestionAnswers(
    first: Int
    after: String
    last: Int
    before: String
    where: ProductQuestionAnswerWhereInput
    orderBy: [ProductQuestionAnswerOrderByInput!]
    meta: ReviewContentConnectionMetaInput
  ): ProductQuestionAnswerConnection!

  reviewRequest(id: ID!): ReviewRequest
  reviewRequests(
    first: Int
    after: String
    last: Int
    before: String
    where: ReviewRequestWhereInput
    orderBy: [ReviewRequestOrderByInput!]
  ): ReviewRequestConnection!

  contentReport(id: ID!): ReviewContentReport
  contentReports(
    first: Int
    after: String
    last: Int
    before: String
    where: ReviewContentReportWhereInput
    orderBy: [ReviewContentReportOrderByInput!]
  ): ReviewContentReportConnection!

  moderationCase(id: ID!): ReviewModerationCase
  moderationCases(
    first: Int
    after: String
    last: Int
    before: String
    where: ReviewModerationCaseWhereInput
    orderBy: [ReviewModerationCaseOrderByInput!]
  ): ReviewModerationCaseConnection!

  contentExternalReference(id: ID!): ReviewContentExternalReference
  contentExternalReferences(
    first: Int
    after: String
    last: Int
    before: String
    where: ReviewContentExternalReferenceWhereInput
    orderBy: [ReviewContentExternalReferenceOrderByInput!]
  ): ReviewContentExternalReferenceConnection!

  productReviewSummary(productId: ID!): ProductReviewSummary
  productQuestionSummary(productId: ID!): ProductQuestionSummary
}

"""Administrative commands. Storefront submission and engagement commands live elsewhere."""
type ReviewsMutation {
  storeConfigurationUpdate(
    configurationId: ID!
    expectedRevision: Int!
    operations: ReviewStoreConfigurationUpdateInput
  ): ReviewStoreConfigurationUpdatePayload!

  ratingCriterionCreate(
    input: ReviewRatingCriterionCreateInput!
  ): ReviewRatingCriterionCreatePayload!
  ratingCriterionUpdate(
    criterionId: ID!
    expectedUpdatedAt: DateTime!
    operations: ReviewRatingCriterionUpdateInput
  ): ReviewRatingCriterionUpdatePayload!
  ratingCriterionDelete(
    input: ReviewRatingCriterionDeleteInput!
  ): ReviewRatingCriterionDeletePayload!

  reviewCreate(input: ReviewCreateInput!): ReviewCreatePayload!
  reviewUpdate(
    reviewId: ID!
    expectedRevision: Int!
    operations: ReviewUpdateInput
  ): ReviewUpdatePayload!
  reviewDelete(input: ReviewContentDeleteInput!): ReviewDeletePayload!

  productQuestionCreate(
    input: ProductQuestionCreateInput!
  ): ProductQuestionCreatePayload!
  productQuestionUpdate(
    productQuestionId: ID!
    expectedRevision: Int!
    operations: ProductQuestionUpdateInput
  ): ProductQuestionUpdatePayload!
  productQuestionDelete(
    input: ReviewContentDeleteInput!
  ): ProductQuestionDeletePayload!

  productQuestionSubscriptionUpdate(
    subscriptionId: ID!
    expectedUpdatedAt: DateTime!
    operations: ProductQuestionSubscriptionUpdateInput
  ): ProductQuestionSubscriptionUpdatePayload!

  contentRedact(
    contentId: ID!
    expectedRevision: Int!
  ): ReviewContentUpdatePayload!
  contentRevisionRestore(
    contentId: ID!
    revision: Int!
    expectedRevision: Int!
  ): ReviewContentUpdatePayload!

  reviewRequestCreate(input: ReviewRequestCreateInput!): ReviewRequestCreatePayload!
  reviewRequestUpdate(
    reviewRequestId: ID!
    expectedUpdatedAt: DateTime!
    operations: ReviewRequestUpdateInput
  ): ReviewRequestUpdatePayload!

  contentReportUpdate(
    contentReportId: ID!
    expectedUpdatedAt: DateTime!
    operations: ReviewContentReportUpdateInput
  ): ReviewContentReportUpdatePayload!

  moderationCaseCreate(
    input: ReviewModerationCaseCreateInput!
  ): ReviewModerationCaseCreatePayload!
  moderationCaseUpdate(
    moderationCaseId: ID!
    expectedUpdatedAt: DateTime!
    operations: ReviewModerationCaseUpdateInput
  ): ReviewModerationCaseUpdatePayload!

  contentExternalReferenceCreate(
    input: ReviewContentExternalReferenceCreateInput!
  ): ReviewContentExternalReferenceCreatePayload!
  contentExternalReferenceUpdate(
    externalReferenceId: ID!
    expectedUpdatedAt: DateTime!
    operations: ReviewContentExternalReferenceUpdateInput
  ): ReviewContentExternalReferenceUpdatePayload!
  contentExternalReferenceDelete(
    input: ReviewContentExternalReferenceDeleteInput!
  ): ReviewContentExternalReferenceDeletePayload!
}
