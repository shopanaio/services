type Review implements Node & ReviewContent @key(fields: "id") {
  id: ID!
  kind: ReviewContentKind!
  title: String
  body: String!
  locale: LocaleCode!
  author: ReviewContentAuthor!
  sourceChannel: String!
  sourceMetadata: JSON!
  idempotencyKey: String
  status: ReviewContentStatus!
  moderationNote: String
  moderatedByPrincipalId: String
  moderatedAt: DateTime
  publishedAt: DateTime
  unpublishedAt: DateTime
  revision: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  redactedAt: DateTime
  metrics: ReviewContentMetrics!
  translations: [ReviewContentTranslation!]!
  publications: [ReviewContentPublication!]!
  votes(first: Int, after: String, last: Int, before: String): ReviewContentVoteConnection!
  reports(first: Int, after: String, last: Int, before: String): ReviewContentReportConnection!
  moderationCases(
    first: Int
    after: String
    last: Int
    before: String
  ): ReviewModerationCaseConnection!
  moderationEvents(
    first: Int
    after: String
    last: Int
    before: String
  ): ReviewModerationEventConnection!
  revisions(first: Int, after: String, last: Int, before: String): ReviewContentRevisionConnection!
  moderationSignals(
    first: Int
    after: String
    last: Int
    before: String
  ): ReviewModerationSignalConnection!
  externalReferences(
    first: Int
    after: String
    last: Int
    before: String
  ): ReviewContentExternalReferenceConnection!

  product: Product!
  variant: Variant
  """
  Orders is not yet an admin federation entity, so evidence remains a global ID contract.
  """
  orderId: ID
  orderLineId: ID
  rating: Int!
  ratings: [ReviewRating!]!
  verificationStatus: ReviewVerificationStatus!
  verificationMethod: String
  verifiedAt: DateTime
  isVerifiedPurchase: Boolean!
  isIncentivized: Boolean!
  incentiveDisclosure: String
  media: [ReviewMedia!]!
  replies(
    first: Int
    after: String
    last: Int
    before: String
    where: ReviewReplyWhereInput
    orderBy: [ReviewReplyOrderByInput!]
    meta: ReviewContentConnectionMetaInput
  ): ReviewReplyConnection!
}

type ReviewRating {
  criterion: ReviewRatingCriterion!
  value: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ReviewMedia implements Node @key(fields: "id") {
  id: ID!
  review: Review!
  file: File!
  sortIndex: Int!
  caption: String
  status: ReviewContentStatus!
  moderationNote: String
  moderatedByPrincipalId: String
  moderatedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ReviewReply implements Node & ReviewContent @key(fields: "id") {
  id: ID!
  kind: ReviewContentKind!
  title: String
  body: String!
  locale: LocaleCode!
  author: ReviewContentAuthor!
  sourceChannel: String!
  sourceMetadata: JSON!
  idempotencyKey: String
  status: ReviewContentStatus!
  moderationNote: String
  moderatedByPrincipalId: String
  moderatedAt: DateTime
  publishedAt: DateTime
  unpublishedAt: DateTime
  revision: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  redactedAt: DateTime
  metrics: ReviewContentMetrics!
  translations: [ReviewContentTranslation!]!
  publications: [ReviewContentPublication!]!
  votes(first: Int, after: String, last: Int, before: String): ReviewContentVoteConnection!
  reports(first: Int, after: String, last: Int, before: String): ReviewContentReportConnection!
  moderationCases(
    first: Int
    after: String
    last: Int
    before: String
  ): ReviewModerationCaseConnection!
  moderationEvents(
    first: Int
    after: String
    last: Int
    before: String
  ): ReviewModerationEventConnection!
  revisions(first: Int, after: String, last: Int, before: String): ReviewContentRevisionConnection!
  moderationSignals(
    first: Int
    after: String
    last: Int
    before: String
  ): ReviewModerationSignalConnection!
  externalReferences(
    first: Int
    after: String
    last: Int
    before: String
  ): ReviewContentExternalReferenceConnection!

  review: Review!
  isOfficial: Boolean!
  sortIndex: Int!
}

type ReviewConnection {
  edges: [ReviewEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ReviewEdge {
  node: Review!
  cursor: String!
}

type ReviewReplyConnection {
  edges: [ReviewReplyEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ReviewReplyEdge {
  node: ReviewReply!
  cursor: String!
}

input ReviewRatingValueInput {
  criterionId: ID!
  value: Int!
}

input ReviewRatingUpdateInput {
  overall: Int
  """
  Complete detailed criterion rating replacement when supplied.
  """
  criteria: [ReviewRatingValueInput!]
}

input ReviewSubjectUpdateInput {
  productId: ID
  variantId: ID
  orderId: ID
  orderLineId: ID
}

input ReviewVerificationUpdateInput {
  status: ReviewVerificationStatus!
  method: String
  verifiedAt: DateTime
}

input ReviewIncentiveUpdateInput {
  isIncentivized: Boolean!
  disclosure: String
}

input ReviewMediaSyncItemInput {
  fileId: ID!
  sortIndex: Int!
  caption: String
  moderation: ReviewContentModerationInput
}

input ReviewCreateInput {
  content: ReviewContentCreateInput!
  productId: ID!
  variantId: ID
  orderId: ID
  orderLineId: ID
  rating: Int!
  ratings: [ReviewRatingValueInput!]
  verification: ReviewVerificationUpdateInput
  incentive: ReviewIncentiveUpdateInput
  media: [ReviewMediaSyncItemInput!]
}

"""
Section-based aggregate update following Catalog productUpdate semantics.
"""
input ReviewUpdateInput {
  """
  Text, author, source, moderation, translations, and publications.
  """
  content: ReviewContentUpdateInput
  subject: ReviewSubjectUpdateInput
  rating: ReviewRatingUpdateInput
  verification: ReviewVerificationUpdateInput
  incentive: ReviewIncentiveUpdateInput
  """
  Complete media replacement when supplied. Empty removes every attachment.
  """
  media: [ReviewMediaSyncItemInput!]
  """
  Create, update, or delete replies owned by this review.
  """
  replies: ReviewRepliesUpdateInput
}

input ReviewReplyCreateOperationInput {
  """
  Client-provided correlation key returned in the operation result.
  """
  clientMutationId: String
  content: ReviewContentCreateInput!
  isOfficial: Boolean = true
  sortIndex: Int
}

input ReviewReplyPropertiesUpdateInput {
  isOfficial: Boolean
  sortIndex: Int
}

input ReviewReplyUpdateInput {
  """
  Text, author, source, moderation, translations, and publications.
  """
  content: ReviewContentUpdateInput
  properties: ReviewReplyPropertiesUpdateInput
}

input ReviewReplyUpdateOperationInput {
  replyId: ID!
  expectedRevision: Int!
  operations: ReviewReplyUpdateInput!
}

input ReviewReplyDeleteOperationInput {
  replyId: ID!
  expectedRevision: Int!
  """
  Hard deletion is reserved for explicit privacy or retention workflows.
  """
  permanent: Boolean = false
}

input ReviewRepliesUpdateInput {
  create: [ReviewReplyCreateOperationInput!]
  update: [ReviewReplyUpdateOperationInput!]
  delete: [ReviewReplyDeleteOperationInput!]
}

type ReviewCreatePayload {
  review: Review
  userErrors: [GenericUserError!]!
}

type ReviewUpdatePayload {
  review: Review
  operationResults: [ReviewsOperationResult!]!
  userErrors: [GenericUserError!]!
}

type ReviewDeletePayload {
  deletedReviewId: ID
  userErrors: [GenericUserError!]!
}
