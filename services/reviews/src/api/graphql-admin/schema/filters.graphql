"""
Relay filter contract for the admin read models.

Names, logical operators, scalar filters, lower-case sort direction, and
multi-column order inputs intentionally match @shopana/drizzle-query output.
Tenant fields are never exposed and are always injected by repositories.
"""

input ReviewContentConnectionMetaInput {
  """Include soft-deleted content; false by default."""
  includeDeleted: Boolean = false
  """Include privacy-redacted content; true by default for audit workflows."""
  includeRedacted: Boolean = true
}

input ReviewContentWhereInput {
  _and: [ReviewContentWhereInput!]
  _or: [ReviewContentWhereInput!]
  _not: ReviewContentWhereInput
  id: IDFilter
  kind: StringFilter
  title: StringFilter
  body: StringFilter
  locale: StringFilter
  authorType: StringFilter
  authorCustomerId: IDFilter
  authorDisplayName: StringFilter
  sourceChannel: StringFilter
  status: StringFilter
  revision: IntFilter
  createdAt: DateTimeFilter
  updatedAt: DateTimeFilter
  publishedAt: DateTimeFilter
  deletedAt: DateTimeFilter
  redactedAt: DateTimeFilter
  likeCount: IntFilter
  dislikeCount: IntFilter
  reportCount: IntFilter
  openReportCount: IntFilter
  mediaCount: IntFilter
  childCount: IntFilter
}

enum ReviewContentOrderField {
  id
  kind
  title
  locale
  authorType
  authorDisplayName
  sourceChannel
  status
  revision
  createdAt
  updatedAt
  publishedAt
  deletedAt
  redactedAt
  likeCount
  dislikeCount
  reportCount
  openReportCount
  mediaCount
  childCount
}

input ReviewContentOrderByInput {
  field: ReviewContentOrderField!
  direction: SortDirection!
}

