"""
Read-only admin view of a storefront reaction.
"""
type ReviewContentVote implements Node @key(fields: "id") {
  id: ID!
  content: ReviewContent!
  voterCustomer: Customer
  type: ReviewContentVoteType!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ReviewContentVoteConnection {
  edges: [ReviewContentVoteEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ReviewContentVoteEdge {
  node: ReviewContentVote!
  cursor: String!
}
