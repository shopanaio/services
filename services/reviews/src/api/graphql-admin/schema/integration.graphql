type ReviewContentExternalReference implements Node @key(fields: "id") {
  id: ID!
  content: ReviewContent!
  externalSystem: String!
  externalType: String!
  externalId: String!
  externalUrl: String
  direction: ReviewExternalSyncDirection!
  syncStatus: ReviewExternalSyncStatus!
  etag: String
  contentChecksum: String
  lastSyncedAt: DateTime
  lastError: String
  metadata: JSON!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
}

type ReviewContentExternalReferenceConnection {
  edges: [ReviewContentExternalReferenceEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ReviewContentExternalReferenceEdge {
  node: ReviewContentExternalReference!
  cursor: String!
}

input ReviewContentExternalReferenceCreateValuesInput {
  externalSystem: String!
  externalType: String!
  externalId: String!
  externalUrl: String
  direction: ReviewExternalSyncDirection!
  metadata: JSON
}

input ReviewContentExternalReferenceIdentityInput {
  externalSystem: String
  externalType: String
  externalId: String
  externalUrl: String
}

input ReviewContentExternalReferenceSyncInput {
  direction: ReviewExternalSyncDirection
  status: ReviewExternalSyncStatus
  etag: String
  contentChecksum: String
  metadata: JSON
}

input ReviewContentExternalReferenceUpdateValuesInput {
  identity: ReviewContentExternalReferenceIdentityInput
  sync: ReviewContentExternalReferenceSyncInput
}

enum ReviewContentExternalReferenceOperationAction {
  CREATE
  UPDATE
  DELETE
}

"""
An ordered operation on an external reference owned by the content currently being updated.
For CREATE supply create; for UPDATE supply externalReferenceId and update; for DELETE supply
externalReferenceId and, optionally, permanent.
"""
input ReviewContentExternalReferenceOperationInput {
  action: ReviewContentExternalReferenceOperationAction!
  externalReferenceId: ID
  create: ReviewContentExternalReferenceCreateValuesInput
  update: ReviewContentExternalReferenceUpdateValuesInput
  permanent: Boolean = false
}
