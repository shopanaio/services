# Orders Admin namespaces, durable operations, activity, bulk actions, and shared payloads.

extend type Query {
  """
  Entry point for all store-scoped Orders Admin reads.
  """
  ordersQuery: OrdersQuery!
}

extend type Mutation {
  """
  Entry point for all store-scoped Orders Admin commands.
  """
  ordersMutation: OrdersMutation!
}

"""
Read namespace for the Orders Admin API.
"""
type OrdersQuery {
  """
  Find an order by Relay global ID in the current store; inaccessible resources resolve to null.
  """
  order(
    """
    Relay global ID of this resource.
    """
    id: ID!
  ): Order
  """
  Find an order by its store-local number.
  """
  orderByNumber(
    """
    Store-local order number serialized without precision loss.
    """
    number: BigInt!
  ): Order
  """
  List current-store orders with Relay pagination, composable filters, and deterministic sorting.
  """
  orders(
    """
    Validated input value for first.
    """
    first: Int = 20
    """
    Validated input value for after.
    """
    after: String
    """
    Validated input value for last.
    """
    last: Int
    """
    Validated input value for before.
    """
    before: String
    """
    Validated input value for where.
    """
    where: OrderWhereInput
    """
    Validated input value for order by.
    """
    orderBy: [OrderOrderByInput!]
  ): OrderConnection!
  """
  Find a staged order edit by Relay global ID.
  """
  orderEditSession(
    """
    Relay global ID of this resource.
    """
    id: ID!
  ): OrderEditSession
  """
  Find a durable operation for workflow polling.
  """
  orderOperation(
    """
    Relay global ID of this resource.
    """
    id: ID!
  ): OrderOperation
}

"""
Aggregate command namespace. Every command is store-scoped from trusted context.
"""
type OrdersMutation {
  orderCreate(input: OrderCreateInput!): OrderCreatePayload!
  orderUpdate(orderId: ID!, operations: OrderUpdateInput!): OrderUpdatePayload!
  orderDelete(orderId: ID!): OrderDeletePayload!

  """
  Multi-aggregate semantic command over an explicit or filtered order selection.
  """
  orderBulkAction(input: OrderBulkActionInput!): OrderOperationPayload!
}

input OrderUpdateInput {
  fields: OrderFieldsUpdateInput
  lifecycle: [OrderLifecycleOperationInput!]
  customer: OrderCustomerSetInput
  tags: OrderTagsUpdateInput
  adminNote: OrderAdminNoteUpdateInput
  comments: [OrderCommentAddInput!]
  customFields: OrderCustomFieldsUpdateInput
  lines: [OrderLineOperationInput!]
  edits: [OrderEditOperationInput!]
  payments: [OrderPaymentOperationInput!]
  fulfillmentOrders: [OrderFulfillmentOrderOperationInput!]
  fulfillments: [OrderFulfillmentOperationInput!]
  shipments: [OrderShipmentOperationInput!]
  returns: [OrderReturnOperationInput!]
  exchanges: [OrderExchangeOperationInput!]
  integrations: [OrderIntegrationOperationInput!]
}

