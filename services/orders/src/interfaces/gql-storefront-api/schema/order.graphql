"""
The lifecycle state of an order visible to its customer.
"""
enum OrderStatus {
  DRAFT
  ACTIVE
  CLOSED
  CANCELLED
}

"""
The delivery method selected for an order delivery group.
"""
enum OrderDeliveryMethodType {
  LOCAL
  NONE
  PICK_UP
  PICKUP_POINT
  RETAIL
  SHIPPING
}

"""
The customer interaction model of the selected payment method.
"""
enum OrderPaymentFlow {
  ONLINE
  OFFLINE
  ON_DELIVERY
}

"""
Aggregate fulfillment state across every line in an order.
"""
enum OrderFulfillmentStatus {
  UNFULFILLED
  SCHEDULED
  ON_HOLD
  PARTIALLY_FULFILLED
  FULFILLED
  CANCELLED
}

"""
Lifecycle state of one fulfillment operation.
"""
enum OrderFulfillmentOperationStatus {
  PENDING
  OPEN
  SUCCESS
  FAILURE
  CANCELLED
}

"""
Aggregate customer-facing delivery state across all shipments.
"""
enum OrderDeliveryStatus {
  NOT_SHIPPED
  PARTIALLY_SHIPPED
  SHIPPED
  IN_TRANSIT
  OUT_FOR_DELIVERY
  DELIVERED
  DELIVERY_ATTEMPTED
  DELAYED
  EXCEPTION
  RETURNED_TO_SENDER
  CANCELLED
}

"""
Customer-facing lifecycle state of one physical shipment.
"""
enum OrderShipmentStatus {
  LABEL_CREATED
  READY_FOR_PICKUP
  PICKED_UP
  IN_TRANSIT
  OUT_FOR_DELIVERY
  DELIVERED
  DELIVERY_ATTEMPTED
  DELAYED
  EXCEPTION
  RETURNED_TO_SENDER
  CANCELLED
}

"""
Aggregate payment state for an order.
"""
enum OrderPaymentStatus {
  PENDING
  AUTHORIZED
  PARTIALLY_PAID
  PAID
  PARTIALLY_REFUNDED
  REFUNDED
  VOIDED
  EXPIRED
  FAILED
}

"""
The accounting operation represented by a payment transaction.
"""
enum OrderPaymentTransactionKind {
  AUTHORIZATION
  CAPTURE
  SALE
  REFUND
  VOID
}

"""
Lifecycle state of a payment transaction.
"""
enum OrderPaymentTransactionStatus {
  PENDING
  SUCCESS
  FAILURE
  CANCELLED
}

"""
Lifecycle state of a customer-visible refund.
"""
enum OrderRefundStatus {
  PENDING
  SUCCEEDED
  FAILED
  CANCELLED
}

"""
Lifecycle state of a payment authorization void.
"""
enum OrderVoidStatus {
  PENDING
  SUCCEEDED
  FAILED
  CANCELLED
}

"""
State returned after requesting another payment attempt.
"""
enum OrderPaymentRetryStatus {
  REQUIRES_ACTION
  PENDING
  AUTHORIZED
  PAID
  FAILED
}

"""
Customer interaction required to continue a retried payment.
"""
enum OrderPaymentCustomerActionType {
  REDIRECT
  INSTRUCTIONS
}

"""
Customer-selected reason for cancelling an order.
"""
enum OrderCancellationReason {
  CHANGED_MIND
  DUPLICATE_ORDER
  INCORRECT_ITEMS
  INCORRECT_ADDRESS
  PAYMENT_ISSUE
  OTHER
}

"""
Customer-selected reason for returning an order line.
"""
enum OrderReturnReason {
  CHANGED_MIND
  DAMAGED
  DEFECTIVE
  INCORRECT_ITEM
  NOT_AS_DESCRIBED
  SIZE_OR_FIT
  OTHER
}

"""
Customer-visible lifecycle of a return request.
"""
enum OrderReturnRequestStatus {
  REQUESTED
  APPROVED
  REJECTED
  CANCELLED
  IN_TRANSIT
  RECEIVED
  COMPLETED
}

"""
All monetary calculations captured when the order was placed.
"""
type OrderCost {
  subtotalAmount: Money!
  totalDiscountAmount: Money!
  totalTaxAmount: Money!
  totalShippingAmount: Money!
  totalAmount: Money!
}

"""
Customer identity snapshot captured by the order.
"""
type OrderCustomerIdentity {
  customer: Customer
  email: Email
  phone: String
  countryCode: CountryCode
  firstName: String
  middleName: String
  lastName: String
}

"""
A promotional code captured when the order was placed.
"""
type OrderPromoCode {
  code: String!
  discountType: String!
  value: Decimal!
  provider: String!
  conditions: JSON
  appliedAt: DateTime!
}

"""
Immutable delivery destination captured for an order.
"""
type OrderDeliveryAddress implements Node @key(fields: "id") {
  id: ID!
  address1: String
  address2: String
  city: String
  countryCode: CountryCode
  provinceCode: String
  postalCode: String
}

"""
Immutable recipient details captured for an order delivery group.
"""
type OrderRecipient {
  firstName: String
  middleName: String
  lastName: String
  email: Email
  phone: String
}

"""
Delivery method selected for an order delivery group.
"""
type OrderDeliveryMethod {
  code: String!
  providerCode: String!
  type: OrderDeliveryMethodType!
  paymentModel: String
}

"""
A delivery group and its immutable order snapshot.
"""
type OrderDeliveryGroup implements Node @key(fields: "id") {
  id: ID!
  lines: [OrderLine!]!
  address: OrderDeliveryAddress
  recipient: OrderRecipient
  method: OrderDeliveryMethod
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
Payment method selected when the order was placed.
"""
type OrderPaymentMethod {
  code: String!
  providerCode: String!
  flow: OrderPaymentFlow!
}

"""
Quantity from an order line assigned to a fulfillment.
"""
type OrderFulfillmentLine {
  orderLine: OrderLine!
  quantity: Int!
}

"""
Carrier tracking identity. A shipment may expose multiple tracking numbers.
"""
type OrderTrackingInfo {
  number: String!
  url: URL
  company: String
}

"""
Carrier scan or merchant-provided progress event for a shipment.
"""
type OrderTrackingEvent implements Node @key(fields: "id") {
  id: ID!
  status: OrderShipmentStatus!
  message: String
  location: String
  happenedAt: DateTime!
}

"""
One physical shipment created for an order fulfillment.
"""
type OrderShipment implements Node @key(fields: "id") {
  id: ID!
  status: OrderShipmentStatus!
  carrierCode: String
  carrierName: String
  serviceCode: String
  tracking: [OrderTrackingInfo!]!
  events: [OrderTrackingEvent!]!
  shippedAt: DateTime
  estimatedDeliveryAt: DateTime
  deliveredAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
Merchant fulfillment of one or more purchased line quantities.
"""
type OrderFulfillment implements Node @key(fields: "id") {
  id: ID!
  status: OrderFulfillmentOperationStatus!
  lines: [OrderFulfillmentLine!]!
  shipments: [OrderShipment!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
One immutable payment operation recorded against an order.
"""
type OrderPaymentTransaction implements Node @key(fields: "id") {
  id: ID!
  kind: OrderPaymentTransactionKind!
  status: OrderPaymentTransactionStatus!
  amount: Money!
  providerCode: String!
  reference: String
  failureCode: String
  failureMessage: String
  createdAt: DateTime!
  processedAt: DateTime
}

"""
Quantity and amount returned for one purchased order line.
"""
type OrderRefundLine {
  orderLine: OrderLine!
  quantity: Int!
  amount: Money!
}

"""
Customer-visible refund recorded against the order.
"""
type OrderRefund implements Node @key(fields: "id") {
  id: ID!
  status: OrderRefundStatus!
  amount: Money!
  reason: String
  note: String
  lines: [OrderRefundLine!]!
  createdAt: DateTime!
  processedAt: DateTime
}

"""
Customer-visible void of a previously authorized payment amount.
"""
type OrderVoid implements Node @key(fields: "id") {
  id: ID!
  status: OrderVoidStatus!
  amount: Money!
  reason: String
  createdAt: DateTime!
  processedAt: DateTime
}

"""
Availability of another customer-initiated payment attempt.
"""
type OrderPaymentRetry {
  available: Boolean!
  unavailableReasonCode: String
  unavailableReason: String
  expiresAt: DateTime
}

"""
Current payment aggregate and immutable payment history for an order.
"""
type OrderPayment {
  status: OrderPaymentStatus!
  method: OrderPaymentMethod
  authorizedAmount: Money!
  capturedAmount: Money!
  refundedAmount: Money!
  outstandingAmount: Money!
  transactions: [OrderPaymentTransaction!]!
  refunds: [OrderRefund!]!
  voids: [OrderVoid!]!
  retry: OrderPaymentRetry!
}

"""
A customer-visible order in the active storefront context.
"""
type Order implements Node @key(fields: "id") {
  id: ID!
  status: OrderStatus!
  fulfillmentStatus: OrderFulfillmentStatus!
  deliveryStatus: OrderDeliveryStatus!
  """
  Human-readable order number unique within the store.
  """
  number: BigInt!
  channelCode: String
  localeCode: LocaleCode
  currencyCode: CurrencyCode!
  customerIdentity: OrderCustomerIdentity!
  customerNote: String
  cost: OrderCost!
  totalQuantity: Int!
  lines: [OrderLine!]!
  appliedPromoCodes: [OrderPromoCode!]!
  deliveryGroups: [OrderDeliveryGroup!]!
  fulfillments: [OrderFulfillment!]!
  payment: OrderPayment!
  paymentMethod: OrderPaymentMethod @deprecated(reason: "Use payment.method.")
  """
  Server-evaluated post-order actions available to the current customer.
  """
  selfService: OrderSelfService!
  """
  Return requests created for this order, newest first.
  """
  returnRequests(first: Int = 20, after: Cursor): OrderReturnRequestConnection!
  placedAt: DateTime
  closedAt: DateTime
  expiresAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type OrderLineCost {
  unitCompareAtPrice: Money!
  unitPrice: Money!
  discountAmount: Money!
  subtotalAmount: Money!
  taxAmount: Money!
  totalAmount: Money!
}

"""
Immutable customer-visible snapshot of one purchased line.
"""
type OrderLine implements Node @key(fields: "id") {
  id: ID!
  title: String!
  sku: String
  imageUrl: URL
  quantity: Int!
  cost: OrderLineCost!
  purchasableId: ID!
  purchasableSnapshot: JSON!
  """
  Current return eligibility after previous returns and policy limits.
  """
  returnEligibility: OrderLineReturnEligibility!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type OrderConnection implements Connection {
  edges: [OrderEdge!]!
  nodes: [Order!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type OrderEdge {
  cursor: Cursor!
  node: Order!
}

"""
Availability of one post-order action in the current order state.
"""
type OrderSelfServiceAction {
  available: Boolean!
  """
  Stable machine-readable explanation when the action is unavailable.
  """
  unavailableReasonCode: String
  unavailableReason: String
  expiresAt: DateTime
}

"""
Post-order capabilities evaluated for the authenticated customer.
"""
type OrderSelfService {
  cancel: OrderSelfServiceAction!
  reorder: OrderSelfServiceAction!
  requestReturn: OrderSelfServiceAction!
  retryPayment: OrderSelfServiceAction!
}

"""
Return eligibility for one purchased order line.
"""
type OrderLineReturnEligibility {
  eligible: Boolean!
  maxQuantity: Int!
  unavailableReasonCode: String
  unavailableReason: String
  expiresAt: DateTime
}

"""
One line requested for return.
"""
type OrderReturnRequestLine {
  orderLine: OrderLine!
  quantity: Int!
  reason: OrderReturnReason!
  note: String
}

"""
A customer-created request to return one or more order lines.
"""
type OrderReturnRequest implements Node @key(fields: "id") {
  id: ID!
  order: Order!
  status: OrderReturnRequestStatus!
  revision: Int!
  lines: [OrderReturnRequestLine!]!
  customerNote: String
  canCancel: Boolean!
  requestedAt: DateTime!
  resolvedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type OrderReturnRequestConnection implements Connection {
  edges: [OrderReturnRequestEdge!]!
  nodes: [OrderReturnRequest!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type OrderReturnRequestEdge {
  cursor: Cursor!
  node: OrderReturnRequest!
}

"""
Customer-facing post-order mutation error.
"""
type OrderUserError implements DisplayableError {
  field: [String!]
  message: String!
  code: String!
  retryable: Boolean!
}

input OrderCancelInput {
  orderId: ID!
  expectedOrderUpdatedAt: DateTime!
  idempotencyKey: String!
  reason: OrderCancellationReason!
  note: String
}

type OrderCancelPayload {
  order: Order
  userErrors: [OrderUserError!]!
}

"""
Optional quantity override for one line copied into a reorder checkout.
"""
input OrderReorderLineInput {
  orderLineId: ID!
  quantity: Int!
}

input OrderReorderInput {
  orderId: ID!
  idempotencyKey: String!
  """
  Lines to copy. When omitted, every currently purchasable order line is used.
  """
  lines: [OrderReorderLineInput!]
}

"""
An order line that could not be copied into the new checkout.
"""
type OrderReorderSkippedLine {
  orderLine: OrderLine!
  code: String!
  message: String!
}

type OrderReorderPayload {
  checkout: Checkout
  skippedLines: [OrderReorderSkippedLine!]!
  userErrors: [OrderUserError!]!
}

input OrderReturnRequestLineInput {
  orderLineId: ID!
  quantity: Int!
  reason: OrderReturnReason!
  note: String
}

input OrderReturnRequestCreateInput {
  orderId: ID!
  expectedOrderUpdatedAt: DateTime!
  idempotencyKey: String!
  lines: [OrderReturnRequestLineInput!]!
  customerNote: String
}

type OrderReturnRequestCreatePayload {
  order: Order
  returnRequest: OrderReturnRequest
  userErrors: [OrderUserError!]!
}

input OrderReturnRequestCancelInput {
  returnRequestId: ID!
  expectedRevision: Int!
  idempotencyKey: String!
}

type OrderReturnRequestCancelPayload {
  returnRequest: OrderReturnRequest
  userErrors: [OrderUserError!]!
}

input OrderPaymentRetryInput {
  orderId: ID!
  expectedOrderUpdatedAt: DateTime!
  idempotencyKey: String!
  """
  HTTPS URL to which an online payment provider may return the customer.
  """
  returnUrl: URL
}

"""
Customer interaction required to continue the new payment attempt.
"""
type OrderPaymentCustomerAction {
  type: OrderPaymentCustomerActionType!
  url: URL
  title: String
  instructions: String
  expiresAt: DateTime
  data: JSON
}

type OrderPaymentRetryPayload {
  order: Order
  attemptId: ID
  status: OrderPaymentRetryStatus
  customerAction: OrderPaymentCustomerAction
  userErrors: [OrderUserError!]!
}

type Query {
  """
  Returns an order owned by the authenticated customer.

  Customer ownership and store scope are resolved from trusted storefront
  context. An inaccessible order is returned as null.
  """
  order(id: ID!): Order

  """
  Returns a return request owned by the authenticated customer.
  """
  orderReturnRequest(id: ID!): OrderReturnRequest
}

type Mutation {
  """
  Cancels an eligible order owned by the authenticated customer.
  """
  orderCancel(input: OrderCancelInput!): OrderCancelPayload!

  """
  Creates a new checkout from currently purchasable lines of an order.
  """
  orderReorder(input: OrderReorderInput!): OrderReorderPayload!

  """
  Creates a return request for eligible quantities of purchased lines.
  """
  orderReturnRequestCreate(input: OrderReturnRequestCreateInput!): OrderReturnRequestCreatePayload!

  """
  Cancels a return request while its current state permits cancellation.
  """
  orderReturnRequestCancel(input: OrderReturnRequestCancelInput!): OrderReturnRequestCancelPayload!

  """
  Starts another payment attempt for an eligible failed, expired, or pending
  order payment. Replaying the same idempotency key returns the same attempt.
  """
  orderPaymentRetry(input: OrderPaymentRetryInput!): OrderPaymentRetryPayload!
}

extend type Customer @key(fields: "id") {
  id: ID! @external
  """
  Orders owned by this authenticated customer, newest first by default.
  """
  orders(first: Int = 20, after: Cursor, statuses: [OrderStatus!]): OrderConnection!
}

extend type Checkout @key(fields: "id") {
  id: ID! @external
}
