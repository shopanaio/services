# ---- Types of a parent subgraph ----

scalar BigInt
scalar Email

"""A canonical storefront customer owned by the Customers subgraph."""
type Customer @key(fields: "id", resolvable: false) {
  id: ID!
}

"""An image owned and resolved by the Media subgraph."""
type MediaImage @key(fields: "id", resolvable: false) {
  id: ID!
}
