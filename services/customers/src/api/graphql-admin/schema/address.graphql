enum CustomerAddressValidationStatus {
  UNVALIDATED
  VALID
  INVALID
}

type CustomerAddress implements Node {
  id: ID!
  customer: Customer!
  label: String
  prefix: String
  firstName: String
  middleName: String
  lastName: String
  suffix: String
  companyName: String
  phoneE164: String
  address1: String!
  address2: String
  city: String!
  regionName: String
  regionCode: String
  postalCode: String
  """Uppercase ISO 3166-1 alpha-2 code."""
  countryCode: String!
  isDefaultShipping: Boolean!
  isDefaultBilling: Boolean!
  validationStatus: CustomerAddressValidationStatus!
  validatedAt: DateTime
  latitude: Float
  longitude: Float
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
}

type CustomerAddressConnection {
  edges: [CustomerAddressEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerAddressEdge {
  node: CustomerAddress!
  cursor: String!
}

input CustomerAddressCreateInput {
  customerId: ID!
  label: String
  prefix: String
  firstName: String
  middleName: String
  lastName: String
  suffix: String
  companyName: String
  phoneE164: String
  address1: String!
  address2: String
  city: String!
  regionName: String
  regionCode: String
  postalCode: String
  countryCode: String!
  isDefaultShipping: Boolean = false
  isDefaultBilling: Boolean = false
  latitude: Float
  longitude: Float
}

input CustomerAddressUpdateInput {
  label: String
  prefix: String
  firstName: String
  middleName: String
  lastName: String
  suffix: String
  companyName: String
  phoneE164: String
  address1: String
  address2: String
  city: String
  regionName: String
  regionCode: String
  postalCode: String
  countryCode: String
  """Set or clear this address as the customer's shipping default."""
  isDefaultShipping: Boolean
  """Set or clear this address as the customer's billing default."""
  isDefaultBilling: Boolean
  latitude: Float
  longitude: Float
}

"""Address values used inside the atomic customerUpdate operation."""
input CustomerAddressCreateOperationInput {
  label: String
  prefix: String
  firstName: String
  middleName: String
  lastName: String
  suffix: String
  companyName: String
  phoneE164: String
  address1: String!
  address2: String
  city: String!
  regionName: String
  regionCode: String
  postalCode: String
  countryCode: String!
  isDefaultShipping: Boolean = false
  isDefaultBilling: Boolean = false
  latitude: Float
  longitude: Float
}

input CustomerAddressUpdateOperationInput {
  addressId: ID!
  operations: CustomerAddressUpdateInput!
}

"""Atomic address changes scoped to the customer being updated."""
input CustomerAddressesUpdateInput {
  create: [CustomerAddressCreateOperationInput!]
  update: [CustomerAddressUpdateOperationInput!]
  deleteIds: [ID!]
  """Existing address ID to make the default. Explicit null clears the default."""
  defaultShippingAddressId: ID
  """Existing address ID to make the default. Explicit null clears the default."""
  defaultBillingAddressId: ID
}

input CustomerAddressDeleteInput {
  id: ID!
}

type CustomerAddressCreatePayload {
  address: CustomerAddress
  userErrors: [GenericUserError!]!
}

type CustomerAddressUpdatePayload {
  address: CustomerAddress
  operationResults: [CustomerOperationResult!]!
  userErrors: [GenericUserError!]!
}

type CustomerAddressDeletePayload {
  deletedAddressId: ID
  userErrors: [GenericUserError!]!
}
