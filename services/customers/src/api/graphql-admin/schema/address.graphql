enum CustomerAddressValidationStatus {
  UNVALIDATED
  VALID
  INVALID
}

type CustomerAddress implements Node {
  id: ID!
  customer: Customer!
  label: String
  prefix: String
  firstName: String
  middleName: String
  lastName: String
  suffix: String
  companyName: String
  phoneE164: String
  address1: String!
  address2: String
  city: String!
  regionName: String
  regionCode: String
  postalCode: String
  """
  Uppercase ISO 3166-1 alpha-2 code.
  """
  countryCode: String!
  isDefaultShipping: Boolean!
  isDefaultBilling: Boolean!
  validationStatus: CustomerAddressValidationStatus!
  validatedAt: DateTime
  latitude: Float
  longitude: Float
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
}

type CustomerAddressConnection {
  edges: [CustomerAddressEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerAddressEdge {
  node: CustomerAddress!
  cursor: String!
}

input CustomerAddressPatchInput {
  label: String
  prefix: String
  firstName: String
  middleName: String
  lastName: String
  suffix: String
  companyName: String
  phoneE164: String
  address1: String
  address2: String
  city: String
  regionName: String
  regionCode: String
  postalCode: String
  countryCode: String
  """
  Set or clear this address as the customer's shipping default.
  """
  isDefaultShipping: Boolean
  """
  Set or clear this address as the customer's billing default.
  """
  isDefaultBilling: Boolean
  latitude: Float
  longitude: Float
}

"""
Address values used inside the unified customerUpdate workflow.
"""
input CustomerAddressCreateOperationInput {
  label: String
  prefix: String
  firstName: String
  middleName: String
  lastName: String
  suffix: String
  companyName: String
  phoneE164: String
  address1: String!
  address2: String
  city: String!
  regionName: String
  regionCode: String
  postalCode: String
  countryCode: String!
  isDefaultShipping: Boolean = false
  isDefaultBilling: Boolean = false
  latitude: Float
  longitude: Float
}

enum CustomerAddressOperationAction {
  CREATE
  UPDATE
  DELETE
  SET_DEFAULT_SHIPPING
  SET_DEFAULT_BILLING
}

"""
One ordered address operation. Values are required by the selected action;
addressId is required for UPDATE and DELETE and may be null for either default action.
"""
input CustomerAddressOperationInput {
  action: CustomerAddressOperationAction!
  addressId: ID
  values: CustomerAddressCreateOperationInput
  patch: CustomerAddressPatchInput
}

"""
Ordered address changes scoped to the customer being updated.
"""
input CustomerAddressesUpdateInput {
  operations: [CustomerAddressOperationInput!]!
}
