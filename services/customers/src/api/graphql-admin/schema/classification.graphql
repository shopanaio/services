enum CustomerAssignmentSource {
  MANUAL
  RULE
  IMPORT
  SYSTEM
}

enum CustomerSegmentType {
  MANUAL
  DYNAMIC
}

enum CustomerSegmentStatus {
  DRAFT
  ACTIVE
  ARCHIVED
}

enum CustomerSegmentMaterializationStatus {
  PENDING
  RUNNING
  READY
  FAILED
}

type CustomerGroup implements Node {
  id: ID!
  code: String!
  name: String!
  description: String
  isDefault: Boolean!
  isActive: Boolean!
  """Aggregate revision incremented by definition, state and membership changes."""
  revision: Int!
  customersCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  customerMemberships(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerGroupMembershipWhereInput
    orderBy: [CustomerGroupMembershipOrderByInput!]
  ): CustomerGroupMembershipConnection!
}

type CustomerGroupConnection {
  edges: [CustomerGroupEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerGroupEdge {
  node: CustomerGroup!
  cursor: String!
}

type CustomerGroupMembership implements Node {
  id: ID!
  customer: Customer!
  group: CustomerGroup!
  isPrimary: Boolean!
  source: CustomerAssignmentSource!
  assignedById: String
  assignedAt: DateTime!
  expiresAt: DateTime
  isActive: Boolean!
}

type CustomerGroupMembershipConnection {
  edges: [CustomerGroupMembershipEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerGroupMembershipEdge {
  node: CustomerGroupMembership!
  cursor: String!
}

type CustomerTag implements Node {
  id: ID!
  name: String!
  normalizedName: String!
  customersCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  customerAssignments(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerTagAssignmentWhereInput
    orderBy: [CustomerTagAssignmentOrderByInput!]
  ): CustomerTagAssignmentConnection!
}

type CustomerTagConnection {
  edges: [CustomerTagEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerTagEdge {
  node: CustomerTag!
  cursor: String!
}

type CustomerTagAssignment implements Node {
  id: ID!
  customer: Customer!
  tag: CustomerTag!
  assignedById: String
  assignedAt: DateTime!
}

type CustomerTagAssignmentConnection {
  edges: [CustomerTagAssignmentEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerTagAssignmentEdge {
  node: CustomerTagAssignment!
  cursor: String!
}

type CustomerSegment implements Node {
  id: ID!
  name: String!
  description: String
  """Optional merchant-selected #RRGGBB presentation color."""
  color: String
  type: CustomerSegmentType!
  status: CustomerSegmentStatus!
  query: String
  definition: JSON!
  definitionRevision: Int!
  evaluationGeneration: Int!
  materializationStatus: CustomerSegmentMaterializationStatus
  createdById: String
  """Aggregate revision incremented by definition, state and membership changes."""
  revision: Int!
  customersCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  customerMemberships(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerSegmentMembershipWhereInput
    orderBy: [CustomerSegmentMembershipOrderByInput!]
  ): CustomerSegmentMembershipConnection!
}

type CustomerSegmentConnection {
  edges: [CustomerSegmentEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerSegmentEdge {
  node: CustomerSegment!
  cursor: String!
}

type CustomerSegmentMembership implements Node {
  id: ID!
  customer: Customer!
  segment: CustomerSegment!
  source: CustomerAssignmentSource!
  evaluatedAt: DateTime!
  expiresAt: DateTime
  isActive: Boolean!
}

type CustomerSegmentMembershipConnection {
  edges: [CustomerSegmentMembershipEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerSegmentMembershipEdge {
  node: CustomerSegmentMembership!
  cursor: String!
}

input CustomerGroupCreateInput {
  code: String!
  name: String!
  description: String
  isDefault: Boolean = false
  isActive: Boolean = true
}

input CustomerGroupDefinitionUpdateInput {
  code: String
  name: String
  description: String
}

input CustomerGroupStateUpdateInput {
  isDefault: Boolean
  isActive: Boolean
}

input CustomerGroupUpdateInput {
  definition: CustomerGroupDefinitionUpdateInput
  state: CustomerGroupStateUpdateInput
  """Create, update, or delete customer memberships in this group."""
  memberships: CustomerGroupMembershipRelationsUpdateInput
}

input CustomerGroupDeleteInput {
  id: ID!
}

"""Create a customer's membership in this group."""
input CustomerGroupMembershipRelationCreateInput {
  customerId: ID!
  isPrimary: Boolean = false
  expiresAt: DateTime
}

input CustomerGroupMembershipRelationUpdateInput {
  membershipId: ID!
  isPrimary: Boolean
  expiresAt: DateTime
}

input CustomerGroupMembershipRelationsUpdateInput {
  create: [CustomerGroupMembershipRelationCreateInput!]
  update: [CustomerGroupMembershipRelationUpdateInput!]
  deleteIds: [ID!]
}

input CustomerTagCreateInput {
  name: String!
}

input CustomerTagUpdateInput {
  name: String
  """Create or delete customer assignments for this tag."""
  assignments: CustomerTagAssignmentRelationsUpdateInput
}

input CustomerTagDeleteInput {
  id: ID!
}

input CustomerTagAssignmentRelationCreateInput {
  customerId: ID!
}

input CustomerTagAssignmentRelationsUpdateInput {
  create: [CustomerTagAssignmentRelationCreateInput!]
  deleteIds: [ID!]
}

input CustomerSegmentCreateInput {
  name: String!
  description: String
  color: String
  type: CustomerSegmentType!
  """Defaults to DRAFT when omitted."""
  status: CustomerSegmentStatus
  query: String
}

input CustomerSegmentDetailsUpdateInput {
  name: String
  description: String
  color: String
}

input CustomerSegmentDefinitionUpdateInput {
  query: String!
}

enum CustomerSegmentDiagnosticSeverity {
  ERROR
  WARNING
}

type CustomerSegmentQueryDiagnostic {
  code: String!
  message: String!
  severity: CustomerSegmentDiagnosticSeverity!
  startOffset: Int!
  endOffset: Int!
  line: Int!
  column: Int!
}

type CustomerSegmentQueryValidationResult {
  valid: Boolean!
  canonicalQuery: String
  definition: JSON
  complexity: Int
  diagnostics: [CustomerSegmentQueryDiagnostic!]!
}

enum CustomerSegmentAttributeKind {
  SCALAR
  LIST
  FUNCTION
  VIRTUAL
}

enum CustomerSegmentAttributeAvailability {
  AVAILABLE
  UNAVAILABLE
}

type CustomerSegmentFunctionParameterDescriptor {
  name: String!
  presentationKey: String!
  valueType: String!
  operators: [String!]!
  enumValues: [String!]!
  aggregate: Boolean!
  nullable: Boolean!
}

type CustomerSegmentAttributeDescriptor {
  name: String!
  presentationKey: String!
  kind: CustomerSegmentAttributeKind!
  valueType: String!
  operators: [String!]!
  enumValues: [String!]!
  parameters: [CustomerSegmentFunctionParameterDescriptor!]!
  availability: CustomerSegmentAttributeAvailability!
  unavailabilityReason: String
}

type CustomerSegmentPreview {
  validation: CustomerSegmentQueryValidationResult!
  customers: CustomerConnection
  totalCount: Int
  timedOut: Boolean!
}

input CustomerSegmentStateUpdateInput {
  status: CustomerSegmentStatus
}

input CustomerSegmentUpdateInput {
  details: CustomerSegmentDetailsUpdateInput
  definition: CustomerSegmentDefinitionUpdateInput
  state: CustomerSegmentStateUpdateInput
  """Create, update, delete, or replace manual customer memberships."""
  memberships: CustomerSegmentMembershipRelationsUpdateInput
}

input CustomerSegmentMembershipRelationCreateInput {
  customerId: ID!
  expiresAt: DateTime
}

input CustomerSegmentMembershipRelationUpdateInput {
  membershipId: ID!
  expiresAt: DateTime
}

input CustomerSegmentMembershipRelationsUpdateInput {
  create: [CustomerSegmentMembershipRelationCreateInput!]
  update: [CustomerSegmentMembershipRelationUpdateInput!]
  deleteIds: [ID!]
  """Atomically replace all manual memberships with these customers."""
  setCustomerIds: [ID!]
}

input CustomerSegmentDeleteInput {
  id: ID!
  expectedRevision: Int
}

"""One group membership used by the unified customer update."""
input CustomerGroupMembershipUpdateOperationInput {
  groupId: ID!
  isPrimary: Boolean = false
  expiresAt: DateTime
}

"""Replace all manual group memberships for the customer."""
input CustomerGroupMembershipsUpdateInput {
  memberships: [CustomerGroupMembershipUpdateOperationInput!]!
}

"""Replace all tag assignments for the customer."""
input CustomerTagAssignmentsUpdateInput {
  tagIds: [ID!]!
}

"""Replace all manual segment memberships for the customer."""
input CustomerSegmentMembershipsUpdateInput {
  segmentIds: [ID!]!
}

type CustomerGroupCreatePayload {
  group: CustomerGroup
  userErrors: [GenericUserError!]!
}

type CustomerGroupUpdatePayload {
  group: CustomerGroup
  operationResults: [CustomerOperationResult!]!
  userErrors: [GenericUserError!]!
}

type CustomerGroupDeletePayload {
  deletedGroupId: ID
  userErrors: [GenericUserError!]!
}

type CustomerTagCreatePayload {
  tag: CustomerTag
  userErrors: [GenericUserError!]!
}

type CustomerTagUpdatePayload {
  tag: CustomerTag
  operationResults: [CustomerOperationResult!]!
  userErrors: [GenericUserError!]!
}

type CustomerTagDeletePayload {
  deletedTagId: ID
  userErrors: [GenericUserError!]!
}

type CustomerSegmentCreatePayload {
  segment: CustomerSegment
  userErrors: [CustomerSegmentUserError!]!
}

type CustomerSegmentUpdatePayload {
  segment: CustomerSegment
  operationResults: [CustomerOperationResult!]!
  userErrors: [CustomerSegmentUserError!]!
}

type CustomerSegmentUserError implements UserError {
  message: String!
  field: [String!]
  code: String!
  diagnostic: CustomerSegmentQueryDiagnostic
}

type CustomerSegmentDeletePayload {
  deletedSegmentId: ID
  userErrors: [GenericUserError!]!
}
