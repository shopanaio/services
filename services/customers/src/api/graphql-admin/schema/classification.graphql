enum CustomerAssignmentSource {
  MANUAL
  RULE
  IMPORT
  SYSTEM
}

enum CustomerSegmentType {
  MANUAL
  DYNAMIC
}

enum CustomerSegmentStatus {
  DRAFT
  ACTIVE
  ARCHIVED
}

enum CustomerSegmentMaterializationStatus {
  PENDING
  RUNNING
  READY
  FAILED
}

type CustomerGroup implements Node {
  id: ID!
  code: String!
  name: String!
  description: String
  isDefault: Boolean!
  isActive: Boolean!
  """
  Aggregate revision incremented by definition, state and membership changes.
  """
  revision: Int!
  customersCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  customerMemberships(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerGroupMembershipWhereInput
    orderBy: [CustomerGroupMembershipOrderByInput!]
  ): CustomerGroupMembershipConnection!
}

type CustomerGroupConnection {
  edges: [CustomerGroupEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerGroupEdge {
  node: CustomerGroup!
  cursor: String!
}

type CustomerGroupMembership implements Node {
  id: ID!
  customer: Customer!
  group: CustomerGroup!
  isPrimary: Boolean!
  source: CustomerAssignmentSource!
  assignedById: String
  assignedAt: DateTime!
  expiresAt: DateTime
  isActive: Boolean!
}

type CustomerGroupMembershipConnection {
  edges: [CustomerGroupMembershipEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerGroupMembershipEdge {
  node: CustomerGroupMembership!
  cursor: String!
}

type CustomerTag implements Node {
  id: ID!
  name: String!
  normalizedName: String!
  customersCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  customerAssignments(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerTagAssignmentWhereInput
    orderBy: [CustomerTagAssignmentOrderByInput!]
  ): CustomerTagAssignmentConnection!
}

type CustomerTagConnection {
  edges: [CustomerTagEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerTagEdge {
  node: CustomerTag!
  cursor: String!
}

type CustomerTagAssignment implements Node {
  id: ID!
  customer: Customer!
  tag: CustomerTag!
  assignedById: String
  assignedAt: DateTime!
}

type CustomerTagAssignmentConnection {
  edges: [CustomerTagAssignmentEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerTagAssignmentEdge {
  node: CustomerTagAssignment!
  cursor: String!
}

type CustomerSegment implements Node {
  id: ID!
  name: String!
  description: String
  """
  Optional merchant-selected #RRGGBB presentation color.
  """
  color: String
  type: CustomerSegmentType!
  status: CustomerSegmentStatus!
  query: String
  definition: JSON!
  definitionRevision: Int!
  evaluationGeneration: Int!
  materializationStatus: CustomerSegmentMaterializationStatus
  createdById: String
  """
  Aggregate revision incremented by definition, state and membership changes.
  """
  revision: Int!
  customersCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  customerMemberships(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerSegmentMembershipWhereInput
    orderBy: [CustomerSegmentMembershipOrderByInput!]
  ): CustomerSegmentMembershipConnection!
}

type CustomerSegmentConnection {
  edges: [CustomerSegmentEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerSegmentEdge {
  node: CustomerSegment!
  cursor: String!
}

type CustomerSegmentMembership implements Node {
  id: ID!
  customer: Customer!
  segment: CustomerSegment!
  source: CustomerAssignmentSource!
  evaluatedAt: DateTime!
  expiresAt: DateTime
  isActive: Boolean!
}

type CustomerSegmentMembershipConnection {
  edges: [CustomerSegmentMembershipEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerSegmentMembershipEdge {
  node: CustomerSegmentMembership!
  cursor: String!
}

input CustomerGroupCreateInput {
  code: String!
  name: String!
  description: String
  isDefault: Boolean = false
  isActive: Boolean = true
}

input CustomerGroupDefinitionUpdateInput {
  code: String
  name: String
  description: String
}

input CustomerGroupStateUpdateInput {
  isDefault: Boolean
  isActive: Boolean
}

"""
Create a customer's membership in this group.
"""
input CustomerGroupMembershipRelationCreateInput {
  customerId: ID!
  isPrimary: Boolean = false
  expiresAt: DateTime
}

input CustomerGroupMembershipRelationPatchInput {
  isPrimary: Boolean
  expiresAt: DateTime
}

enum CustomerGroupMembershipOperationAction {
  CREATE
  UPDATE
  DELETE
}

"""
One ordered membership operation owned by the customer group.
"""
input CustomerGroupOwnedMembershipOperationInput {
  action: CustomerGroupMembershipOperationAction!
  membershipId: ID
  values: CustomerGroupMembershipRelationCreateInput
  patch: CustomerGroupMembershipRelationPatchInput
}

input CustomerGroupUpdateInput {
  definition: CustomerGroupDefinitionUpdateInput
  state: CustomerGroupStateUpdateInput
  memberships: [CustomerGroupOwnedMembershipOperationInput!]
}

input CustomerTagCreateInput {
  name: String!
}

input CustomerTagAssignmentRelationCreateInput {
  customerId: ID!
}

enum CustomerTagAssignmentOperationAction {
  LINK
  UNLINK
}

"""
One ordered customer assignment operation owned by the tag.
"""
input CustomerTagOwnedAssignmentOperationInput {
  action: CustomerTagAssignmentOperationAction!
  assignmentId: ID
  values: CustomerTagAssignmentRelationCreateInput
}

input CustomerTagUpdateInput {
  name: String
  assignments: [CustomerTagOwnedAssignmentOperationInput!]
}

input CustomerSegmentCreateInput {
  name: String!
  description: String
  color: String
  type: CustomerSegmentType!
  """
  Defaults to DRAFT when omitted.
  """
  status: CustomerSegmentStatus
  query: String
}

input CustomerSegmentDetailsUpdateInput {
  name: String
  description: String
  color: String
}

input CustomerSegmentDefinitionUpdateInput {
  query: String!
}

enum CustomerSegmentDiagnosticSeverity {
  ERROR
  WARNING
}

type CustomerSegmentQueryDiagnostic {
  code: String!
  message: String!
  severity: CustomerSegmentDiagnosticSeverity!
  startOffset: Int!
  endOffset: Int!
  line: Int!
  column: Int!
}

type CustomerSegmentQueryValidationResult {
  valid: Boolean!
  canonicalQuery: String
  definition: JSON
  complexity: Int
  diagnostics: [CustomerSegmentQueryDiagnostic!]!
}

enum CustomerSegmentAttributeKind {
  SCALAR
  LIST
  FUNCTION
  VIRTUAL
}

enum CustomerSegmentAttributeAvailability {
  AVAILABLE
  UNAVAILABLE
}

type CustomerSegmentFunctionParameterDescriptor {
  name: String!
  presentationKey: String!
  valueType: String!
  operators: [String!]!
  enumValues: [String!]!
  aggregate: Boolean!
  nullable: Boolean!
}

type CustomerSegmentAttributeDescriptor {
  name: String!
  presentationKey: String!
  kind: CustomerSegmentAttributeKind!
  valueType: String!
  operators: [String!]!
  enumValues: [String!]!
  parameters: [CustomerSegmentFunctionParameterDescriptor!]!
  availability: CustomerSegmentAttributeAvailability!
  unavailabilityReason: String
}

type CustomerSegmentPreview {
  validation: CustomerSegmentQueryValidationResult!
  customers: CustomerConnection
  totalCount: Int
  timedOut: Boolean!
}

input CustomerSegmentStateUpdateInput {
  status: CustomerSegmentStatus
}

input CustomerSegmentMembershipRelationCreateInput {
  customerId: ID!
  expiresAt: DateTime
}

input CustomerSegmentMembershipRelationPatchInput {
  expiresAt: DateTime
}

enum CustomerSegmentMembershipOperationAction {
  CREATE
  UPDATE
  DELETE
  SET
}

"""
One ordered membership operation owned by the customer segment.
"""
input CustomerSegmentOwnedMembershipOperationInput {
  action: CustomerSegmentMembershipOperationAction!
  membershipId: ID
  values: CustomerSegmentMembershipRelationCreateInput
  patch: CustomerSegmentMembershipRelationPatchInput
  """
  Customer IDs used by SET to atomically replace all manual memberships.
  """
  customerIds: [ID!]
}

input CustomerSegmentUpdateInput {
  details: CustomerSegmentDetailsUpdateInput
  definition: CustomerSegmentDefinitionUpdateInput
  state: CustomerSegmentStateUpdateInput
  memberships: [CustomerSegmentOwnedMembershipOperationInput!]
}

input CustomerGroupMembershipValuesInput {
  groupId: ID!
  isPrimary: Boolean = false
  expiresAt: DateTime
}

enum CustomerGroupMembershipAssignmentAction {
  LINK
  UPDATE
  UNLINK
  SET
}

"""
One ordered group-membership operation owned by the customer.
"""
input CustomerGroupMembershipOperationInput {
  action: CustomerGroupMembershipAssignmentAction!
  membershipId: ID
  values: CustomerGroupMembershipValuesInput
  """
  Memberships used by SET to atomically replace all manual group memberships.
  """
  memberships: [CustomerGroupMembershipValuesInput!]
}

input CustomerGroupMembershipsUpdateInput {
  operations: [CustomerGroupMembershipOperationInput!]!
}

enum CustomerTagAssignmentAction {
  LINK
  UNLINK
  SET
}

"""
One ordered tag-assignment operation owned by the customer.
"""
input CustomerTagAssignmentOperationInput {
  action: CustomerTagAssignmentAction!
  tagId: ID
  """
  Tag IDs used by SET to atomically replace all tag assignments.
  """
  tagIds: [ID!]
}

input CustomerTagAssignmentsUpdateInput {
  operations: [CustomerTagAssignmentOperationInput!]!
}

enum CustomerSegmentMembershipAssignmentAction {
  LINK
  UNLINK
  SET
}

"""
One ordered segment-membership operation owned by the customer.
"""
input CustomerSegmentMembershipOperationInput {
  action: CustomerSegmentMembershipAssignmentAction!
  segmentId: ID
  """
  Segment IDs used by SET to atomically replace all manual segment memberships.
  """
  segmentIds: [ID!]
}

input CustomerSegmentMembershipsUpdateInput {
  operations: [CustomerSegmentMembershipOperationInput!]!
}

type CustomerGroupCreatePayload {
  customerGroup: CustomerGroup
  userErrors: [GenericUserError!]!
}

type CustomerGroupUpdatePayload {
  customerGroup: CustomerGroup
  operationResults: [CustomerOperationResult!]!
  userErrors: [GenericUserError!]!
}

type CustomerGroupDeletePayload {
  deletedCustomerGroupId: ID
  userErrors: [GenericUserError!]!
}

type CustomerTagCreatePayload {
  customerTag: CustomerTag
  userErrors: [GenericUserError!]!
}

type CustomerTagUpdatePayload {
  customerTag: CustomerTag
  operationResults: [CustomerOperationResult!]!
  userErrors: [GenericUserError!]!
}

type CustomerTagDeletePayload {
  deletedCustomerTagId: ID
  userErrors: [GenericUserError!]!
}

type CustomerSegmentCreatePayload {
  customerSegment: CustomerSegment
  userErrors: [CustomerSegmentUserError!]!
}

type CustomerSegmentUpdatePayload {
  customerSegment: CustomerSegment
  operationResults: [CustomerOperationResult!]!
  userErrors: [CustomerSegmentUserError!]!
}

type CustomerSegmentUserError implements UserError {
  message: String!
  field: [String!]
  code: String!
  diagnostic: CustomerSegmentQueryDiagnostic
}

type CustomerSegmentDeletePayload {
  deletedCustomerSegmentId: ID
  userErrors: [GenericUserError!]!
}
