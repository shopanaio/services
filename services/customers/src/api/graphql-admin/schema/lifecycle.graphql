enum CustomerMergeStatus {
  REQUESTED
  IN_PROGRESS
  COMPLETED
  FAILED
}

enum CustomerDataRequestType {
  ACCESS
  EXPORT
  CORRECTION
  ERASURE
}

enum CustomerDataRequestStatus {
  PENDING
  PROCESSING
  COMPLETED
  REJECTED
  CANCELLED
}

"""
Idempotent workflow that merges one customer profile into another.
"""
type CustomerMerge implements Node {
  id: ID!
  sourceCustomer: Customer!
  targetCustomer: Customer!
  status: CustomerMergeStatus!
  reason: String
  requestedByType: String!
  requestedById: String
  idempotencyKey: String!
  resolution: JSON!
  errorCode: String
  errorMessage: String
  requestedAt: DateTime!
  startedAt: DateTime
  finishedAt: DateTime
  updatedAt: DateTime!
}

type CustomerMergeConnection {
  edges: [CustomerMergeEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerMergeEdge {
  node: CustomerMerge!
  cursor: String!
}

"""
Auditable privacy access, export, correction or erasure workflow.
"""
type CustomerDataRequest implements Node {
  id: ID!
  customer: Customer!
  type: CustomerDataRequestType!
  status: CustomerDataRequestStatus!
  requestedByType: String!
  requestedById: String
  idempotencyKey: String!
  legalBasis: String
  requestMetadata: JSON!
  resultFileId: ID
  resultFile: File
  rejectionReason: String
  requestedAt: DateTime!
  dueAt: DateTime
  startedAt: DateTime
  finishedAt: DateTime
  updatedAt: DateTime!
}

type CustomerDataRequestConnection {
  edges: [CustomerDataRequestEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerDataRequestEdge {
  node: CustomerDataRequest!
  cursor: String!
}

input CustomerMergeCreateInput {
  sourceCustomerId: ID!
  targetCustomerId: ID!
  reason: String
}

"""
Update merge metadata or either customer relation before processing starts.
"""
input CustomerMergeUpdateInput {
  sourceCustomerId: ID
  targetCustomerId: ID
  reason: String
}

input CustomerMergeDeleteInput {
  id: ID!
}

input CustomerDataRequestCreateInput {
  customerId: ID!
  type: CustomerDataRequestType!
  legalBasis: String
  requestMetadata: JSON
  dueAt: DateTime
}

input CustomerDataRequestCancelOperationInput {
  reason: String
}

"""
Update request metadata, its customer relation, or cancel the workflow.
"""
input CustomerDataRequestUpdateInput {
  customerId: ID
  type: CustomerDataRequestType
  legalBasis: String
  requestMetadata: JSON
  dueAt: DateTime
  cancel: CustomerDataRequestCancelOperationInput
}

input CustomerDataRequestDeleteInput {
  id: ID!
}

type CustomerMergeCreatePayload {
  merge: CustomerMerge
  userErrors: [GenericUserError!]!
}

type CustomerMergeUpdatePayload {
  merge: CustomerMerge
  operationResults: [CustomerOperationResult!]!
  userErrors: [GenericUserError!]!
}

type CustomerMergeDeletePayload {
  deletedMergeId: ID
  userErrors: [GenericUserError!]!
}

type CustomerDataRequestCreatePayload {
  dataRequest: CustomerDataRequest
  userErrors: [GenericUserError!]!
}

type CustomerDataRequestUpdatePayload {
  dataRequest: CustomerDataRequest
  operationResults: [CustomerOperationResult!]!
  userErrors: [GenericUserError!]!
}

type CustomerDataRequestDeletePayload {
  deletedDataRequestId: ID
  userErrors: [GenericUserError!]!
}
