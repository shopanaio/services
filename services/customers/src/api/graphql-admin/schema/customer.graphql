enum CustomerLifecycleStatus {
  ACTIVE
  DISABLED
  BLOCKED
  MERGED
  REDACTED
}

"""Lifecycle states that a merchant administrator may select directly."""
enum CustomerAdminLifecycleStatus {
  ACTIVE
  DISABLED
  BLOCKED
}

enum CustomerAccountStatus {
  GUEST
  INVITED
  REGISTERED
}

"""A store-scoped customer business profile owned by Customers."""
type Customer implements Node @key(fields: "id") {
  id: ID!
  lifecycleStatus: CustomerLifecycleStatus!
  accountStatus: CustomerAccountStatus!

  """Opaque IAM principal identifier. Null for guests and imported profiles."""
  iamPrincipalId: String

  email: Email
  emailVerified: Boolean!
  phoneE164: String
  phoneVerified: Boolean!
  prefix: String
  firstName: String
  middleName: String
  lastName: String
  suffix: String
  displayName: String!
  preferredLocale: String
  dateOfBirth: Date
  gender: String
  companyName: String
  jobTitle: String
  note: String
  """Reason the customer is currently blocked. Null for other lifecycle states."""
  blockedReason: String
  """Internal moderation context visible only to administrators."""
  moderationNote: String
  source: String!
  createdByUserId: String
  revision: Int!
  lastActivityAt: DateTime

  mergedInto: Customer
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  redactedAt: DateTime

  defaultShippingAddress: CustomerAddress
  defaultBillingAddress: CustomerAddress
  addresses(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerAddressWhereInput
    orderBy: [CustomerAddressOrderByInput!]
  ): CustomerAddressConnection!

  taxIdentifiers(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerTaxIdentifierWhereInput
    orderBy: [CustomerTaxIdentifierOrderByInput!]
  ): CustomerTaxIdentifierConnection!

  taxExemptions(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerTaxExemptionWhereInput
    orderBy: [CustomerTaxExemptionOrderByInput!]
  ): CustomerTaxExemptionConnection!

  """At most one current consent record per channel."""
  consents: [CustomerConsent!]!

  groupMemberships(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerGroupMembershipWhereInput
    orderBy: [CustomerGroupMembershipOrderByInput!]
  ): CustomerGroupMembershipConnection!

  tagAssignments(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerTagAssignmentWhereInput
    orderBy: [CustomerTagAssignmentOrderByInput!]
  ): CustomerTagAssignmentConnection!

  segmentMemberships(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerSegmentMembershipWhereInput
    orderBy: [CustomerSegmentMembershipOrderByInput!]
  ): CustomerSegmentMembershipConnection!

  statistics: CustomerStatistics
  monetaryStatistics(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerMonetaryStatisticsWhereInput
    orderBy: [CustomerMonetaryStatisticsOrderByInput!]
  ): CustomerMonetaryStatisticsConnection!

  """The customer's persisted product comparison selection."""
  comparison: CustomerComparison

  """External CRM/ERP identities currently linked to this customer."""
  externalReferences: [CustomerExternalReference!]!
}

"""A store-scoped customer identity in an external CRM or ERP system."""
type CustomerExternalReference implements Node @key(fields: "id") {
  id: ID!
  customer: Customer!
  externalSystem: String!
  externalType: String!
  externalId: String!
  metadata: JSON!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type CustomerConnection {
  edges: [CustomerEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerEdge {
  node: Customer!
  cursor: String!
}

input CustomerCreateInput {
  email: Email
  phoneE164: String
  prefix: String
  firstName: String
  middleName: String
  lastName: String
  suffix: String
  preferredLocale: String
  dateOfBirth: Date
  gender: String
  companyName: String
  jobTitle: String
  note: String
  moderationNote: String
}

input CustomerDeleteInput {
  id: ID!
  expectedRevision: Int
}

"""Personal profile fields in the unified customer update."""
input CustomerProfileUpdateInput {
  prefix: String
  firstName: String
  middleName: String
  lastName: String
  suffix: String
  preferredLocale: String
  dateOfBirth: Date
  gender: String
}

"""Contact projections in the unified customer update."""
input CustomerContactUpdateInput {
  email: Email
  phoneE164: String
}

"""Company fields in the unified customer update."""
input CustomerCompanyUpdateInput {
  companyName: String
  jobTitle: String
}

"""
Lifecycle fields available to Admin. Merge and redaction remain dedicated
workflows and cannot be selected here.
"""
input CustomerStatusUpdateInput {
  status: CustomerAdminLifecycleStatus!
  """Required for BLOCKED. Omit for ACTIVE and DISABLED."""
  blockedReason: String
}

"""Merchant note in the unified customer update."""
input CustomerNoteUpdateInput {
  note: String
}

"""Internal moderation context independent from the merchant note."""
input CustomerModerationUpdateInput {
  moderationNote: String
}

"""Customer-level sections executed by the unified customerUpdate workflow."""
input CustomerUpdateInput {
  profile: CustomerProfileUpdateInput
  contact: CustomerContactUpdateInput
  company: CustomerCompanyUpdateInput
  status: CustomerStatusUpdateInput
  note: CustomerNoteUpdateInput
  moderation: CustomerModerationUpdateInput
  addresses: CustomerAddressesUpdateInput
  consents: CustomerConsentsUpdateInput
  taxIdentifiers: CustomerTaxIdentifiersUpdateInput
  taxExemptions: CustomerTaxExemptionsUpdateInput
  groups: CustomerGroupMembershipsUpdateInput
  tags: CustomerTagAssignmentsUpdateInput
  segments: CustomerSegmentMembershipsUpdateInput
}

enum CustomerOperationType {
  PROFILE_UPDATE
  CONTACT_UPDATE
  COMPANY_UPDATE
  STATUS_UPDATE
  NOTE_UPDATE
  MODERATION_UPDATE
  ADDRESS_UPDATE
  CONSENT_UPDATE
  TAX_IDENTIFIER_UPDATE
  TAX_EXEMPTION_UPDATE
  GROUP_UPDATE
  TAG_UPDATE
  SEGMENT_UPDATE
  MERGE_UPDATE
  DATA_REQUEST_UPDATE
}

"""Result of one operation in a customer-domain update."""
type CustomerOperationResult {
  type: CustomerOperationType!
  applied: Boolean!
  errors: [GenericUserError!]!
}

type CustomerCreatePayload {
  customer: Customer
  userErrors: [GenericUserError!]!
}

type CustomerUpdatePayload {
  customer: Customer
  operationResults: [CustomerOperationResult!]!
  userErrors: [GenericUserError!]!
}

type CustomerDeletePayload {
  deletedCustomerId: ID
  userErrors: [GenericUserError!]!
}
