extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: [
      "@key"
      "@requires"
      "@provides"
      "@external"
      "@shareable"
      "@override"
      "@inaccessible"
    ]
  )

type Query {
  """
  Customers Admin query namespace.
  """
  customersQuery: CustomersQuery!
}

type Mutation {
  """
  Customers Admin mutation namespace.
  """
  customersMutation: CustomersMutation!
}

"""
Store-scoped customer reads. The current Store is taken from trusted context.
"""
type CustomersQuery {
  """
  Authentication settings for customer accounts in the current store.
  """
  customerAccountsSettings: CustomerAccountsSettings

  """
  Resolve a customer-owned Relay node by global ID.
  """
  node(id: ID!): Node

  """
  Resolve customer-owned Relay nodes while preserving input order.
  """
  nodes(ids: [ID!]!): [Node]!

  customer(id: ID!): Customer
  customerByEmail(email: Email!): Customer
  customers(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerWhereInput
    orderBy: [CustomerOrderByInput!]
  ): CustomerConnection!

  customerAddress(id: ID!): CustomerAddress
  customerTaxIdentifier(id: ID!): CustomerTaxIdentifier
  customerTaxExemption(id: ID!): CustomerTaxExemption
  customerConsent(id: ID!): CustomerConsent

  customerGroup(id: ID!): CustomerGroup
  customerGroups(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerGroupWhereInput
    orderBy: [CustomerGroupOrderByInput!]
  ): CustomerGroupConnection!

  customerTag(id: ID!): CustomerTag
  customerTags(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerTagWhereInput
    orderBy: [CustomerTagOrderByInput!]
  ): CustomerTagConnection!

  customerSegment(id: ID!): CustomerSegment
  customerSegments(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerSegmentWhereInput
    orderBy: [CustomerSegmentOrderByInput!]
  ): CustomerSegmentConnection!

  customerSegmentQueryValidate(query: String!): CustomerSegmentQueryValidationResult!
  customerSegmentPreview(query: String!, first: Int = 50, after: String): CustomerSegmentPreview!
  customerSegmentAttributeCatalog: [CustomerSegmentAttributeDescriptor!]!

  customerMerge(id: ID!): CustomerMerge
  customerMerges(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerMergeWhereInput
    orderBy: [CustomerMergeOrderByInput!]
  ): CustomerMergeConnection!

  customerDataRequest(id: ID!): CustomerDataRequest
  customerDataRequests(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerDataRequestWhereInput
    orderBy: [CustomerDataRequestOrderByInput!]
  ): CustomerDataRequestConnection!
}

"""
Store-scoped customer commands.
"""
type CustomersMutation {
  """
  Replace the enabled customer authentication methods for the current store.
  """
  customerAccountsSettingsUpdate(
    operations: CustomerAccountsSettingsUpdateInput!
  ): CustomerAccountsSettingsUpdatePayload!

  customerCreate(input: CustomerCreateInput!): CustomerCreatePayload!
  """
  Unified customer profile update.
  """
  customerUpdate(
    """
    The customer ID to update.
    """
    customerId: ID!
    """
    Customer-level operations executed by one update workflow.
    """
    operations: CustomerUpdateInput!
  ): CustomerUpdatePayload!
  customerDelete(customerId: ID!): CustomerDeletePayload!

  customerGroupCreate(input: CustomerGroupCreateInput!): CustomerGroupCreatePayload!
  customerGroupUpdate(
    groupId: ID!
    operations: CustomerGroupUpdateInput!
  ): CustomerGroupUpdatePayload!
  customerGroupDelete(groupId: ID!): CustomerGroupDeletePayload!

  customerTagCreate(input: CustomerTagCreateInput!): CustomerTagCreatePayload!
  customerTagUpdate(tagId: ID!, operations: CustomerTagUpdateInput!): CustomerTagUpdatePayload!
  customerTagDelete(tagId: ID!): CustomerTagDeletePayload!

  customerSegmentCreate(input: CustomerSegmentCreateInput!): CustomerSegmentCreatePayload!
  customerSegmentUpdate(
    segmentId: ID!
    operations: CustomerSegmentUpdateInput!
  ): CustomerSegmentUpdatePayload!
  customerSegmentDelete(segmentId: ID!): CustomerSegmentDeletePayload!

  customerMergeCreate(input: CustomerMergeCreateInput!): CustomerMergeCreatePayload!
  customerMergeUpdate(
    mergeId: ID!
    operations: CustomerMergeUpdateInput!
  ): CustomerMergeUpdatePayload!
  customerMergeDelete(mergeId: ID!): CustomerMergeDeletePayload!

  customerDataRequestCreate(
    input: CustomerDataRequestCreateInput!
  ): CustomerDataRequestCreatePayload!
  customerDataRequestUpdate(
    dataRequestId: ID!
    operations: CustomerDataRequestUpdateInput!
  ): CustomerDataRequestUpdatePayload!
  customerDataRequestDelete(dataRequestId: ID!): CustomerDataRequestDeletePayload!
}
