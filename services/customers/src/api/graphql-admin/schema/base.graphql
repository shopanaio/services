extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: [
      "@key"
      "@requires"
      "@provides"
      "@external"
      "@shareable"
      "@override"
      "@inaccessible"
    ]
  )

type Query {
  """Customers Admin query namespace."""
  customersQuery: CustomersQuery!
}

type Mutation {
  """Customers Admin mutation namespace."""
  customersMutation: CustomersMutation!
}

"""Store-scoped customer reads. The current Store is taken from trusted context."""
type CustomersQuery {
  """Resolve any customer-owned Relay node by global ID."""
  node(id: ID!): Node

  """Resolve customer-owned Relay nodes while preserving input order."""
  nodes(ids: [ID!]!): [Node]!

  customer(id: ID!): Customer
  customerByEmail(email: Email!): Customer
  customerByIamPrincipalId(iamPrincipalId: String!): Customer
  customerByExternalReference(
    externalSystem: String!
    externalType: String = "customer"
    externalId: String!
  ): Customer
  customers(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerWhereInput
    orderBy: [CustomerOrderByInput!]
  ): CustomerConnection!

  customerAddress(id: ID!): CustomerAddress
  customerTaxIdentifier(id: ID!): CustomerTaxIdentifier
  customerTaxExemption(id: ID!): CustomerTaxExemption
  customerConsent(id: ID!): CustomerConsent

  customerConsentEvents(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerConsentEventWhereInput
    orderBy: [CustomerConsentEventOrderByInput!]
  ): CustomerConsentEventConnection!

  customerGroup(id: ID!): CustomerGroup
  customerGroups(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerGroupWhereInput
    orderBy: [CustomerGroupOrderByInput!]
  ): CustomerGroupConnection!

  customerTag(id: ID!): CustomerTag
  customerTags(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerTagWhereInput
    orderBy: [CustomerTagOrderByInput!]
  ): CustomerTagConnection!

  customerSegment(id: ID!): CustomerSegment
  customerSegments(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerSegmentWhereInput
    orderBy: [CustomerSegmentOrderByInput!]
  ): CustomerSegmentConnection!

  customerExternalReference(id: ID!): CustomerExternalReference

  customerMerge(id: ID!): CustomerMerge
  customerMerges(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerMergeWhereInput
    orderBy: [CustomerMergeOrderByInput!]
  ): CustomerMergeConnection!

  customerDataRequest(id: ID!): CustomerDataRequest
  customerDataRequests(
    first: Int
    after: String
    last: Int
    before: String
    where: CustomerDataRequestWhereInput
    orderBy: [CustomerDataRequestOrderByInput!]
  ): CustomerDataRequestConnection!
}

"""Store-scoped customer commands."""
type CustomersMutation {
  customerCreate(input: CustomerCreateInput!): CustomerCreatePayload!
  customerUpdate(input: CustomerUpdateInput!): CustomerUpdatePayload!
  customerDelete(input: CustomerDeleteInput!): CustomerDeletePayload!

  customerAddressCreate(input: CustomerAddressCreateInput!): CustomerAddressCreatePayload!
  customerAddressUpdate(input: CustomerAddressUpdateInput!): CustomerAddressUpdatePayload!
  customerAddressDelete(input: CustomerAddressDeleteInput!): CustomerAddressDeletePayload!
  customerAddressDefaultsUpdate(
    input: CustomerAddressDefaultsUpdateInput!
  ): CustomerAddressDefaultsUpdatePayload!

  customerTaxIdentifierCreate(
    input: CustomerTaxIdentifierCreateInput!
  ): CustomerTaxIdentifierCreatePayload!
  customerTaxIdentifierUpdate(
    input: CustomerTaxIdentifierUpdateInput!
  ): CustomerTaxIdentifierUpdatePayload!
  customerTaxIdentifierDelete(
    input: CustomerTaxIdentifierDeleteInput!
  ): CustomerTaxIdentifierDeletePayload!

  customerTaxExemptionCreate(
    input: CustomerTaxExemptionCreateInput!
  ): CustomerTaxExemptionCreatePayload!
  customerTaxExemptionUpdate(
    input: CustomerTaxExemptionUpdateInput!
  ): CustomerTaxExemptionUpdatePayload!
  customerTaxExemptionDelete(
    input: CustomerTaxExemptionDeleteInput!
  ): CustomerTaxExemptionDeletePayload!

  """Change current consent state and append an immutable evidence event."""
  customerConsentSet(input: CustomerConsentSetInput!): CustomerConsentSetPayload!

  customerGroupCreate(input: CustomerGroupCreateInput!): CustomerGroupCreatePayload!
  customerGroupUpdate(input: CustomerGroupUpdateInput!): CustomerGroupUpdatePayload!
  customerGroupDelete(input: CustomerGroupDeleteInput!): CustomerGroupDeletePayload!
  customerGroupMembershipSet(
    input: CustomerGroupMembershipSetInput!
  ): CustomerGroupMembershipSetPayload!
  customerGroupMembershipDelete(
    input: CustomerGroupMembershipDeleteInput!
  ): CustomerGroupMembershipDeletePayload!

  customerTagCreate(input: CustomerTagCreateInput!): CustomerTagCreatePayload!
  customerTagUpdate(input: CustomerTagUpdateInput!): CustomerTagUpdatePayload!
  customerTagDelete(input: CustomerTagDeleteInput!): CustomerTagDeletePayload!
  customerTagAssign(input: CustomerTagAssignInput!): CustomerTagAssignPayload!
  customerTagUnassign(input: CustomerTagUnassignInput!): CustomerTagUnassignPayload!

  customerSegmentCreate(
    input: CustomerSegmentCreateInput!
  ): CustomerSegmentCreatePayload!
  customerSegmentUpdate(
    input: CustomerSegmentUpdateInput!
  ): CustomerSegmentUpdatePayload!
  customerSegmentDelete(
    input: CustomerSegmentDeleteInput!
  ): CustomerSegmentDeletePayload!
  customerSegmentMembershipSet(
    input: CustomerSegmentMembershipSetInput!
  ): CustomerSegmentMembershipSetPayload!
  customerSegmentMembershipDelete(
    input: CustomerSegmentMembershipDeleteInput!
  ): CustomerSegmentMembershipDeletePayload!
  customerSegmentEvaluate(
    input: CustomerSegmentEvaluateInput!
  ): CustomerSegmentEvaluatePayload!

  customerExternalReferenceUpsert(
    input: CustomerExternalReferenceUpsertInput!
  ): CustomerExternalReferenceUpsertPayload!
  customerExternalReferenceDelete(
    input: CustomerExternalReferenceDeleteInput!
  ): CustomerExternalReferenceDeletePayload!

  customerMergeRequest(input: CustomerMergeRequestInput!): CustomerMergeRequestPayload!
  customerDataRequestCreate(
    input: CustomerDataRequestCreateInput!
  ): CustomerDataRequestCreatePayload!
  customerDataRequestCancel(
    input: CustomerDataRequestCancelInput!
  ): CustomerDataRequestCancelPayload!
}
