enum CustomerTaxIdentifierStatus {
  UNVERIFIED
  VERIFIED
  REJECTED
  EXPIRED
}

enum CustomerTaxExemptionStatus {
  ACTIVE
  EXPIRED
  REVOKED
}

type CustomerTaxIdentifier implements Node {
  id: ID!
  customer: Customer!
  identifierType: String!
  countryCode: String
  value: String!
  normalizedValue: String!
  status: CustomerTaxIdentifierStatus!
  isPrimary: Boolean!
  verifiedAt: DateTime
  validFrom: Date
  validTo: Date
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
}

type CustomerTaxIdentifierConnection {
  edges: [CustomerTaxIdentifierEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerTaxIdentifierEdge {
  node: CustomerTaxIdentifier!
  cursor: String!
}

type CustomerTaxExemption implements Node {
  id: ID!
  customer: Customer!
  code: String!
  countryCode: String
  regionCode: String
  reason: String
  status: CustomerTaxExemptionStatus!
  certificateFileId: ID
  certificateFile: File
  validFrom: Date
  validTo: Date
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
}

type CustomerTaxExemptionConnection {
  edges: [CustomerTaxExemptionEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerTaxExemptionEdge {
  node: CustomerTaxExemption!
  cursor: String!
}

input CustomerTaxIdentifierPatchInput {
  identifierType: String
  countryCode: String
  value: String
  status: CustomerTaxIdentifierStatus
  isPrimary: Boolean
  validFrom: Date
  validTo: Date
}

input CustomerTaxExemptionPatchInput {
  code: String
  countryCode: String
  regionCode: String
  reason: String
  status: CustomerTaxExemptionStatus
  certificateFileId: ID
  validFrom: Date
  validTo: Date
}

input CustomerTaxIdentifierCreateOperationInput {
  identifierType: String!
  countryCode: String
  value: String!
  """
  Defaults to UNVERIFIED when omitted.
  """
  status: CustomerTaxIdentifierStatus
  isPrimary: Boolean = false
  validFrom: Date
  validTo: Date
}

input CustomerTaxIdentifierUpdateOperationInput {
  taxIdentifierId: ID!
  operations: CustomerTaxIdentifierPatchInput!
}

"""
Batched tax identifier changes scoped to the customer being updated.
"""
input CustomerTaxIdentifiersUpdateInput {
  create: [CustomerTaxIdentifierCreateOperationInput!]
  update: [CustomerTaxIdentifierUpdateOperationInput!]
  deleteIds: [ID!]
}

input CustomerTaxExemptionCreateOperationInput {
  code: String!
  countryCode: String
  regionCode: String
  reason: String
  """
  Defaults to ACTIVE when omitted.
  """
  status: CustomerTaxExemptionStatus
  certificateFileId: ID
  validFrom: Date
  validTo: Date
}

input CustomerTaxExemptionUpdateOperationInput {
  taxExemptionId: ID!
  operations: CustomerTaxExemptionPatchInput!
}

"""
Batched tax exemption changes scoped to the customer being updated.
"""
input CustomerTaxExemptionsUpdateInput {
  create: [CustomerTaxExemptionCreateOperationInput!]
  update: [CustomerTaxExemptionUpdateOperationInput!]
  deleteIds: [ID!]
}
