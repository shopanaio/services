"""
The canonical storefront customer entity owned by the Customers service.

Other storefront subgraphs reference and extend this entity by its global ID.
"""
type Customer @key(fields: "id") {
  """Globally unique customer ID."""
  id: ID!
  """Customer's first name, if the profile has been completed."""
  firstName: String
  """Customer's last name, if the profile has been completed."""
  lastName: String
  """Display name derived from available profile and contact information."""
  displayName: String!
  """Authenticated customer's email address and its marketing consent."""
  emailAddress: CustomerEmailAddress
  """Authenticated customer's phone number."""
  phoneNumber: CustomerPhoneNumber
  """The customer's default mailing address, when one has been selected."""
  defaultAddress: CustomerAddress
  """Mailing addresses owned by the customer."""
  addresses: [CustomerAddress!]!

  """
  Wishlist collections owned by the authenticated customer.

  Results are ordered by creation time ascending and then by ID ascending.
  Omitting all pagination arguments returns the first 20 entries. At most 100
  entries can be requested in either direction.
  """
  wishlists(
    """Number of wishlists to return from the start of the selected range."""
    first: Int
    """Return wishlists after this opaque cursor."""
    after: Cursor
    """Number of wishlists to return from the end of the selected range."""
    last: Int
    """Return wishlists before this opaque cursor."""
    before: Cursor
  ): CustomerWishlistConnection!

  """
  The customer's primary wishlist, or null when no wishlist has been created.

  The first wishlist created for a customer becomes the default. The default
  wishlist can be renamed but cannot be deleted.
  """
  defaultWishlist: CustomerWishlist

  """
  Returns one wishlist owned by the authenticated customer.

  The ID must be a CustomerWishlist global ID belonging to the current
  customer and store. Missing, foreign, and inaccessible wishlists all return
  null so that ownership information is not disclosed.
  """
  wishlist(
    """Global ID of the wishlist to return."""
    id: ID!
  ): CustomerWishlist
}

"""
Minimal personal profile input for the initial storefront contract.
Additional customer-editable fields can be added when their behavior is defined.
"""
input CustomerUpdateInput {
  """New first name. Omit to leave it unchanged."""
  firstName: String
  """New last name. Omit to leave it unchanged."""
  lastName: String
}

"""Result of updating the authenticated customer's profile."""
type CustomerUpdatePayload {
  """The updated customer, or null when the update could not be applied."""
  customer: Customer
  """User-facing validation or business errors produced by the operation."""
  userErrors: [CustomerUserError!]!
}

"""
A customer-facing validation, ownership, dependency, or business error.

Wishlist operations use stable codes including NOT_FOUND,
WISHLIST_NAME_TAKEN, PRODUCT_NOT_FOUND, PRODUCT_NOT_PUBLISHED, and
CATALOG_UNAVAILABLE. Missing and foreign wishlist resources deliberately share
the NOT_FOUND code.
"""
type CustomerUserError implements DisplayableError {
  """Path to the input field associated with the error, when available."""
  field: [String!]
  """Human-readable error message safe to show to the customer."""
  message: String!
  """Stable machine-readable error code."""
  code: String!
  """Whether retrying the operation may succeed without changing its input."""
  retryable: Boolean!
}
