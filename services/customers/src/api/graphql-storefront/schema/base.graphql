type Query {
  """
  Returns the customer associated with the authenticated storefront session.
  The customer identity is resolved from trusted request context rather than
  from a customer ID or access token supplied as a GraphQL argument.
  """
  customer: Customer
}

type Mutation {
  """
  Updates personal profile fields for the authenticated customer.
  Authentication and customer ownership are resolved from storefront context.
  """
  customerUpdate(input: CustomerUpdateInput!): CustomerUpdatePayload!

  """
  Creates a mailing address owned by the authenticated customer.
  The new address can optionally become the customer's default address.
  """
  customerAddressCreate(
    """Address values to store."""
    address: CustomerAddressInput!
    """Whether the new address should become the default address."""
    defaultAddress: Boolean = false
  ): CustomerAddressCreatePayload!

  """
  Updates a mailing address owned by the authenticated customer.
  The operation must reject addresses belonging to another customer.
  """
  customerAddressUpdate(
    """Global ID of the customer address to update."""
    addressId: ID!
    """Address fields to replace or update."""
    address: CustomerAddressInput
    """Whether the address should become the default address."""
    defaultAddress: Boolean
  ): CustomerAddressUpdatePayload!

  """
  Deletes a mailing address owned by the authenticated customer.
  The operation must reject addresses belonging to another customer.
  """
  customerAddressDelete(
    """Global ID of the customer address to delete."""
    addressId: ID!
  ): CustomerAddressDeletePayload!

  """
  Subscribes the authenticated customer's verified email address to marketing.
  """
  customerEmailMarketingSubscribe: CustomerEmailMarketingSubscribePayload!

  """
  Unsubscribes the authenticated customer's email address from marketing.
  """
  customerEmailMarketingUnsubscribe: CustomerEmailMarketingUnsubscribePayload!

  """
  Creates a wishlist for the authenticated customer.

  Customer and store ownership are derived only from trusted storefront
  context. The first wishlist created for the customer becomes the default.
  """
  wishlistCreate(
    """Values for the new wishlist."""
    input: WishlistCreateInput!
  ): WishlistCreatePayload!

  """
  Renames a wishlist owned by the authenticated customer.

  Missing and foreign wishlist IDs produce the same NOT_FOUND user error.
  The default wishlist may be renamed.
  """
  wishlistUpdate(
    """Global ID of the wishlist to rename."""
    id: ID!
    """New values for the wishlist."""
    input: WishlistUpdateInput!
  ): WishlistUpdatePayload!

  """
  Deletes a non-default wishlist owned by the authenticated customer.

  Its items are deleted with it. The default wishlist cannot be deleted.
  Missing and foreign wishlist IDs produce the same NOT_FOUND user error.
  """
  wishlistDelete(
    """Global ID of the wishlist to delete."""
    id: ID!
  ): WishlistDeletePayload!

  """
  Adds a published product to one of the authenticated customer's wishlists.

  When wishlistId is omitted, the existing default wishlist is used or a new
  default wishlist named `Wishlist` is created. Repeating the operation for a
  product already in the selected wishlist returns the existing item.
  """
  wishlistProductAdd(
    """Global ID of the published Catalog product to save."""
    productId: ID!
    """Target wishlist global ID; omit to use the default wishlist."""
    wishlistId: ID
  ): WishlistProductAddPayload!

  """
  Removes a saved product item owned by the authenticated customer.

  Missing and foreign item IDs produce the same NOT_FOUND user error.
  """
  wishlistProductRemove(
    """Global ID of the wishlist item to remove."""
    itemId: ID!
  ): WishlistProductRemovePayload!
}
