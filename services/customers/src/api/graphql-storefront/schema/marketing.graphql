enum CustomerMarketingConsentChannel {
  EMAIL
  SMS
  WHATSAPP
  PUSH
}

enum CustomerMarketingConsentState {
  NOT_SUBSCRIBED
  PENDING
  SUBSCRIBED
  UNSUBSCRIBED
  INVALID
}

enum CustomerMarketingConsentOptInLevel {
  UNKNOWN
  SINGLE_OPT_IN
  CONFIRMED_OPT_IN
}

"""Current customer-selectable consent for one marketing channel."""
type CustomerMarketingConsent {
  channel: CustomerMarketingConsentChannel!
  state: CustomerMarketingConsentState!
  optInLevel: CustomerMarketingConsentOptInLevel!
  consentedAt: DateTime
  withdrawnAt: DateTime
  updatedAt: DateTime!
}

"""The authenticated customer's email projection."""
type CustomerEmailAddress {
  emailAddress: Email!
  verified: Boolean!
  marketingConsent: CustomerMarketingConsent
}

"""The authenticated customer's phone projection."""
type CustomerPhoneNumber {
  phoneNumber: String!
  verified: Boolean!
  marketingConsent: CustomerMarketingConsent
}

"""
Customer-selectable target states. Pending/invalid states are produced only by
the server and cannot be selected directly.
"""
enum CustomerMarketingConsentTargetState {
  SUBSCRIBED
  UNSUBSCRIBED
}

input CustomerMarketingConsentUpdateInput {
  channel: CustomerMarketingConsentChannel!
  state: CustomerMarketingConsentTargetState!
  expectedRevision: Int!
  idempotencyKey: String!
}

type CustomerMarketingConsentUpdatePayload {
  marketingConsent: CustomerMarketingConsent
  customer: Customer
  userErrors: [CustomerUserError!]!
}
