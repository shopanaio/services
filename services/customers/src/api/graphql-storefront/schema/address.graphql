"""
Server-side normalization and validation state for an address.
"""
enum CustomerAddressValidationStatus {
  UNVALIDATED
  VALID
  INVALID
}

enum CustomerAddressDefaultType {
  SHIPPING
  BILLING
}

"""
A normalized international mailing address owned by the current customer.
"""
type CustomerAddress implements Node @key(fields: "id") {
  id: ID!
  label: String
  prefix: String
  firstName: String
  middleName: String
  lastName: String
  suffix: String
  name: String!
  company: String
  address1: String!
  address2: String
  city: String!
  province: String
  provinceCode: String
  country: String
  countryCode: CountryCode!
  zip: String
  phone: String
  isDefaultShipping: Boolean!
  isDefaultBilling: Boolean!
  validationStatus: CustomerAddressValidationStatus!
  validatedAt: DateTime
  formatted: [String!]!
  formattedArea: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type CustomerAddressConnection implements Connection {
  edges: [CustomerAddressEdge!]!
  nodes: [CustomerAddress!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CustomerAddressEdge {
  cursor: Cursor!
  node: CustomerAddress!
}

"""
Portable international mailing-address values.
"""
input CustomerAddressInput {
  label: String
  prefix: String
  firstName: String
  middleName: String
  lastName: String
  suffix: String
  company: String
  address1: String!
  address2: String
  city: String!
  countryCode: CountryCode!
  provinceCode: String
  zip: String
  phone: String
}

input CustomerAddressCreateInput {
  address: CustomerAddressInput!
  defaultShipping: Boolean = false
  defaultBilling: Boolean = false

  idempotencyKey: String!
}

input CustomerAddressUpdateInput {
  addressId: ID!
  address: CustomerAddressInput!
  defaultShipping: Boolean
  defaultBilling: Boolean

  idempotencyKey: String!
}

input CustomerAddressDeleteInput {
  addressId: ID!

  idempotencyKey: String!
}

"""
Atomically sets or clears either customer address default.
"""
input CustomerAddressDefaultSetInput {
  """
  Null clears the selected default.
  """
  addressId: ID
  """
  One or both defaults to assign or clear.
  """
  defaults: [CustomerAddressDefaultType!]!

  idempotencyKey: String!
}

type CustomerAddressCreatePayload {
  customerAddress: CustomerAddress
  customer: Customer
  userErrors: [CustomerUserError!]!
}

type CustomerAddressUpdatePayload {
  customerAddress: CustomerAddress
  customer: Customer
  userErrors: [CustomerUserError!]!
}

type CustomerAddressDeletePayload {
  deletedAddressId: ID
  customer: Customer
  userErrors: [CustomerUserError!]!
}

type CustomerAddressDefaultSetPayload {
  customer: Customer
  userErrors: [CustomerUserError!]!
}
